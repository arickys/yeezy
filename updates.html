<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [UPDATES]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#343941;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -15%,rgba(255,255,255,.065),transparent 32rem),
radial-gradient(circle at 0% 55%,rgba(255,255,255,.018),transparent 28rem),
radial-gradient(circle at 100% 80%,rgba(255,255,255,.015),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.018);
transition:
opacity .6s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);
opacity:.3;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.04),
0 2px 9px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:130px 0 90px;
}

.page-header{
display:grid;
grid-template-columns:1fr auto;
align-items:end;
gap:30px;
padding-bottom:25px;
border-bottom:1px solid var(--line);
}

.header-left{
min-width:0;
}

.logo-mark{
width:78px;
height:78px;
margin-bottom:25px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 18px 30px rgba(0,0,0,.45))
drop-shadow(0 0 30px rgba(255,255,255,.045));
}

.page-title{
margin:0;
font-size:clamp(46px,6vw,66px);
line-height:.9;
letter-spacing:-4px;
font-weight:900;
}

.page-subtitle{
margin-top:13px;
color:var(--muted);
font-size:12px;
line-height:1.5;
}

.header-mark{
width:110px;
height:110px;
display:flex;
align-items:center;
justify-content:center;
opacity:.8;
}

.header-mark img{
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 20px 30px rgba(0,0,0,.45))
drop-shadow(0 0 35px rgba(255,255,255,.045));
}

.updates{
margin-top:25px;
display:grid;
gap:12px;
}

.update{
position:relative;
display:grid;
grid-template-columns:125px minmax(0,1fr) auto;
gap:24px;
align-items:start;
padding:20px;
border:1px solid var(--line);
border-radius:13px;
background:
linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.006)),
var(--surface);
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.update:hover{
transform:translateY(-3px);
border-color:#373b44;
background:var(--surface2);
box-shadow:0 20px 45px rgba(0,0,0,.22);
}

.update-date{
color:#686e78;
font-size:10px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
padding-top:3px;
}

.update-content{
min-width:0;
}

.update-title{
margin:0;
font-size:15px;
font-weight:850;
letter-spacing:-.25px;
}

.update-description{
margin-top:7px;
max-width:680px;
color:#777d87;
font-size:12px;
line-height:1.6;
}

.update-tag{
height:26px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 9px;
border:1px solid #2c3037;
border-radius:7px;
background:rgba(255,255,255,.025);
color:#7d838d;
font-size:9px;
font-weight:850;
letter-spacing:.8px;
text-transform:uppercase;
white-space:nowrap;
}

.update:first-child{
border-color:#30343b;
}

.update:first-child .update-tag{
color:#d4d5d8;
border-color:#454a53;
background:rgba(255,255,255,.055);
}

.empty{
padding:55px 20px;
border:1px dashed #292d34;
border-radius:12px;
text-align:center;
color:#707680;
font-size:12px;
}

.empty-mark{
width:50px;
height:50px;
margin:0 auto 15px;
opacity:.35;
}

.empty-mark img{
width:100%;
height:100%;
object-fit:contain;
}

.page-transition{
position:fixed;
inset:0;
z-index:500;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
pointer-events:none;
opacity:0;
visibility:hidden;
transition:
opacity .42s ease,
visibility .42s ease;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.page-transition img{
width:min(300px,65vw);
height:min(300px,65vw);
object-fit:contain;
opacity:0;
transform:scale(.76);
filter:
drop-shadow(0 28px 50px rgba(0,0,0,.6))
drop-shadow(0 0 55px rgba(255,255,255,.08));
transition:
opacity .62s cubic-bezier(.22,1,.36,1),
transform .78s cubic-bezier(.22,1,.36,1);
}

.page-transition.show img{
opacity:1;
transform:scale(1);
}

.page-transition.fade img{
opacity:0;
transform:scale(1.12);
}

@media(max-width:750px){
.container{
width:calc(100% - 24px);
}

.page-header{
grid-template-columns:1fr;
}

.header-mark{
display:none;
}

.update{
grid-template-columns:1fr;
gap:10px;
}

.update-date{
padding-top:0;
}

.update-tag{
position:absolute;
top:18px;
right:18px;
}
}

@media(max-width:560px){
.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.logo-mark{
width:65px;
height:65px;
margin-bottom:20px;
}

.page-title{
font-size:45px;
letter-spacing:-3px;
}

.page-subtitle{
font-size:11px;
}

.update{
padding:16px;
}

.update-tag{
top:14px;
right:14px;
}

.update-title{
padding-right:70px;
}
}

@media(prefers-reduced-motion:reduce){
body,
.page-transition,
.page-transition img,
.update{
transition:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" id="homeLink">Home</a>
<a href="downloads.html" id="downloadsLink">Downloads</a>
<a href="updates.html" class="active">Updates</a>
</nav>

<main class="container">

<header class="page-header">

<div class="header-left">

<img
class="logo-mark"
src="LOGO2.png"
alt=""

>

<h1 class="page-title">Updates</h1>

<div class="page-subtitle">
Changes, additions, and new releases.
</div>

</div>

<div class="header-mark">
<img src="LOGO2.png" alt="">
</div>

</header>

<section class="updates" id="updates">

<article class="update">

<div class="update-date">
AUG 30, 2026
</div>

<div class="update-content">

<h2 class="update-title">
Archive launch
</h2>

<div class="update-description">
The unYZY archive is now live with the first available release.
</div>

</div>

<div class="update-tag">
New
</div>

</article>

<article class="update">

<div class="update-date">
AUG 30, 2026
</div>

<div class="update-content">

<h2 class="update-title">
New archive layout
</h2>

<div class="update-description">
Downloads and updates have been separated into their own dedicated pages.
</div>

</div>

<div class="update-tag">
Site
</div>

</article>

</section>

</main>

<div class="page-transition" id="pageTransition">
<img id="transitionLogo" src="logo.png" alt="">
</div>

<script>
const pageTransition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const homeLink=document.getElementById("homeLink");
const downloadsLink=document.getElementById("downloadsLink");

function enterPage(){
const transition=sessionStorage.getItem("unyzyTransition");

if(transition==="updates"){
sessionStorage.removeItem("unyzyTransition");

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
document.body.classList.add("ready");
},650);

setTimeout(()=>{
pageTransition.classList.remove("active","show","fade");
},1100);

return;
}

requestAnimationFrame(()=>{
document.body.classList.add("ready");
});
}

function navigateTo(url){
if(document.body.classList.contains("leaving"))return;

document.body.classList.add("leaving");

transitionLogo.src="logo.png";
pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},650);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition","updates");
window.location.href=url;
},900);
}

homeLink.addEventListener("click",event=>{
event.preventDefault();
navigateTo("index.html");
});

downloadsLink.addEventListener("click",event=>{
event.preventDefault();
navigateTo("downloads.html");
});

enterPage();
</script>

</body>
</html>
