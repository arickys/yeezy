<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [DOWNLOADS]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#0f1115;
--surface2:#14171c;
--line:rgba(255,255,255,.075);
--line-strong:rgba(255,255,255,.13);
--text:#f5f5f6;
--muted:#858b95;
--dim:#5d636d;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -15%,rgba(255,255,255,.07),transparent 31rem),
radial-gradient(circle at 0% 55%,rgba(255,255,255,.018),transparent 30rem),
radial-gradient(circle at 100% 75%,rgba(255,255,255,.015),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:
opacity .55s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 72%);
opacity:.3;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(
ellipse at center,
transparent 45%,
rgba(0,0,0,.3) 100%
);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(11,12,15,.74);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.42),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#707680;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 8px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1040px,calc(100% - 36px));
margin:auto;
padding:128px 0 90px;
}

.page-head{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:30px;
padding-bottom:28px;
border-bottom:1px solid var(--line);
}

.kicker{
margin-bottom:11px;
color:#696f79;
font-size:9px;
font-weight:850;
letter-spacing:1.8px;
text-transform:uppercase;
}

.page-title{
margin:0;
font-size:clamp(48px,6vw,70px);
line-height:.9;
letter-spacing:-4.5px;
font-weight:900;
}

.page-subtitle{
margin-top:13px;
max-width:460px;
color:var(--muted);
font-size:12px;
line-height:1.6;
}

.head-info{
display:flex;
align-items:center;
gap:18px;
padding-bottom:3px;
}

.file-count{
color:#777d86;
font-size:10px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
}

.head-line{
width:1px;
height:28px;
background:var(--line);
}

.search-wrap{
position:relative;
margin-top:24px;
}

.search-icon{
position:absolute;
left:16px;
top:50%;
z-index:2;
transform:translateY(-50%);
color:#646a74;
font-size:17px;
line-height:1;
pointer-events:none;
}

.search{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:rgba(255,255,255,.025);
color:#fff;
font-family:inherit;
font-size:12px;
transition:
background .2s ease,
border-color .2s ease,
box-shadow .2s ease;
}

.search::placeholder{
color:#5d626b;
}

.search:hover{
border-color:rgba(255,255,255,.11);
}

.search:focus{
border-color:rgba(255,255,255,.18);
background:rgba(255,255,255,.04);
box-shadow:
0 0 0 3px rgba(255,255,255,.025),
0 10px 35px rgba(0,0,0,.15);
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
margin-top:14px;
}

.file{
position:relative;
display:flex;
align-items:center;
gap:15px;
min-width:0;
padding:15px;
border:1px solid var(--line);
border-radius:13px;
background:
linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.006)),
var(--surface);
box-shadow:0 8px 25px rgba(0,0,0,.08);
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.file:hover{
transform:translateY(-4px);
border-color:var(--line-strong);
background:
linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.008)),
var(--surface2);
box-shadow:0 22px 45px rgba(0,0,0,.22);
}

.file:before{
content:"";
position:absolute;
inset:0;
border-radius:inherit;
pointer-events:none;
background:linear-gradient(
120deg,
rgba(255,255,255,.035),
transparent 35%
);
opacity:0;
transition:opacity .25s ease;
}

.file:hover:before{
opacity:1;
}

.icon{
position:relative;
z-index:1;
width:68px;
height:68px;
flex:0 0 68px;
display:grid;
place-items:center;
overflow:hidden;
border-radius:10px;
background:#181a1f;
border:1px solid rgba(255,255,255,.045);
color:#737983;
font-size:20px;
box-shadow:
inset 0 1px 0 rgba(255,255,255,.025),
0 8px 20px rgba(0,0,0,.2);
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease;
}

.file:hover .icon{
transform:scale(1.035);
border-color:rgba(255,255,255,.09);
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
position:relative;
z-index:1;
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:14px;
font-weight:850;
letter-spacing:-.25px;
}

.description{
margin-top:4px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:var(--muted);
font-size:11px;
}

.type{
display:inline-flex;
align-items:center;
height:20px;
margin-top:8px;
padding:0 7px;
border:1px solid rgba(255,255,255,.07);
border-radius:5px;
background:rgba(255,255,255,.02);
color:#606670;
font-size:8px;
font-weight:850;
letter-spacing:1px;
text-transform:uppercase;
}

.download{
position:relative;
z-index:1;
height:36px;
padding:0 13px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
flex:0 0 auto;
border:1px solid rgba(255,255,255,.14);
border-radius:8px;
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
font-size:10px;
font-weight:850;
transition:
background .18s ease,
border-color .18s ease,
transform .18s ease,
box-shadow .18s ease;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-2px);
box-shadow:0 9px 22px rgba(0,0,0,.28);
}

.download:active{
transform:scale(.96);
}

.empty{
grid-column:1/-1;
padding:55px 20px;
border:1px dashed rgba(255,255,255,.08);
border-radius:13px;
text-align:center;
color:#666c75;
font-size:11px;
background:rgba(255,255,255,.008);
}

.empty strong{
display:block;
margin-bottom:6px;
color:#999ea6;
font-size:12px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-glow{
position:absolute;
width:230px;
height:230px;
border-radius:50%;
background:rgba(255,255,255,.055);
filter:blur(75px);
opacity:0;
transform:scale(.5);
}

.page-transition.show .transition-glow{
opacity:1;
transform:scale(1);
transition:
opacity .55s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-glow{
opacity:0;
transform:scale(1.35);
transition:
opacity .35s ease,
transform .45s ease;
}

.transition-logo{
position:relative;
z-index:2;
width:min(300px,60vw);
height:min(300px,60vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 55px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .5s ease,
transform .7s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.1);
transition:
opacity .38s ease,
transform .5s cubic-bezier(.22,1,.36,1);
}

@media(max-width:760px){

.container{
width:calc(100% - 24px);
}

.page-head{
align-items:flex-start;
}

.downloads{
grid-template-columns:1fr;
}

.file{
padding:14px;
}

}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:103px;
}

.page-head{
display:block;
padding-bottom:24px;
}

.page-title{
font-size:46px;
letter-spacing:-3.5px;
}

.page-subtitle{
font-size:11px;
}

.head-info{
margin-top:18px;
}

.search-wrap{
margin-top:20px;
}

.file{
padding:12px;
gap:12px;
}

.icon{
width:58px;
height:58px;
flex-basis:58px;
}

.name{
font-size:13px;
}

.description{
font-size:10px;
}

.download{
width:36px;
padding:0;
}

.download-text{
display:none;
}

}

@media(prefers-reduced-motion:reduce){

body,
.file,
.download,
.nav a,
.page-transition .transition-logo,
.page-transition .transition-glow{
transition:none;
}

}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" data-page="home">Home</a>
<a href="downloads.html" class="active" data-page="downloads">Downloads</a>
<a href="updates.html" data-page="updates">Updates</a>
</nav>

<main class="container">

<header class="page-head">

<div>
<div class="kicker">Archive</div>
<h1 class="page-title">Downloads</h1>
<div class="page-subtitle">
Browse the available releases and archived files.
</div>
</div>

<div class="head-info">
<div class="file-count" id="fileCount">0 Files</div>
<div class="head-line"></div>
<div class="file-count">ZIP</div>
</div>

</header>

<div class="search-wrap">
<div class="search-icon">⌕</div>
<input
class="search"
id="search"
type="text"
placeholder="Search the archive..."
autocomplete="off"
spellcheck="false"
>
</div>

<section class="downloads" id="downloadsList"></section>

</main>

<div class="page-transition" id="pageTransition">
<div class="transition-glow"></div>
<img class="transition-logo" id="transitionLogo" src="LOGO2.png" alt="">
</div>

<script>
const files=[
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
}
];

const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");
const fileCount=document.getElementById("fileCount");

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function escapeAttr(value){
return escapeHTML(value);
}

function renderFiles(filter=""){
const value=filter.toLowerCase().trim();

const filtered=files.filter(file=>
file.name.toLowerCase().includes(value) ||
file.description.toLowerCase().includes(value)
);

fileCount.textContent=`${filtered.length} ${filtered.length===1?"File":"Files"}`;

if(!filtered.length){
downloads.innerHTML=`
<div class="empty">
<strong>No results</strong>
Nothing in the archive matches your search.
</div>`;
return;
}

downloads.innerHTML=filtered.map(file=>`
<article class="file">

<div class="icon">
<img
src="${escapeAttr(file.icon)}"
alt=""
onerror="this.style.display='none';this.parentElement.textContent='📦'"
>
</div>

<div class="info">
<div class="name">${escapeHTML(file.name)}</div>
<div class="description">${escapeHTML(file.description)}</div>
<div class="type">ZIP Archive</div>
</div>

<a
class="download"
href="${escapeAttr(file.file)}"
download
aria-label="Download ${escapeAttr(file.name)}"
>
<span>↓</span>
<span class="download-text">Download</span>
</a>

</article>
`).join("");
}

search.addEventListener("input",()=>{
renderFiles(search.value);
});

const pageTransition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");

let navigating=false;

function navigate(url,target){
if(navigating)return;

navigating=true;

document.body.classList.add("leaving");

transitionLogo.src=target==="home"?"logo.png":"LOGO2.png";

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},620);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition",target);
window.location.href=url;
},880);
}

links.forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();
navigate(link.href,link.dataset.page);
});
});

function enterPage(){
const transition=sessionStorage.getItem("unyzyTransition");

sessionStorage.removeItem("unyzyTransition");

if(transition==="home" || transition==="downloads" || transition==="updates"){

transitionLogo.src=transition==="home"?"logo.png":"LOGO2.png";

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
document.body.classList.add("ready");
},520);

setTimeout(()=>{
pageTransition.classList.remove("active","show","fade");
},950);

}else{
requestAnimationFrame(()=>{
document.body.classList.add("ready");
});
}
}

renderFiles();
enterPage();
</script>

</body>
</html>
