<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY</title>
<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#30343c;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
scroll-padding-top:100px;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -20%,rgba(255,255,255,.07),transparent 32rem),
radial-gradient(circle at 100% 40%,rgba(255,255,255,.025),transparent 28rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
line-height:1.45;
-webkit-font-smoothing:antialiased;
}

button,input{
font:inherit;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:18px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
padding:5px;
border:1px solid rgba(255,255,255,.09);
border-radius:13px;
background:rgba(13,14,17,.78);
backdrop-filter:blur(22px) saturate(140%);
-webkit-backdrop-filter:blur(22px) saturate(140%);
box-shadow:
0 12px 40px rgba(0,0,0,.32),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
position:relative;
height:34px;
min-width:76px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#777d87;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.1px;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#e7e8ea;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.045),
0 2px 8px rgba(0,0,0,.15);
}

.nav a:active{
transform:scale(.96);
}

.container{
width:min(1180px,calc(100% - 36px));
margin:auto;
padding:145px 0 70px;
}

.hero{
display:flex;
align-items:center;
justify-content:center;
min-height:360px;
text-align:center;
}

.hero-inner{
display:flex;
flex-direction:column;
align-items:center;
}

.logo{
width:78px;
height:78px;
margin-bottom:27px;
overflow:hidden;
border:1px solid rgba(255,255,255,.12);
border-radius:19px;
background:#111318;
box-shadow:
0 18px 50px rgba(0,0,0,.35),
0 0 0 7px rgba(255,255,255,.018);
}

.logo img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

h1{
margin:0;
font-size:clamp(68px,10vw,110px);
line-height:.82;
letter-spacing:-7px;
font-weight:900;
}

.hero-description{
max-width:430px;
margin:25px auto 0;
color:var(--muted);
font-size:14px;
line-height:1.6;
}

.section{
padding-top:65px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
margin-bottom:17px;
}

.section-title{
margin:0;
font-size:22px;
font-weight:800;
letter-spacing:-.7px;
}

.section-count{
color:var(--dim);
font-size:11px;
font-weight:750;
}

.toolbar{
margin-bottom:14px;
}

.field{
position:relative;
width:100%;
}

.field input{
width:100%;
height:45px;
padding:0 15px 0 41px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:rgba(16,18,22,.82);
color:#fff;
font-size:13px;
transition:
border-color .2s ease,
background .2s ease,
box-shadow .2s ease;
}

.field input::placeholder{
color:#5d626b;
}

.field input:hover

.field input:focus{
border-color:#41464f;
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.field-icon{
position:absolute;
left:15px;
top:50%;
transform:translateY(-51%);
color:#686e78;
font-size:17px;
line-height:1;
pointer-events:none;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
min-width:0;
display:flex;
align-items:center;
gap:13px;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
background:
linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.006)),
var(--surface);
transition:
transform .2s ease,
border-color .2s ease,
background .2s ease,
box-shadow .2s ease;
}

.file:hover{
transform:translateY(-3px);
border-color:#363a43;
background:var(--surface2);
box-shadow:0 18px 38px rgba(0,0,0,.22);
}

.icon-wrapper{
width:58px;
height:58px;
flex:0 0 58px;
overflow:hidden;
display:grid;
place-items:center;
border:1px solid #292d34;
border-radius:10px;
background:#181a1f;
color:#747a84;
font-size:20px;
}

.icon{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:14px;
font-weight:750;
letter-spacing:-.25px;
}

.description{
margin-top:3px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:var(--muted);
font-size:11px;
}

.file-type{
margin-top:6px;
color:#626872;
font-size:9px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
}

.download{
flex:0 0 auto;
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
height:34px;
padding:0 12px;
border:1px solid #d1d2d5;
border-radius:8px;
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
font-size:11px;
font-weight:850;
transition:
background .18s ease,
border-color .18s ease,
transform .18s ease;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-1px);
}

.download:active{
transform:translateY(0) scale(.97);
}

.main-layout{
display:grid;
grid-template-columns:minmax(0,1fr) 360px;
gap:22px;
align-items:start;
}

.news-panel{
position:sticky;
top:86px;
min-width:0;
border:1px solid var(--line);
border-radius:13px;
overflow:hidden;
background:
linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.007)),
var(--surface);
box-shadow:0 18px 50px rgba(0,0,0,.14);
}

.news-panel-head{
padding:16px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
}

.news-panel-title{
margin:0;
font-size:15px;
font-weight:800;
letter-spacing:-.3px;
}

.news-search{
padding:11px 12px;
border-bottom:1px solid var(--line);
}

.news-search .field input{
height:38px;
background:#0d0f12;
}

.news-list{
max-height:650px;
overflow:auto;
scrollbar-width:thin;
scrollbar-color:#292d34 transparent;
}

.news-list::-webkit-scrollbar{
width:5px;
}

.news-list::-webkit-scrollbar-thumb{
background:#292d34;
border-radius:10px;
}

.news-card{
min-width:0;
border-bottom:1px solid var(--line);
background:transparent;
transition:background .18s ease;
}

.news-card:last-child{
border-bottom:0;
}

.news-card:hover{
background:rgba(255,255,255,.025);
}

.news-feature{
display:block;
}

.news-feature-image{
width:100%;
height:180px;
object-fit:cover;
display:block;
background:#181b20;
}

.news-content{
padding:13px 14px;
}

.news-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.news-source{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#898f99;
font-size:9px;
font-weight:800;
letter-spacing:.9px;
text-transform:uppercase;
}

.news-date{
color:#5e636d;
font-size:9px;
white-space:nowrap;
}

.news-title{
margin-top:7px;
font-size:13px;
line-height:1.35;
font-weight:750;
letter-spacing:-.15px;
}

.news-title a{
text-decoration:none;
}

.news-title a:hover{
text-decoration:underline;
}

.news-description{
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
margin-top:6px;
color:#747a84;
font-size:11px;
line-height:1.45;
}

.news-compact{
display:grid;
grid-template-columns:82px minmax(0,1fr);
gap:11px;
padding:11px 14px;
}

.news-compact-image{
width:82px;
height:62px;
object-fit:cover;
border-radius:7px;
background:#181b20;
}

.news-compact .news-content{
padding:0;
}

.news-compact .news-title{
margin-top:5px;
font-size:11px;
display:-webkit-box;
-webkit-line-clamp:3;
-webkit-box-orient:vertical;
overflow:hidden;
}

.news-fallback{
width:100%;
height:100%;
display:grid;
place-items:center;
background:
radial-gradient(circle at 50% 40%,#252932,#101216 65%);
color:#555b65;
font-size:26px;
font-weight:900;
}

.status{
padding:38px 20px;
border:1px dashed #2a2e35;
border-radius:10px;
color:#777d86;
text-align:center;
font-size:12px;
background:rgba(255,255,255,.012);
}

.news-list>.status{
border:0;
border-radius:0;
}

.status strong{
display:block;
margin-bottom:5px;
color:#aeb2b9;
font-size:13px;
}

.reveal{
opacity:0;
transform:translateY(15px);
animation:reveal .65s cubic-bezier(.2,.7,.2,1) forwards;
}

.reveal:nth-child(2){animation-delay:.06s}
.reveal:nth-child(3){animation-delay:.12s}

@keyframes reveal{
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:1000px){
.main-layout{
grid-template-columns:1fr;
}

.news-panel{
position:relative;
top:auto;
}

.news-list{
max-height:none;
display:grid;
grid-template-columns:1fr 1fr;
}

.news-feature{
grid-column:1/-1;
}

.news-card{
border-right:1px solid var(--line);
}

.news-compact{
border-bottom:1px solid var(--line);
}
}

@media(max-width:750px){
.container{
padding-top:125px;
}

.hero{
min-height:300px;
}

.downloads{
grid-template-columns:1fr;
}

.news-list{
display:block;
}

.news-card{
border-right:0;
}
}

@media(max-width:560px){
.nav{
top:12px;
padding:4px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
width:calc(100% - 24px);
padding-top:112px;
}

.hero{
min-height:275px;
}

.logo{
width:68px;
height:68px;
margin-bottom:24px;
border-radius:16px;
}

h1{
font-size:61px;
letter-spacing:-5px;
}

.hero-description{
font-size:13px;
margin-top:21px;
}

.section{
padding-top:48px;
}

.section-title{
font-size:20px;
}

.file{
padding:11px;
}

.icon-wrapper{
width:53px;
height:53px;
flex-basis:53px;
}

.download{
padding:0 10px;
}

.download-text{
display:none;
}
}

@media(prefers-reduced-motion:reduce){
html{
scroll-behavior:auto;
}

*{
animation:none!important;
transition:none!important;
}
} </style>

</head>
<body>

<nav class="nav">
<a href="#home" class="active">Home</a>
<a href="#downloads">Downloads</a>
<a href="#news">News</a>
</nav>

<main class="container">

<section class="hero reveal" id="home">
<div class="hero-inner">
<div class="logo">
<img src="logo.png" alt="unYZY">
</div>
<h1>unYZY</h1>
<div class="hero-description">
An archive for unreleased tracks, sessions, and rare material.
</div>
</div>
</section>

<div class="main-layout">

<section class="section reveal" id="downloads">
<div class="section-head">
<h2 class="section-title">Downloads</h2>
<div class="section-count" id="fileCount"></div>
</div>

<div class="toolbar">
<div class="field">
<div class="field-icon">⌕</div>
<input id="search" type="text" placeholder="Search downloads..." autocomplete="off">
</div>
</div>

<div class="downloads" id="downloadsList"></div>
</section>

<aside class="news-panel reveal" id="news">

<div class="news-panel-head">
<h2 class="news-panel-title">Kanye West News</h2>
</div>

<div class="news-search">
<div class="field">
<div class="field-icon">⌕</div>
<input id="newsSearch" type="text" placeholder="Search news..." autocomplete="off">
</div>
</div>

<div class="news-list" id="newsList">
<div class="status">Loading news...</div>
</div>

</aside>

</div>

</main>

<script>
const files=[
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
}
];

const newsList=document.getElementById("newsList");
const newsSearch=document.getElementById("newsSearch");
const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");
const fileCount=document.getElementById("fileCount");
const navLinks=[...document.querySelectorAll(".nav a")];

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function escapeAttr(value){
return escapeHTML(value);
}

function formatDate(value){
if(!value)return"";
const date=new Date(value);
if(Number.isNaN(date.getTime()))return"";
return date.toLocaleDateString(undefined,{
month:"short",
day:"numeric",
year:"numeric"
});
}

function getNewsImage(article,compact=false){
if(article.urlToImage){
return`<img class="${compact?"news-compact-image":"news-feature-image"}" src="${escapeAttr(article.urlToImage)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;news-fallback&quot;>Y</div>'">`;
}

return`<div class="news-fallback">Y</div>`;
}

function renderNews(articles){
const clean=articles
.filter(a=>a&&a.title&&a.title!=="[Removed]")
.slice(0,9);

if(!clean.length){
newsList.innerHTML=`<div class="status"><strong>No stories found</strong>Try another search.</div>`;
return;
}

const featured=clean[0];

let html=`
<article class="news-card news-feature">
${getNewsImage(featured,false)}
<div class="news-content">
<div class="news-top">
<div class="news-source">${escapeHTML(featured.source?.name||"News")}</div>
<div class="news-date">${formatDate(featured.publishedAt)}</div>
</div>
<div class="news-title">
<a href="${escapeAttr(featured.url||"#")}" target="_blank" rel="noopener noreferrer">
${escapeHTML(featured.title||"Untitled")}
</a>
</div>
${featured.description?`<div class="news-description">${escapeHTML(featured.description)}</div>`:""}
</div>
</article>`;

html+=clean.slice(1).map(article=>`
<article class="news-card news-compact">
${getNewsImage(article,true)}
<div class="news-content">
<div class="news-top">
<div class="news-source">${escapeHTML(article.source?.name||"News")}</div>
<div class="news-date">${formatDate(article.publishedAt)}</div>
</div>
<div class="news-title">
<a href="${escapeAttr(article.url||"#")}" target="_blank" rel="noopener noreferrer">
${escapeHTML(article.title||"Untitled")}
</a>
</div>
</div>
</article>
`).join("");

newsList.innerHTML=html;
}

async function loadNews(query="Kanye West"){
newsList.innerHTML=`<div class="status">Loading news...</div>`;

try{
const res=await fetch(`/api/news?q=${encodeURIComponent(query)}`,{
cache:"no-store"
});

const data=await res.json();

if(!res.ok||data.status!=="ok"){
throw new Error(data.message||"News request failed");
}

renderNews(data.articles||[]);
}catch(error){
console.error("News error:",error);

newsList.innerHTML=`
<div class="status">
<strong>News is temporarily unavailable</strong>
Try refreshing in a moment.
</div>`;
}
}

function renderFiles(filter=""){
const value=filter.toLowerCase().trim();

const filtered=files.filter(file=>
file.name.toLowerCase().includes(value)||
file.description.toLowerCase().includes(value)
);

fileCount.textContent=`${filtered.length} ${filtered.length===1?"file":"files"}`;

if(!filtered.length){
downloads.innerHTML=`
<div class="status">
<strong>No downloads found</strong>
Try another search.
</div>`;
return;
}

downloads.innerHTML=filtered.map(file=>`
<div class="file">
<div class="icon-wrapper">
<img
class="icon"
src="${escapeAttr(file.icon)}"
alt=""
onerror="this.style.display='none';this.parentElement.textContent='📦'"
>
</div>

<div class="info">
<div class="name">${escapeHTML(file.name)}</div>
<div class="description">${escapeHTML(file.description)}</div>
<div class="file-type">ZIP Archive</div>
</div>

<a
class="download"
href="${escapeAttr(file.file)}"
download
>
<span>↓</span>
<span class="download-text">Download</span>
</a>
</div>
`).join("");
}

search.addEventListener("input",()=>{
renderFiles(search.value);
});

let newsTimer;

newsSearch.addEventListener("input",()=>{
clearTimeout(newsTimer);

newsTimer=setTimeout(()=>{
const query=newsSearch.value.trim();
loadNews(query?`Kanye West ${query}`:"Kanye West");
},450);
});

const sections=[
document.getElementById("home"),
document.getElementById("downloads"),
document.getElementById("news")
];

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
const id=entry.target.id;

navLinks.forEach(link=>{
link.classList.toggle(
"active",
link.getAttribute("href")===`#${id}`
);
});
}
});
},{
rootMargin:"-35% 0px -55% 0px",
threshold:0
});

sections.forEach(section=>observer.observe(section));

renderFiles();
loadNews();
</script>

</body>
</html>
