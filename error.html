<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>unYZY [ERROR]</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:
radial-gradient(circle at 50% 45%,rgba(255,255,255,.07),transparent 34rem),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.025),transparent 40rem),
#08090b;
color:#f5f5f6;
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
opacity:.3;
}

.error{
position:relative;
z-index:2;
width:100%;
padding:30px;
text-align:center;
}

.code{
margin-bottom:25px;
color:#555b64;
font-size:9px;
font-weight:850;
letter-spacing:2.4px;
text-transform:uppercase;
}

.error-number{
display:flex;
align-items:center;
justify-content:center;
gap:clamp(8px,2vw,24px);
height:clamp(170px,25vw,300px);
}

.four{
font-size:clamp(150px,25vw,300px);
line-height:.7;
letter-spacing:-.08em;
font-weight:950;
color:#f5f5f6;
text-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo-holder{
position:relative;
width:clamp(180px,28vw,330px);
height:clamp(180px,28vw,330px);
display:flex;
align-items:center;
justify-content:center;
}

.logo-holder:before{
content:"";
position:absolute;
width:75%;
height:55%;
border-radius:50%;
background:rgba(255,255,255,.085);
filter:blur(55px);
}

.error-logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 30px 50px rgba(0,0,0,.6))
drop-shadow(0 0 40px rgba(255,255,255,.06));
animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);
}
}

.message{
margin:38px auto 0;
max-width:420px;
}

.message h1{
margin:0;
font-size:20px;
letter-spacing:-.6px;
font-weight:850;
}

.message p{
margin:9px 0 0;
color:#777d87;
font-size:12px;
line-height:1.7;
}

.home{
display:inline-flex;
align-items:center;
justify-content:center;
height:41px;
margin-top:25px;
padding:0 19px;
border:1px solid #e8e8ea;
border-radius:9px;
background:#e8e8ea;
color:#08090b;
text-decoration:none;
font-size:11px;
font-weight:850;
transition:.2s ease;
}

.home:hover{
background:#fff;
transform:translateY(-3px);
box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.mark{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
color:#41464f;
font-size:8px;
font-weight:800;
letter-spacing:1.7px;
text-transform:uppercase;
}

@media(max-width:700px){

.error{
padding:20px;
}

.error-number{
gap:3px;
height:170px;
}

.four{
font-size:clamp(100px,28vw,170px);
}

.logo-holder{
width:clamp(120px,31vw,180px);
height:clamp(120px,31vw,180px);
}

.message{
margin-top:30px;
}
}

@media(prefers-reduced-motion:reduce){

.error-logo{
animation:none;
}
}
</style>
</head>

<body>

<main class="error">

<div class="code">
PAGE NOT FOUND
</div>

<div class="error-number">

<div class="four">4</div>

<div class="logo-holder">

<img
class="error-logo"
src="/assets/err.png"
alt=""
>

</div>

<div class="four">4</div>

</div>

<div class="message">

<h1>
Nothing here.
</h1>

<p>
The page you're looking for doesn't exist,
was moved, or isn't available.
</p>

<a class="home" href="/">
Return Home
</a>

</div>

</main>

<div class="mark">
unYZY archive
</div>

</body>
</html>
