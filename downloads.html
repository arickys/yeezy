<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@font-face{
font-family:YeezyTSTAR;
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:YeezyTSTAR;
src:url("/fonts/yeezy_tstar-bold-webfont.woff") format("woff");
font-weight:700 950;
font-style:normal;
font-display:swap;
}

*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15181d;
--line:rgba(255,255,255,.075);
--text:#f5f5f6;
--muted:#858b95;
--dim:#626873;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.065),transparent 31rem),
radial-gradient(circle at 0 70%,rgba(255,255,255,.018),transparent 28rem),
var(--bg);
color:var(--text);
font-family:YeezyTSTAR,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:opacity .55s ease,transform .7s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(11,12,15,.78);
backdrop-filter:blur(24px) saturate(150%);
box-shadow:0 18px 55px rgba(0,0,0,.4);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:700;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
}

.container{
width:min(1100px,calc(100% - 36px));
margin:auto;
padding:130px 0 90px;
}

.heading{
display:flex;
align-items:center;
justify-content:space-between;
gap:25px;
margin-bottom:25px;
}

.heading-left{
display:flex;
align-items:center;
gap:17px;
}

.heading-logo{
width:55px;
height:55px;
object-fit:contain;
filter:drop-shadow(0 15px 30px rgba(0,0,0,.5));
}

.heading h1{
margin:0;
font-size:44px;
line-height:.9;
letter-spacing:-2.5px;
font-weight:900;
}

.count{
color:var(--dim);
font-size:11px;
font-weight:700;
}

.search{
position:relative;
margin-bottom:14px;
}

.search input{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:rgba(16,18,22,.8);
color:#fff;
font-family:inherit;
font-size:12px;
transition:.2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:rgba(255,255,255,.16);
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#656b74;
font-size:18px;
pointer-events:none;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
position:relative;
display:flex;
align-items:center;
gap:15px;
min-height:102px;
padding:14px;
overflow:hidden;
border:1px solid var(--line);
border-radius:14px;
background:
linear-gradient(145deg,rgba(255,255,255,.028),rgba(255,255,255,.006)),
var(--surface);
box-shadow:0 8px 25px rgba(0,0,0,.08);
transition:
transform .3s cubic-bezier(.22,1,.36,1),
border-color .25s ease,
background .25s ease,
box-shadow .3s ease;
}

.file:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
115deg,
transparent 25%,
rgba(255,255,255,.025) 50%,
transparent 75%
);
transform:translateX(-100%);
transition:transform .6s ease;
pointer-events:none;
}

.file:hover:after{
transform:translateX(100%);
}

.file:hover{
transform:translateY(-4px);
border-color:rgba(255,255,255,.14);
background:
linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.008)),
var(--surface2);
box-shadow:0 22px 50px rgba(0,0,0,.25);
}

.file.shared-target{
border-color:rgba(255,255,255,.3);
background:
linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.012)),
var(--surface2);
box-shadow:
0 0 0 1px rgba(255,255,255,.05),
0 0 45px rgba(255,255,255,.06),
0 25px 65px rgba(0,0,0,.35);
animation:sharedArrival 1.8s cubic-bezier(.22,1,.36,1);
}

@keyframes sharedArrival{

0%{
opacity:0;
transform:
translateY(22px)
scale(.96);
}

35%{
opacity:1;
transform:
translateY(-7px)
scale(1.025);
}

65%{
transform:
translateY(2px)
scale(1.008);
}

100%{
transform:
translateY(0)
scale(1);
}

}

.shared-badge{
position:absolute;
top:10px;
right:10px;
height:21px;
padding:0 8px;
display:flex;
align-items:center;
gap:5px;
border:1px solid rgba(255,255,255,.16);
border-radius:6px;
background:rgba(255,255,255,.07);
color:#d7d9dc;
font-size:7px;
font-weight:700;
letter-spacing:1px;
z-index:3;
opacity:0;
transform:translateY(-4px);
transition:.35s ease;
}

.file.shared-target .shared-badge{
opacity:1;
transform:translateY(0);
}

.shared-badge-dot{
width:4px;
height:4px;
border-radius:50%;
background:#fff;
box-shadow:0 0 8px rgba(255,255,255,.6);
}

.icon{
position:relative;
width:70px;
height:70px;
flex:0 0 70px;
overflow:hidden;
display:grid;
place-items:center;
border:1px solid rgba(255,255,255,.07);
border-radius:10px;
background:#17191e;
color:#666d77;
font-size:21px;
}

.icon:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
135deg,
rgba(255,255,255,.06),
transparent 50%
);
pointer-events:none;
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:15px;
font-weight:700;
letter-spacing:-.25px;
}

.description{
margin-top:4px;
color:#808690;
font-size:11px;
}

.meta{
display:flex;
align-items:center;
gap:8px;
margin-top:9px;
}

.type{
color:#5f6570;
font-size:8px;
font-weight:700;
letter-spacing:1.1px;
text-transform:uppercase;
}

.dot{
width:3px;
height:3px;
border-radius:50%;
background:#444950;
}

.actions{
display:flex;
align-items:center;
gap:6px;
flex:0 0 auto;
}

.download,
.share{
height:36px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
border-radius:8px;
font-family:inherit;
font-size:10px;
font-weight:700;
cursor:pointer;
transition:
transform .18s ease,
background .18s ease,
border-color .18s ease,
box-shadow .18s ease;
}

.download{
padding:0 13px;
border:1px solid rgba(255,255,255,.16);
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-1px);
box-shadow:0 8px 20px rgba(255,255,255,.08);
}

.share{
width:38px;
padding:0;
border:1px solid rgba(255,255,255,.09);
background:rgba(255,255,255,.035);
color:#9ca1a9;
}

.share:hover{
color:#fff;
border-color:rgba(255,255,255,.18);
background:rgba(255,255,255,.075);
transform:translateY(-1px);
box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.share.copied{
color:#fff;
border-color:rgba(255,255,255,.25);
background:rgba(255,255,255,.1);
}

.share-icon{
font-size:15px;
line-height:0;
}

.empty{
grid-column:1/-1;
padding:55px 20px;
border:1px dashed rgba(255,255,255,.09);
border-radius:13px;
text-align:center;
color:#6d737d;
font-size:11px;
}

.share-overlay{
position:fixed;
inset:0;
z-index:500;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.62);
backdrop-filter:blur(14px);
opacity:0;
visibility:hidden;
pointer-events:none;
transition:
opacity .25s ease,
visibility .25s ease;
}

.share-overlay.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.share-panel{
width:min(460px,100%);
padding:22px;
border:1px solid rgba(255,255,255,.1);
border-radius:17px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.045),
rgba(255,255,255,.012)
),
#0d0f12;
box-shadow:
0 35px 100px rgba(0,0,0,.55);
transform:translateY(18px) scale(.97);
transition:
transform .35s cubic-bezier(.22,1,.36,1);
}

.share-overlay.active .share-panel{
transform:translateY(0) scale(1);
}

.share-top{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:20px;
}

.share-kicker{
color:#656b74;
font-size:8px;
font-weight:700;
letter-spacing:1.7px;
text-transform:uppercase;
}

.share-title{
margin-top:6px;
font-size:20px;
font-weight:700;
letter-spacing:-.5px;
}

.share-close{
width:30px;
height:30px;
display:grid;
place-items:center;
border:1px solid rgba(255,255,255,.08);
border-radius:8px;
background:rgba(255,255,255,.03);
color:#777d86;
font-family:inherit;
font-size:16px;
cursor:pointer;
transition:.2s ease;
}

.share-close:hover{
color:#fff;
background:rgba(255,255,255,.08);
border-color:rgba(255,255,255,.15);
}

.share-preview{
display:flex;
align-items:center;
gap:12px;
margin-top:20px;
padding:12px;
border:1px solid rgba(255,255,255,.065);
border-radius:11px;
background:rgba(255,255,255,.022);
}

.share-preview-icon{
width:48px;
height:48px;
flex:0 0 48px;
overflow:hidden;
border:1px solid rgba(255,255,255,.08);
border-radius:8px;
background:#17191e;
}

.share-preview-icon img{
width:100%;
height:100%;
object-fit:cover;
}

.share-preview-name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:12px;
font-weight:700;
}

.share-preview-sub{
margin-top:4px;
color:#686e77;
font-size:9px;
}

.share-url{
display:flex;
gap:7px;
margin-top:12px;
}

.share-url input{
width:100%;
height:42px;
min-width:0;
padding:0 11px;
border:1px solid rgba(255,255,255,.08);
border-radius:9px;
outline:none;
background:rgba(255,255,255,.025);
color:#aeb2b8;
font-family:inherit;
font-size:9px;
}

.share-url input:focus{
border-color:rgba(255,255,255,.16);
}

.copy-link{
height:42px;
padding:0 15px;
flex:0 0 auto;
border:1px solid rgba(255,255,255,.14);
border-radius:9px;
background:#e7e7e9;
color:#090a0c;
font-family:inherit;
font-size:9px;
font-weight:700;
cursor:pointer;
transition:.18s ease;
}

.copy-link:hover{
background:#fff;
transform:translateY(-1px);
box-shadow:0 8px 20px rgba(255,255,255,.08);
}

.copy-link.done{
background:#fff;
}

.share-note{
margin-top:11px;
color:#565c65;
font-size:9px;
line-height:1.55;
}

.transition{
position:fixed;
inset:0;
z-index:999;
display:grid;
place-items:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.transition.active{
opacity:1;
visibility:visible;
}

.transition img{
width:min(300px,60vw);
height:min(300px,60vw);
object-fit:contain;
opacity:0;
transform:scale(.7);
filter:drop-shadow(0 30px 60px rgba(0,0,0,.7));
}

.transition.show img{
opacity:1;
transform:scale(1);
transition:opacity .5s ease,transform .7s cubic-bezier(.22,1,.36,1);
}

.transition.fade img{
opacity:0;
transform:scale(1.08);
transition:opacity .4s ease,transform .45s ease;
}

@media(max-width:760px){

.downloads{
grid-template-columns:1fr;
}

}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.container{
width:calc(100% - 24px);
padding-top:105px;
}

.heading h1{
font-size:37px;
}

.heading-logo{
width:45px;
height:45px;
}

.file{
min-height:88px;
padding:11px;
gap:11px;
}

.icon{
width:55px;
height:55px;
flex-basis:55px;
}

.name{
font-size:13px;
}

.actions{
gap:5px;
}

.download{
width:38px;
padding:0;
}

.download-text{
display:none;
}

.share{
width:38px;
}

.share-panel{
padding:17px;
}

.share-url{
flex-direction:column;
}

.copy-link{
width:100%;
}

}

@media(prefers-reduced-motion:reduce){

body,
.file,
.download,
.share,
.share-overlay,
.share-panel,
.transition img{
transition:none;
}

.file:after{
display:none;
}

}

</style>
</head>

<script>

const files=[
{
id:"iapw",
name:"IN A PERFECT WORLD",
description:"ALREADY IN THE FINISHED STAGES OF RECORDING IN A PERFECT WORLD, NEVER RELEASED.",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
},
{
id:"iapw-early",
name:"IN A PERFECT WORLD [EARLY]",
description:"EARLY STAGES OF RECORDING IN A PERFECT WORLD.",
file:"IN A PERFECT WORLD [EARLY].zip",
icon:"IAPWE.png"
},
{
id:"bully-first",
name:"BULLY [FIRST]",
description:"FIRST VERSION OF BULLY, CONTAINS AI VOCALS OF KANYE.",
file:"BULLY [FIRST].zip",
icon:"BULLY1.png"
}
];

const downloads=
document.getElementById("downloadsList");

const search=
document.getElementById("search");

const fileCount=
document.getElementById("fileCount");

const shareOverlay=
document.getElementById("shareOverlay");

const shareClose=
document.getElementById("shareClose");

const shareTitle=
document.getElementById("shareTitle");

const sharePreviewIcon=
document.getElementById("sharePreviewIcon");

const sharePreviewName=
document.getElementById("sharePreviewName");

const shareURL=
document.getElementById("shareURL");

const copyLink=
document.getElementById("copyLink");

const transition=
document.getElementById("transition");

const transitionLogo=
document.getElementById("transitionLogo");

const links=
document.querySelectorAll("[data-page]");

let navigating=false;

let activeShareFile=null;


function escapeHTML(value){

return String(value??"")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));

}


function getShareURL(file){

const url=
new URL(
window.location.href
);

url.search="";

url.hash="";

url.searchParams.set(
"share",
file.id
);

return url.href;

}


function renderFiles(filter=""){

const value=
filter.toLowerCase().trim();

const filtered=
files.filter(file=>
file.name
.toLowerCase()
.includes(value)||

file.description
.toLowerCase()
.includes(value)
);

fileCount.textContent=
`${filtered.length} ${
filtered.length===1
?"file"
:"files"
}`;

if(!filtered.length){

downloads.innerHTML=`
<div class="empty">
No downloads found.
</div>
`;

return;
}


downloads.innerHTML=
filtered.map(file=>`

<article
class="file"
data-file-id="${escapeHTML(file.id)}"
>

<div class="shared-badge">
<span class="shared-badge-dot"></span>
SHARED WITH YOU
</div>

<div class="icon">

<img
src="/assets/${encodeURIComponent(file.icon)}"
alt=""
onerror="this.remove();this.parentElement.textContent='◈'"
>

</div>


<div class="info">

<div class="name">
${escapeHTML(file.name)}
</div>

<div class="description">
${escapeHTML(file.description)}
</div>

<div class="meta">

<span class="type">
ZIP Archive
</span>

<span class="dot"></span>

<span class="type">
Available
</span>

</div>

</div>


<div class="actions">

<a
class="download"
href="${encodeURIComponent(file.file)}"
download
>

<span>
↓
</span>

<span class="download-text">
Download
</span>

</a>


<button
class="share"
type="button"
data-share-id="${escapeHTML(file.id)}"
aria-label="Share ${escapeHTML(file.name)}"
title="Share"
>

<span class="share-icon">
↗
</span>

</button>

</div>

</article>

`).join("");


downloads
.querySelectorAll(".share")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

openShare(
button.dataset.shareId
);

}
);

});


highlightSharedFile();

}


function openShare(id){

const file=
files.find(
item=>item.id===id
);

if(!file){
return;
}

activeShareFile=file;

shareTitle.textContent=
file.name;

sharePreviewName.textContent=
file.name;

sharePreviewIcon.innerHTML=
`<img src="/assets/${encodeURIComponent(file.icon)}" alt="">`;

shareURL.value=
getShareURL(file);

copyLink.textContent=
"Copy Link";

copyLink.classList.remove(
"done"
);

shareOverlay.classList.add(
"active"
);

setTimeout(()=>{

shareURL.select();

},100);

}


function closeShare(){

shareOverlay.classList.remove(
"active"
);

activeShareFile=null;

}


async function copyShareLink(){

if(!activeShareFile){
return;
}

const url=
getShareURL(
activeShareFile
);

let copied=false;

try{

await navigator.clipboard.writeText(
url
);

copied=true;

}catch{

try{

shareURL.focus();

shareURL.select();

copied=
document.execCommand(
"copy"
);

}catch{}

}

if(copied){

copyLink.textContent=
"Copied";

copyLink.classList.add(
"done"
);

setTimeout(()=>{

copyLink.textContent=
"Copy Link";

copyLink.classList.remove(
"done"
);

},1600);

}

}


function highlightSharedFile(){

const params=
new URLSearchParams(
window.location.search
);

const sharedID=
params.get("share");

if(!sharedID){
return;
}

const card=
downloads.querySelector(
`[data-file-id="${CSS.escape(sharedID)}"]`
);

if(!card){
return;
}

setTimeout(()=>{

card.scrollIntoView({
behavior:"smooth",
block:"center"
});

card.classList.add(
"shared-target"
);

setTimeout(()=>{

card.classList.remove(
"shared-target"
);

},3200);

},350);

}


shareClose.addEventListener(
"click",
closeShare
);


copyLink.addEventListener(
"click",
copyShareLink
);


shareOverlay.addEventListener(
"click",
event=>{

if(event.target===shareOverlay){

closeShare();

}

}
);


document.addEventListener(
"keydown",
event=>{

if(event.key==="Escape"){

closeShare();

}

}
);


function getLogo(target){

return target==="home"
?"/assets/logo.png"
:"/assets/LOGO2.png";

}


function navigate(url,target){

if(navigating){
return;
}

navigating=true;

document.body.classList.add(
"leaving"
);

transitionLogo.src=
getLogo(target);

transition.classList.add(
"active"
);

requestAnimationFrame(()=>{

transition.classList.add(
"show"
);

});

setTimeout(()=>{

transition.classList.add(
"fade"
);

},620);

setTimeout(()=>{

sessionStorage.setItem(
"unyzyTransition",
target
);

location.href=url;

},880);

}


links.forEach(link=>{

link.addEventListener(
"click",
e=>{

e.preventDefault();

navigate(
link.href,
link.dataset.page
);

});

});


function enter(){

const target=
sessionStorage.getItem(
"unyzyTransition"
);

sessionStorage.removeItem(
"unyzyTransition"
);

if(target){

transitionLogo.src=
getLogo(target);

transition.classList.add(
"active"
);

requestAnimationFrame(()=>{

transition.classList.add(
"show"
);

});

setTimeout(()=>{

transition.classList.add(
"fade"
);

document.body.classList.add(
"ready"
);

},500);

setTimeout(()=>{

transition.classList.remove(
"active",
"show",
"fade"
);

},930);

}else{

requestAnimationFrame(()=>{

document.body.classList.add(
"ready"
);

});

}

}


search.addEventListener(
"input",
()=>{

renderFiles(
search.value
);

}
);


renderFiles();

enter();

</script>
