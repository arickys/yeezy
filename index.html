<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>
<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#343941;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.075),transparent 32rem),
radial-gradient(circle at 0% 55%,rgba(255,255,255,.025),transparent 25rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.1px;
transition:
background .2s ease,
color .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.045),
0 2px 8px rgba(0,0,0,.15);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:100px 0 70px;
}

.hero-inner{
display:flex;
flex-direction:column;
align-items:center;
}

.logo{
width:92px;
height:92px;
margin-bottom:30px;
display:block;
}

.logo img{
width:100%;
height:100%;
display:block;
object-fit:contain;
}

h1{
margin:0;
font-size:clamp(72px,11vw,124px);
line-height:.8;
letter-spacing:-8px;
font-weight:950;
}

.description{
max-width:430px;
margin:27px auto 0;
color:var(--muted);
font-size:14px;
line-height:1.65;
}

.actions{
display:flex;
align-items:center;
gap:9px;
margin-top:30px;
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid var(--line2);
border-radius:9px;
background:rgba(255,255,255,.035);
color:#d8dade;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:.2s ease;
}

.action:hover{
background:#fff;
border-color:#fff;
color:#090a0c;
transform:translateY(-2px);
}

.action.primary{
background:#e8e8ea;
border-color:#e8e8ea;
color:#090a0c;
}

.action.primary:hover

@media(max-width:560px){
.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
width:calc(100% - 24px);
}

.hero{
padding-top:85px;
}

.logo{
width:76px;
height:76px;
margin-bottom:25px;
}

h1{
font-size:66px;
letter-spacing:-5px;
}

.description{
font-size:13px;
max-width:330px;
}

.actions{
width:100%;
max-width:330px;
}

.action{
flex:1;
}
} </style>

</head>
<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html">Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="container">
<section class="hero">
<div class="hero-inner">

<div class="logo">
<img src="logo.png" alt="unYZY">
</div>

<h1>unYZY</h1>

<div class="description">
A place for unreleased tracks, sessions, and rare material.
</div>

<div class="actions">
<a class="action primary" href="downloads.html">Browse Downloads</a>
<a class="action" href="news.html">Latest News</a>
</div>

</div>
</section>
</main>

</body>
</html>
