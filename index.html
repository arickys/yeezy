<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<link rel="stylesheet" href="/theme.css">
<title>unYZY [HOME]</title>

<style>
/* ---- page-specific styles only; everything shared lives in theme.css ---- */

.hero{
  min-height:calc(100vh - var(--container-pad) - 90px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.logo-wrap{
  position:relative;
  width:170px;
  height:170px;
  display:grid;
  place-items:center;
  margin-bottom:34px;
}

.logo-wrap:before{
  content:"";
  position:absolute;
  width:125px;
  height:70px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  filter:blur(55px);
}

.logo{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:
    drop-shadow(0 28px 55px rgba(0,0,0,.62))
    drop-shadow(0 0 45px rgba(255,255,255,.055));
  animation:hero-float 6s ease-in-out infinite;
}

@keyframes hero-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

h1{
  margin:0;
  font-size:clamp(58px,9vw,94px);
  line-height:.84;
  letter-spacing:-5px;
  font-weight:700;
}

.subtitle{
  max-width:430px;
  margin:20px auto 0;
  color:#777d86;
  font-size:13px;
  line-height:1.65;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:28px;
}

/* subtle stat strip beneath the fold — new, but same visual language */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:64px;
  padding-top:34px;
  border-top:1px solid var(--line);
}

.stat{
  text-align:center;
}

.stat-value{
  font-size:26px;
  font-weight:700;
  letter-spacing:-1px;
}

.stat-label{
  margin-top:6px;
  color:var(--dim);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

@media(prefers-reduced-motion:reduce){
  .logo{animation:none}
}

@media(max-width:560px){
  .logo-wrap{
    width:125px;
    height:125px;
    margin-bottom:28px;
  }

  h1{
    font-size:54px;
    letter-spacing:-3.5px;
  }

  .subtitle{
    font-size:11px;
  }

  .actions{
    margin-top:23px;
    width:100%;
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
  }

  .stats{
    margin-top:44px;
    padding-top:26px;
  }

  .stat-value{
    font-size:20px;
  }
}
</style>
</head>

<body data-page="home">

<nav class="nav">
  <div class="nav-slider"></div>
  <a href="/" class="active" data-page="home">Home</a>
  <a href="/downloads" data-page="downloads">Downloads</a>
  <a href="/updates" data-page="updates">Updates</a>
</nav>

<main class="container u-view">

  <section class="hero">
    <div class="hero-inner u-stagger">

      <div class="logo-wrap">
        <img class="logo" src="/assets/LOGO2.png" alt="unYZY" width="170" height="170">
      </div>

      <div class="kicker">unYZY Archive</div>

      <h1>unYZY</h1>

      <p class="subtitle">
        An independent archive for releases, recordings, and material from the Yeezy era.
      </p>

      <div class="actions">
        <a class="btn primary" href="/downloads" data-page="downloads">
          Browse Downloads
        </a>
        <a class="btn" href="/updates" data-page="updates">
          View Updates
        </a>
      </div>

    </div>
  </section>

  <section class="stats u-stagger">
    <div class="stat">
      <div class="stat-value">11</div>
      <div class="stat-label">Files Archived</div>
    </div>
    <div class="stat">
      <div class="stat-value">2</div>
      <div class="stat-label">Projects</div>
    </div>
    <div class="stat">
      <div class="stat-value">4</div>
      <div class="stat-label">Recent Updates</div>
    </div>
  </section>

</main>

<div class="route-veil" id="routeVeil">
  <div class="route-veil-ring"></div>
  <img class="route-veil-logo" id="routeVeilLogo" src="/assets/logo.png" alt="">
  <div class="route-veil-bar"><div class="route-veil-bar-fill"></div></div>
</div>

<script src="/transitions.js"></script>
</body>
</html>
