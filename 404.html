<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [404]</title>

<style>
*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
}

body{
overflow:hidden;
background:
radial-gradient(
circle at 50% 42%,
rgba(255,255,255,.055),
transparent 34rem
),
#08090b;
color:#f5f5f6;
font-family:
Inter,
ui-sans-serif,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(
rgba(255,255,255,.012) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.012) 1px,
transparent 1px
);
background-size:80px 80px;
mask-image:linear-gradient(
to bottom,
rgba(0,0,0,.6),
transparent 80%
);
}

.error{
position:relative;
z-index:2;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
}

.content{
display:flex;
flex-direction:column;
align-items:center;
}

.logo-frame{
position:relative;
width:min(520px,75vw);
height:min(330px,48vw);
display:flex;
align-items:center;
justify-content:center;
margin-bottom:5px;
}

.logo-frame:before{
content:"";
position:absolute;
width:75%;
height:55%;
border-radius:50%;
background:rgba(255,255,255,.07);
filter:blur(70px);
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 35px 65px rgba(0,0,0,.65))
drop-shadow(0 0 55px rgba(255,255,255,.05));
animation:float 6s ease-in-out infinite;
}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-9px);
}

}

.error-code{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
margin-top:-5px;
font-size:clamp(90px,15vw,160px);
line-height:.8;
font-weight:950;
letter-spacing:-12px;
}

.error-code span{
display:block;
}

.message{
margin-top:28px;
color:#777d87;
font-size:12px;
line-height:1.6;
}

.home{
margin-top:25px;
height:40px;
padding:0 17px;
display:inline-flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:#e9e9eb;
color:#08090b;
text-decoration:none;
font-size:11px;
font-weight:850;
transition:.2s ease;
}

.home:hover{
background:#fff;
transform:translateY(-2px);
box-shadow:0 14px 35px rgba(0,0,0,.3);
}

@media(max-width:600px){

.logo-frame{
width:90vw;
height:55vw;
}

.error-code{
font-size:90px;
letter-spacing:-7px;
}

.message{
font-size:11px;
}

}
</style>
</head>

<body>

<main class="error">

<div class="content">

<div class="logo-frame">
<img
class="logo"
src="/api/image?file=err.png"
alt=""
>
</div>

<div class="error-code">
<span>4</span>
<span>0</span>
<span>4</span>
</div>

<div class="message">
The page you're looking for doesn't exist.
</div>

<a
class="home"
href="/"
>
Return Home
</a>

</div>

</main>

</body>
</html>
