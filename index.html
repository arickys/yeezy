<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">

<title>unYZY [HOME]</title>

<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">

<style>
@font-face{
font-family:"Yeezy TStar";
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:"Yeezy TStar";
src:url("/fonts/yeezy_tstar-bold.webfont.woff") format("woff");
font-weight:700;
font-style:normal;
font-display:swap;
}

*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:rgba(255,255,255,.075);
--line-strong:rgba(255,255,255,.13);
--text:#f5f5f6;
--muted:#858b95;
--dim:#5d636d;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(
circle at 50% -18%,
rgba(255,255,255,.075),
transparent 32rem
),
radial-gradient(
circle at 0% 65%,
rgba(255,255,255,.018),
transparent 30rem
),
radial-gradient(
circle at 100% 80%,
rgba(255,255,255,.015),
transparent 30rem
),
var(--bg);
color:var(--text);
font-family:"Yeezy TStar",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:
opacity .6s ease,
transform .8s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(
rgba(255,255,255,.012) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.012) 1px,
transparent 1px
);
background-size:80px 80px;
mask-image:linear-gradient(
to bottom,
rgba(0,0,0,.65),
transparent 76%
);
opacity:.3;
}

a{
color:inherit;
}

.brand{
position:fixed;
top:20px;
left:22px;
z-index:100;
height:45px;
display:flex;
align-items:center;
gap:10px;
padding:5px 12px 5px 7px;
border:1px solid rgba(255,255,255,.08);
border-radius:13px;
background:rgba(11,12,15,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.035);
}

.brand-icon{
width:32px;
height:32px;
object-fit:contain;
border-radius:7px;
filter:
drop-shadow(0 5px 12px rgba(0,0,0,.45))
drop-shadow(0 0 15px rgba(255,255,255,.045));
}

.brand-name{
color:#f5f5f6;
font-size:15px;
font-weight:400;
letter-spacing:-.25px;
}

.brand-page{
padding-left:10px;
border-left:1px solid rgba(255,255,255,.1);
color:#737983;
font-size:9px;
font-weight:700;
letter-spacing:1.2px;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:11px;
font-weight:700;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 9px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:155px 0 90px;
}

.hero{
min-height:calc(100vh - 245px);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero-content{
display:flex;
flex-direction:column;
align-items:center;
}

.hero-logo-wrap{
position:relative;
width:clamp(190px,25vw,280px);
height:clamp(190px,25vw,280px);
display:grid;
place-items:center;
margin-bottom:34px;
}

.hero-logo-glow{
position:absolute;
width:65%;
height:48%;
border-radius:50%;
background:rgba(255,255,255,.08);
filter:blur(65px);
opacity:.75;
}

.hero-logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 30px 55px rgba(0,0,0,.58))
drop-shadow(0 0 45px rgba(255,255,255,.055));
animation:heroFloat 6s ease-in-out infinite;
}

@keyframes heroFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
}

.kicker{
margin-bottom:12px;
color:#666c75;
font-size:9px;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
}

.hero-title{
margin:0;
font-size:clamp(54px,8vw,94px);
line-height:.88;
font-weight:700;
letter-spacing:-5px;
}

.hero-description{
max-width:470px;
margin:18px auto 0;
color:#777d87;
font-size:12px;
line-height:1.7;
}

.hero-actions{
display:flex;
gap:9px;
margin-top:28px;
}

.button{
height:40px;
padding:0 17px;
display:inline-flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,.1);
border-radius:9px;
background:rgba(255,255,255,.035);
color:#cfd1d5;
text-decoration:none;
font-size:10px;
font-weight:700;
transition:
transform .2s ease,
background .2s ease,
border-color .2s ease,
color .2s ease;
}

.button:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.18);
color:#fff;
}

.button.primary{
background:#e8e8ea;
border-color:#e8e8ea;
color:#090a0c;
}

.button.primary:hover{
background:#fff;
border-color:#fff;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-logo{
width:min(310px,62vw);
height:min(310px,62vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 60px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .5s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.1);
transition:
opacity .4s ease,
transform .5s cubic-bezier(.22,1,.36,1);
}

@media(max-width:850px){

.brand{
left:14px;
}

.nav{
left:auto;
right:14px;
transform:none;
}

.container{
padding-top:125px;
}

.hero{
min-height:calc(100vh - 210px);
}
}

@media(max-width:650px){

.brand{
top:12px;
height:40px;
padding-right:9px;
}

.brand-icon{
width:28px;
height:28px;
}

.brand-name{
font-size:14px;
}

.brand-page{
font-size:8px;
padding-left:8px;
}

.nav{
top:60px;
left:50%;
right:auto;
transform:translateX(-50%);
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:10px;
}

.container{
width:calc(100% - 24px);
padding-top:125px;
}

.hero-logo-wrap{
width:180px;
height:180px;
margin-bottom:28px;
}

.hero-title{
font-size:52px;
letter-spacing:-3.5px;
}

.hero-description{
font-size:11px;
max-width:340px;
}

.hero-actions{
margin-top:23px;
}

.button{
height:38px;
padding:0 14px;
}
}

@media(prefers-reduced-motion:reduce){

body,
.button,
.nav a,
.page-transition .transition-logo{
transition:none;
}

.hero-logo{
animation:none;
}
}
</style>
</head>

<body>

<div class="brand">
<img
class="brand-icon"
src="/assets/NO_CIERTO_BESAME_MAMA.png"
alt=""
>
<span class="brand-name">unYZY</span>
<span class="brand-page">HOME</span>
</div>

<nav class="nav">
<a href="/" class="active" data-page="home">Home</a>
<a href="/downloads" data-page="downloads">Downloads</a>
<a href="/updates" data-page="updates">Updates</a>
</nav>

<main class="container">

<section class="hero">

<div class="hero-content">

<div class="hero-logo-wrap">

<div class="hero-logo-glow"></div>

<img
class="hero-logo"
src="/assets/LOGO2.png"
alt="unYZY"
>

</div>

<div class="kicker">
Archive
</div>

<h1 class="hero-title">
unYZY
</h1>

<p class="hero-description">
A simple archive for releases, files, and updates.
</p>

<div class="hero-actions">

<a
class="button primary"
href="/downloads"
data-page="downloads"
>
Browse Downloads
</a>

<a
class="button"
href="/updates"
data-page="updates"
>
View Updates
</a>

</div>

</div>

</section>

</main>

<div class="page-transition" id="pageTransition">

<img
class="transition-logo"
id="transitionLogo"
src="/assets/LOGO2.png"
alt=""
>

</div>

<script>
const pageTransition =
document.getElementById("pageTransition");

const transitionLogo =
document.getElementById("transitionLogo");

const links =
document.querySelectorAll("[data-page]");

let navigating = false;

function getLogo(target){
return target === "home"
? "/assets/logo.png"
: "/assets/LOGO2.png";
}

function navigate(url,target){

if(navigating)return;

navigating=true;

document.body.classList.add("leaving");

transitionLogo.src=getLogo(target);

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},620);

setTimeout(()=>{

sessionStorage.setItem(
"unyzyTransition",
target
);

window.location.href=url;

},880);

}

links.forEach(link=>{

link.addEventListener("click",event=>{

event.preventDefault();

navigate(
link.href,
link.dataset.page
);

});

});

function enterPage(){

const transition =
sessionStorage.getItem("unyzyTransition");

sessionStorage.removeItem(
"unyzyTransition"
);

if(
transition === "home" ||
transition === "downloads" ||
transition === "updates"
){

transitionLogo.src=
getLogo(transition);

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{

pageTransition.classList.add("fade");

document.body.classList.add("ready");

},520);

setTimeout(()=>{

pageTransition.classList.remove(
"active",
"show",
"fade"
);

},950);

}else{

requestAnimationFrame(()=>{
document.body.classList.add("ready");
});

}

}

enterPage();
</script>

</body>
</html>
