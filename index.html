<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unYZY</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #090a0c;
            --panel: #111317;
            --panel-2: #15171c;
            --border: #24272e;
            --text: #f4f4f5;
            --muted: #8e929b;
            --soft: #b7bac2;
            --accent: #d9d9dc;
        }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            line-height: 1.45;
        }

        a { color: inherit; }

        .nav {
            height: 64px;
            border-bottom: 1px solid var(--border);
            background: rgba(9,10,12,.96);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .nav-inner {
            width: min(1160px, calc(100% - 40px));
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 750;
            letter-spacing: -.2px;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: 1px solid #30333a;
            border-radius: 6px;
            background: #f4f4f5;
            color: #090a0c;
            font-size: 17px;
            font-weight: 900;
        }

        .nav-link {
            text-decoration: none;
            color: var(--soft);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 11px;
            font-size: 13px;
            transition: .16s ease;
        }

        .nav-link:hover {
            color: #fff;
            border-color: #3b3e46;
            background: var(--panel-2);
        }

        .container {
            width: min(1160px, calc(100% - 40px));
            margin: auto;
            padding: 58px 0 80px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 35px;
            align-items: end;
            padding-bottom: 42px;
            border-bottom: 1px solid var(--border);
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(44px, 8vw, 78px);
            line-height: .95;
            letter-spacing: -4px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 17px;
            max-width: 610px;
            color: var(--muted);
            font-size: 15px;
        }

        .hero-meta {
            color: #666b75;
            font-size: 12px;
            text-align: right;
        }

        .section {
            margin-top: 48px;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 17px;
        }

        .section-title {
            margin: 0;
            font-size: 21px;
            letter-spacing: -.5px;
        }

        .section-note {
            color: #676c75;
            font-size: 12px;
        }

        /* NEWS */

        .news-toolbar {
            display: flex;
            gap: 9px;
            margin-bottom: 15px;
        }

        .news-search {
            width: 100%;
            height: 42px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            background: var(--panel);
            color: #fff;
            font: inherit;
            font-size: 13px;
        }

        .news-search:focus {
            border-color: #424650;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .news-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            transition: border-color .16s ease, transform .16s ease;
        }

        .news-card:hover {
            transform: translateY(-2px);
            border-color: #3b3e46;
        }

        .news-image {
            width: 100%;
            height: 155px;
            display: block;
            object-fit: cover;
            background: #191b20;
        }

        .news-content {
            padding: 14px;
        }

        .news-source {
            color: #737883;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .news-title {
            margin: 7px 0 8px;
            font-size: 15px;
            line-height: 1.3;
            font-weight: 700;
        }

        .news-title a {
            text-decoration: none;
        }

        .news-title a:hover { text-decoration: underline; }

        .news-date {
            color: #686d77;
            font-size: 11px;
        }

        .news-status {
            padding: 35px 15px;
            border: 1px dashed #292c33;
            border-radius: 8px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }

        /* DOWNLOADS */

        .downloads-toolbar {
            display: flex;
            margin-bottom: 15px;
        }

        .search {
            position: relative;
            width: 100%;
        }

        .search input {
            width: 100%;
            height: 42px;
            padding: 0 13px 0 38px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            background: var(--panel);
            color: #fff;
            font: inherit;
            font-size: 13px;
        }

        .search input:focus {
            border-color: #424650;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #777c85;
            font-size: 15px;
        }

        .downloads {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .file {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            transition: border-color .16s ease, background .16s ease;
        }

        .file:hover {
            border-color: #3b3e46;
            background: var(--panel-2);
        }

        .icon-wrapper {
            width: 58px;
            height: 58px;
            flex: 0 0 58px;
            overflow: hidden;
            display: grid;
            place-items: center;
            border: 1px solid #2b2e35;
            border-radius: 7px;
            background: #191b20;
        }

        .icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .info {
            min-width: 0;
            flex: 1;
        }

        .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 700;
        }

        .description {
            margin-top: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 12px;
        }

        .file-type {
            margin-top: 7px;
            color: #686d76;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        .download {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 11px;
            border: 1px solid #d5d5d8;
            border-radius: 6px;
            background: #e9e9eb;
            color: #0b0c0e;
            text-decoration: none;
            font-size: 12px;
            font-weight: 750;
            transition: .16s ease;
        }

        .download:hover {
            background: #fff;
            border-color: #fff;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 45px 20px;
            border: 1px dashed #292c33;
            border-radius: 8px;
            color: #696e78;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 850px) {
            .hero { grid-template-columns: 1fr; }
            .hero-meta { text-align: left; }
            .news-grid { grid-template-columns: 1fr 1fr; }
            .downloads { grid-template-columns: 1fr; }
        }

        @media (max-width: 560px) {
            .container, .nav-inner {
                width: min(100% - 24px, 1160px);
            }

            .container { padding-top: 42px; }

            h1 {
                letter-spacing: -2.5px;
                font-size: 48px;
            }

            .news-grid { grid-template-columns: 1fr; }

            .news-image { height: 180px; }

            .file { padding: 11px; }

            .icon-wrapper {
                width: 52px;
                height: 52px;
                flex-basis: 52px;
            }

            .download {
                padding: 8px 9px;
                font-size: 0;
            }

            .download span { font-size: 15px; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-inner">
            <div class="brand">
                <div class="brand-icon">↓</div>
                Yeezus
            </div>
            <a class="nav-link" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        </div>
    </nav>

    <main class="container">

        <section class="hero">
            <div>
                <div class="eyebrow">Unreleased</div>
                <h1>Yeezus</h1>
                <div class="subtitle">
                    A simple archive for projects, builds, files, and Kanye West news.
                </div>
            </div>
            <div class="hero-meta">Downloads &amp; updates</div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2 class="section-title">Kanye West News</h2>
                <div class="section-note">Latest stories</div>
            </div>

            <div class="news-toolbar">
                <input id="newsSearch" class="news-search" type="text"
                       placeholder="Search Kanye West news..." autocomplete="off">
            </div>

            <div id="news" class="news-grid">
                <div class="news-status">Loading news...</div>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2 class="section-title">Downloads</h2>
                <div class="section-note">ZIP archives</div>
            </div>

            <div class="downloads-toolbar">
                <div class="search">
                    <div class="search-icon">⌕</div>
                    <input id="search" type="text" placeholder="Search downloads..." autocomplete="off">
                </div>
            </div>

            <div class="downloads" id="downloads"></div>
        </section>

    </main>

    <script>

        const NEWS_API_KEY = "1d68c6e342614af9aa6417cbf688b8d4";
        const NEWS_API_URL = "https://newsapi.org/v2/everything";

        let allNews = [];

        async function loadNews(query = "Kanye West") {
            const news = document.getElementById("news");
            news.innerHTML = '<div class="news-status">Loading news...</div>';

            const params = new URLSearchParams({
                q: query,
                sortBy: "publishedAt",
                language: "en",
                pageSize: "9",
                apiKey: NEWS_API_KEY
            });

            try {
                const response = await fetch(`${NEWS_API_URL}?${params}`);

                if (!response.ok) {
                    throw new Error("News request failed");
                }

                const data = await response.json();

                if (data.status !== "ok") {
                    throw new Error(data.message || "News API error");
                }

                allNews = data.articles || [];
                renderNews(allNews);
            } catch (error) {
                console.error(error);
                news.innerHTML = `
                    <div class="news-status">
                        Couldn't load the news right now.<br>
                    </div>
                `;
            }
        }

        function renderNews(articles) {
            const news = document.getElementById("news");

            if (!articles.length) {
                news.innerHTML = '<div class="news-status">No news found.</div>';
                return;
            }

            news.innerHTML = articles.map(article => {
                const title = escapeHTML(article.title || "Untitled");
                const source = escapeHTML(article.source?.name || "Unknown source");
                const date = article.publishedAt
                    ? new Date(article.publishedAt).toLocaleDateString(undefined, {
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    })
                    : "";

                const image = article.urlToImage
                    ? `<img class="news-image" src="${escapeAttr(article.urlToImage)}" alt="" loading="lazy"
                           onerror="this.style.display='none'">`
                    : `<div class="news-image"></div>`;

                return `
                    <article class="news-card">
                        ${image}
                        <div class="news-content">
                            <div class="news-source">${source}</div>
                            <div class="news-title">
                                <a href="${escapeAttr(article.url)}" target="_blank" rel="noopener noreferrer">${title}</a>
                            </div>
                            <div class="news-date">${date}</div>
                        </div>
                    </article>
                `;
            }).join("");
        }

        document.getElementById("newsSearch").addEventListener("keydown", event => {
            if (event.key !== "Enter") return;

            const query = event.target.value.trim();
            loadNews(query ? `Kanye West ${query}` : "Kanye West");
        });

        const files = [
            {
                name: "IN A PERFECT WORLD",
                description: "10/10",
                file: "IN A PERFECT WORLD.zip",
                icon: "IAPW.png"
            }
        ];

        const downloads = document.getElementById("downloads");
        const search = document.getElementById("search");

        function renderFiles(filter = "") {
            downloads.innerHTML = "";

            const filtered = files.filter(file =>
                file.name.toLowerCase().includes(filter.toLowerCase()) ||
                file.description.toLowerCase().includes(filter.toLowerCase())
            );

            if (!filtered.length) {
                downloads.innerHTML = '<div class="empty">No downloads found.</div>';
                return;
            }

            filtered.forEach(file => {
                const card = document.createElement("div");
                card.className = "file";

                card.innerHTML = `
                    <div class="icon-wrapper">
                        <img class="icon" src="${escapeAttr(file.icon)}" alt=""
                             onerror="
                                this.style.display='none';
                                this.parentElement.textContent='📦';
                                this.parentElement.style.fontSize='22px';
                             ">
                    </div>

                    <div class="info">
                        <div class="name">${escapeHTML(file.name)}</div>
                        <div class="description">${escapeHTML(file.description)}</div>
                        <div class="file-type">ZIP Archive</div>
                    </div>

                    <a class="download" href="${escapeAttr(file.file)}" download>
                        <span>↓</span>
                        <span class="download-text">Download</span>
                    </a>
                `;

                downloads.appendChild(card);
            });
        }

        search.addEventListener("input", () => renderFiles(search.value));

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function escapeAttr(value) {
            return escapeHTML(value);
        }

        renderFiles();
        loadNews();
    </script>
</body>
</html>
