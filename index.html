<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#7d828b;
}

html,body{
margin:0;
width:100%;
height:100%;
}

body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 50% 40%,rgba(255,255,255,.075),transparent 28rem),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.025),transparent 38rem),
var(--bg);
color:var(--white);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.32) 100%);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.075);
border-radius:14px;
background:rgba(10,11,14,.68);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:color .2s ease,background .2s ease,transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 8px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.logo-stage{
position:relative;
width:min(340px,44vw);
height:min(340px,44vw);
display:flex;
align-items:center;
justify-content:center;
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
display:block;
object-fit:contain;
filter:
drop-shadow(0 28px 45px rgba(0,0,0,.48))
drop-shadow(0 0 45px rgba(255,255,255,.055));
animation:logoFloat 6s cubic-bezier(.45,.05,.55,.95) infinite;
transition:
opacity .55s cubic-bezier(.22,1,.36,1),
transform .65s cubic-bezier(.22,1,.36,1),
filter .55s ease;
}

.logo-next{
position:absolute;
z-index:3;
width:100%;
height:100%;
object-fit:contain;
opacity:0;
transform:scale(.82) rotate(-2deg);
filter:
drop-shadow(0 28px 45px rgba(0,0,0,.5))
drop-shadow(0 0 55px rgba(255,255,255,.08));
transition:
opacity .65s cubic-bezier(.22,1,.36,1),
transform .75s cubic-bezier(.22,1,.36,1);
pointer-events:none;
}

.logo-glow{
position:absolute;
z-index:0;
width:280px;
height:160px;
left:50%;
top:52%;
transform:translate(-50%,-50%);
border-radius:50%;
background:rgba(255,255,255,.075);
filter:blur(75px);
opacity:.55;
transition:
opacity .5s ease,
transform .7s cubic-bezier(.22,1,.36,1);
pointer-events:none;
}

.logo-stage.transitioning .logo{
opacity:0;
transform:scale(.78) rotate(2deg);
filter:
drop-shadow(0 0 0 rgba(0,0,0,0))
drop-shadow(0 0 0 rgba(255,255,255,0));
}

.logo-stage.transitioning .logo-next{
opacity:1;
transform:scale(1) rotate(0);
}

.logo-stage.transitioning .logo-glow{
opacity:.9;
transform:translate(-50%,-50%) scale(1.25);
}

@keyframes logoFloat{
0%,100%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-11px) scale(1.012);
}
}

.description{
margin-top:5px;
color:#858a93;
font-size:12px;
font-weight:650;
letter-spacing:.5px;
transition:
opacity .4s ease,
transform .5s cubic-bezier(.22,1,.36,1);
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:25px;
transition:
opacity .4s ease,
transform .55s cubic-bezier(.22,1,.36,1);
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#bfc2c7;
text-decoration:none;
font-size:11px;
font-weight:800;
letter-spacing:-.05px;
transition:
background .2s ease,
border-color .2s ease,
color .2s ease,
transform .2s ease,
box-shadow .2s ease;
}

.action:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
box-shadow:0 14px 32px rgba(0,0,0,.3);
}

.transition-cover{
position:fixed;
inset:0;
z-index:200;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
transition:opacity .45s ease,visibility .45s ease;
}

.transition-cover.active{
opacity:1;
visibility:visible;
}

.transition-cover img{
width:min(240px,58vw);
height:min(240px,58vw);
object-fit:contain;
opacity:0;
transform:scale(.82);
filter:
drop-shadow(0 25px 45px rgba(0,0,0,.55))
drop-shadow(0 0 45px rgba(255,255,255,.07));
transition:
opacity .55s cubic-bezier(.22,1,.36,1),
transform .7s cubic-bezier(.22,1,.36,1);
}

.transition-cover.show-logo img{
opacity:1;
transform:scale(1);
}

@media(max-width:650px){
body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo-stage{
width:min(270px,72vw);
height:min(270px,72vw);
}

.logo-glow{
width:220px;
height:130px;
}

.description{
font-size:11px;
}

.actions{
width:100%;
max-width:330px;
margin-top:22px;
}

.action{
flex:1;
padding:0 12px;
}
}

@media(prefers-reduced-motion:reduce){
.logo{
animation:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html" data-transition="downloads">Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="hero">
<div class="hero-inner">

<div class="logo-stage" id="logoStage">
<div class="logo-glow"></div>

<img
class="logo"
src="logo.png"
alt="unYZY"

>

<img
class="logo-next"
src="LOGO2.png"
alt=""

>

</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">
<a class="action primary" href="downloads.html" data-transition="downloads">
Browse Downloads
</a>

<a class="action" href="news.html">
Latest News
</a>
</div>

</div>
</main>

<div class="transition-cover" id="transitionCover">
<img src="LOGO2.png" alt="">
</div>

<script>
const logoStage=document.getElementById("logoStage");
const transitionCover=document.getElementById("transitionCover");
const transitionLinks=document.querySelectorAll('[data-transition="downloads"]');

function goDownloads(event){
event.preventDefault();

if(document.body.classList.contains("leaving"))return;

document.body.classList.add("leaving");
logoStage.classList.add("transitioning");
transitionCover.classList.add("active");

requestAnimationFrame(()=>{
setTimeout(()=>{
transitionCover.classList.add("show-logo");
},80);
});

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition","downloads");
window.location.href="downloads.html";
},720);
}

transitionLinks.forEach(link=>{
link.addEventListener("click",goDownloads);
});

if(sessionStorage.getItem("unyzyTransition")==="home"){
sessionStorage.removeItem("unyzyTransition");
}
</script>

</body>
</html>
