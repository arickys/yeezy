<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>unYZY [DOWNLOADS]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--surface:#101216;
--surface-hover:#15181d;
--line:rgba(255,255,255,.075);
--line-hover:rgba(255,255,255,.14);
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -20%,rgba(255,255,255,.07),transparent 34rem),
radial-gradient(circle at 0% 65%,rgba(255,255,255,.018),transparent 30rem),
radial-gradient(circle at 100% 75%,rgba(255,255,255,.014),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.01);
transition:
opacity .55s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.011) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.011) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 75%);
opacity:.3;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(11,12,15,.76);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.42),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#707680;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 9px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:128px 0 90px;
}

.page-head{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:30px;
padding-bottom:27px;
border-bottom:1px solid var(--line);
}

.heading-left{
display:flex;
align-items:center;
gap:18px;
}

.heading-logo{
width:58px;
height:58px;
object-fit:contain;
filter:
drop-shadow(0 16px 28px rgba(0,0,0,.5))
drop-shadow(0 0 30px rgba(255,255,255,.055));
}

.heading-text{
min-width:0;
}

.kicker{
margin-bottom:9px;
color:#666c75;
font-size:9px;
font-weight:850;
letter-spacing:1.8px;
text-transform:uppercase;
}

h1{
margin:0;
font-size:clamp(42px,5vw,58px);
line-height:.92;
letter-spacing:-3.5px;
font-weight:900;
}

.subtitle{
margin-top:11px;
color:var(--muted);
font-size:11px;
line-height:1.5;
}

.count{
padding-bottom:5px;
color:#646a74;
font-size:10px;
font-weight:800;
letter-spacing:.7px;
text-transform:uppercase;
white-space:nowrap;
}

.toolbar{
display:flex;
gap:10px;
margin:24px 0 14px;
}

.search{
position:relative;
flex:1;
}

.search-icon{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
color:#646a74;
font-size:16px;
line-height:1;
pointer-events:none;
}

.search input{
width:100%;
height:44px;
padding:0 15px 0 40px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:rgba(16,18,22,.9);
color:#fff;
font:inherit;
font-size:12px;
transition:
border-color .2s ease,
background .2s ease,
box-shadow .2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:rgba(255,255,255,.16);
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
position:relative;
display:flex;
align-items:center;
gap:15px;
min-height:102px;
padding:13px;
border:1px solid var(--line);
border-radius:13px;
background:
linear-gradient(145deg,rgba(255,255,255,.027),rgba(255,255,255,.006)),
var(--surface);
overflow:hidden;
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.file:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
110deg,
transparent 20%,
rgba(255,255,255,.025) 50%,
transparent 80%
);
transform:translateX(-110%);
transition:transform .65s cubic-bezier(.22,1,.36,1);
pointer-events:none;
}

.file:hover{
transform:translateY(-3px);
border-color:var(--line-hover);
background:
linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.008)),
var(--surface-hover);
box-shadow:
0 20px 50px rgba(0,0,0,.24),
inset 0 1px 0 rgba(255,255,255,.025);
}

.file:hover:before{
transform:translateX(110%);
}

.icon{
position:relative;
width:76px;
height:76px;
flex:0 0 76px;
overflow:hidden;
display:grid;
place-items:center;
border:1px solid rgba(255,255,255,.07);
border-radius:10px;
background:#181a1f;
box-shadow:
0 8px 20px rgba(0,0,0,.28),
inset 0 1px 0 rgba(255,255,255,.035);
}

.icon:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
135deg,
rgba(255,255,255,.08),
transparent 45%
);
pointer-events:none;
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.icon-fallback{
color:#6d737d;
font-size:22px;
}

.info{
position:relative;
z-index:1;
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:14px;
font-weight:850;
letter-spacing:-.25px;
}

.description{
margin-top:5px;
color:#7a8089;
font-size:10.5px;
line-height:1.4;
}

.meta{
display:flex;
align-items:center;
gap:7px;
margin-top:9px;
}

.badge{
height:21px;
display:inline-flex;
align-items:center;
padding:0 7px;
border:1px solid rgba(255,255,255,.075);
border-radius:6px;
background:rgba(255,255,255,.025);
color:#686e77;
font-size:8px;
font-weight:850;
letter-spacing:.9px;
text-transform:uppercase;
}

.badge.primary{
color:#b9bdc3;
border-color:rgba(255,255,255,.11);
background:rgba(255,255,255,.045);
}

.download{
position:relative;
z-index:2;
height:36px;
min-width:37px;
padding:0 12px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
flex:0 0 auto;
border:1px solid rgba(255,255,255,.13);
border-radius:8px;
background:#e5e5e7;
color:#090a0c;
text-decoration:none;
font-size:10px;
font-weight:850;
transition:
background .18s ease,
border-color .18s ease,
transform .18s ease,
box-shadow .18s ease;
}

.download-icon{
font-size:14px;
line-height:1;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-1px);
box-shadow:0 7px 18px rgba(0,0,0,.2);
}

.download:active{
transform:scale(.96);
}

.empty{
grid-column:1/-1;
padding:55px 20px;
border:1px dashed rgba(255,255,255,.09);
border-radius:13px;
text-align:center;
}

.empty-title{
font-size:13px;
font-weight:800;
color:#b0b4ba;
}

.empty-text{
margin-top:6px;
color:#626872;
font-size:10px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-logo{
width:min(310px,62vw);
height:min(310px,62vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 60px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .5s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.1);
transition:
opacity .4s ease,
transform .5s cubic-bezier(.22,1,.36,1);
}

@media(max-width:760px){

.container{
width:calc(100% - 24px);
}

.page-head{
align-items:flex-start;
}

.downloads{
grid-template-columns:1fr;
}

.count{
padding-top:7px;
}

}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:103px;
}

.page-head{
display:block;
}

.heading-left{
gap:12px;
}

.heading-logo{
width:46px;
height:46px;
}

h1{
font-size:43px;
letter-spacing:-3px;
}

.subtitle{
font-size:10.5px;
}

.count{
margin-top:12px;
}

.toolbar{
margin-top:20px;
}

.file{
min-height:90px;
padding:10px;
gap:11px;
}

.icon{
width:60px;
height:60px;
flex-basis:60px;
}

.name{
font-size:12.5px;
}

.description{
font-size:10px;
}

.download{
min-width:35px;
padding:0 10px;
}

.download-text{
display:none;
}

.meta{
margin-top:7px;
}

}

@media(prefers-reduced-motion:reduce){

body,
.file,
.download,
.page-transition .transition-logo{
transition:none;
}

.file:before{
display:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="/" data-page="home">Home</a>
<a href="/downloads" class="active" data-page="downloads">Downloads</a>
<a href="/updates" data-page="updates">Updates</a>
</nav>

<main class="container">

<header class="page-head">

<div class="heading-left">

<img
class="heading-logo"
src="/assets/LOGO2.png"
alt=""

>

<div class="heading-text">

<div class="kicker">Archive</div>

<h1>Downloads</h1>

<div class="subtitle">
Available releases and archived files.
</div>

</div>

</div>

<div class="count" id="fileCount"></div>

</header>

<div class="toolbar">

<div class="search">

<div class="search-icon">⌕</div>

<input
id="search"
type="text"
placeholder="Search downloads..."
autocomplete="off"
spellcheck="false"

>

</div>

</div>

<section
class="downloads"
id="downloadsList"
></section>

</main>

<div class="page-transition" id="pageTransition">

<img
class="transition-logo"
id="transitionLogo"
src="/assets/LOGO2.png"
alt=""

>

</div>

<script>
const files=[
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png",
type:"ZIP",
tag:"Release"
},
{
name:"IN A PERFECT WORLD [EARLY]",
description:"10/10",
file:"IN A PERFECT WORLD [EARLY].zip",
icon:"IAPWE.png",
type:"ZIP",
tag:"Early"
}
];

const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");
const fileCount=document.getElementById("fileCount");

const pageTransition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");

let navigating=false;

function escapeHTML(value){
return String(value??"").replace(
/[&<>"']/g,
char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);
}

function renderFiles(filter=""){

const query=filter.toLowerCase().trim();

const filtered=files.filter(file=>
file.name.toLowerCase().includes(query) ||
file.description.toLowerCase().includes(query) ||
file.tag.toLowerCase().includes(query)
);

fileCount.textContent=
`${filtered.length} ${filtered.length===1?"file":"files"}`;

if(!filtered.length){

downloads.innerHTML=`
<div class="empty">
<div class="empty-title">Nothing found.</div>
<div class="empty-text">Try another search.</div>
</div>
`;

return;
}

downloads.innerHTML=filtered.map(file=>{

const iconPath=
"/assets/"+encodeURIComponent(file.icon);

const downloadPath=
encodeURIComponent(file.file);

return`

<article class="file">

<div class="icon">

<img
src="${iconPath}"
alt=""
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
>

<div
class="icon-fallback"
style="display:none"
>□</div>

</div>

<div class="info">

<div class="name">
${escapeHTML(file.name)}
</div>

<div class="description">
${escapeHTML(file.description)}
</div>

<div class="meta">

<span class="badge primary">
${escapeHTML(file.type)}
</span>

<span class="badge">
${escapeHTML(file.tag)}
</span>

</div>

</div>

<a
class="download"
href="${downloadPath}"
download
aria-label="Download ${escapeHTML(file.name)}"
>

<span class="download-icon">↓</span>

<span class="download-text">
Download
</span>

</a>

</article>

`;

}).join("");
}

function getLogo(target){
return target==="home"
?"/assets/logo.png"
:"/assets/LOGO2.png";
}

function navigate(url,target){

if(navigating)return;

navigating=true;

document.body.classList.add("leaving");

transitionLogo.src=getLogo(target);

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},620);

setTimeout(()=>{

sessionStorage.setItem(
"unyzyTransition",
target
);

window.location.href=url;

},880);
}

links.forEach(link=>{

link.addEventListener("click",event=>{

event.preventDefault();

navigate(
link.href,
link.dataset.page
);

});

});

function enterPage(){

const transition=
sessionStorage.getItem("unyzyTransition");

sessionStorage.removeItem(
"unyzyTransition"
);

if(
transition==="home"||
transition==="downloads"||
transition==="updates"
){

transitionLogo.src=
getLogo(transition);

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{

pageTransition.classList.add("fade");

document.body.classList.add("ready");

},520);

setTimeout(()=>{

pageTransition.classList.remove(
"active",
"show",
"fade"
);

},950);

}else{

requestAnimationFrame(()=>{
document.body.classList.add("ready");
});

}

}

search.addEventListener(
"input",
()=>{
renderFiles(search.value);
}
);

renderFiles();
enterPage();
</script>

</body>
</html>
