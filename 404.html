<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">

<title>unYZY [404]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#6f747d;
}

html,
body{
margin:0;
width:100%;
height:100%;
}

body{
overflow:hidden;
background:
radial-gradient(
circle at 50% 50%,
rgba(255,255,255,.065),
transparent 30%
),
radial-gradient(
circle at 50% 100%,
rgba(255,255,255,.025),
transparent 40%
),
var(--bg);
color:var(--white);
font-family:
Inter,
ui-sans-serif,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(
rgba(255,255,255,.012) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.012) 1px,
transparent 1px
);
background-size:80px 80px;
opacity:.3;
mask-image:linear-gradient(
to bottom,
rgba(0,0,0,.65),
transparent 80%
);
}

.error{
position:relative;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
}

.error-code{
position:absolute;
top:32px;
left:36px;
color:#454a52;
font-size:9px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;
}

.error-content{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.error-row{
display:flex;
align-items:center;
justify-content:center;
gap:clamp(15px,4vw,65px);
}

.number{
font-size:
clamp(120px,22vw,330px);
line-height:.75;
font-weight:950;
letter-spacing:-.08em;
color:#ededee;
text-shadow:
0 20px 70px rgba(0,0,0,.5);
user-select:none;
}

.logo-wrap{
position:relative;
width:clamp(170px,25vw,360px);
height:clamp(170px,25vw,360px);
display:flex;
align-items:center;
justify-content:center;
}

.logo-glow{
position:absolute;
width:75%;
height:45%;
border-radius:50%;
background:rgba(255,255,255,.09);
filter:blur(65px);
opacity:.65;
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 30px 55px rgba(0,0,0,.6))
drop-shadow(0 0 40px rgba(255,255,255,.06));
animation:float 5s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}
}

.message{
margin-top:42px;
text-align:center;
}

.message h1{
margin:0;
font-size:clamp(24px,3vw,38px);
font-weight:900;
letter-spacing:-1.8px;
}

.message p{
margin:12px 0 0;
color:var(--muted);
font-size:12px;
line-height:1.6;
}

.home{
margin-top:24px;
height:40px;
padding:0 17px;
display:inline-flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,.13);
border-radius:9px;
background:rgba(255,255,255,.035);
color:#d5d6d9;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:
transform .2s ease,
background .2s ease,
border-color .2s ease;
}

.home:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.08);
border-color:rgba(255,255,255,.22);
color:#fff;
}

.corner{
position:absolute;
bottom:28px;
color:#454a52;
font-size:9px;
font-weight:800;
letter-spacing:1.5px;
}

.corner.left{
left:32px;
}

.corner.right{
right:32px;
}

@media(max-width:650px){

.error-row{
gap:8px;
}

.number{
font-size:clamp(80px,23vw,150px);
}

.logo-wrap{
width:clamp(120px,30vw,180px);
height:clamp(120px,30vw,180px);
}

.message{
margin-top:32px;
padding:0 20px;
}

.message h1{
font-size:25px;
}

.corner,
.error-code{
display:none;
}
}

@media(prefers-reduced-motion:reduce){

.logo{
animation:none;
}

.home{
transition:none;
}
}
</style>
</head>

<body>

<main class="error">

<div class="error-code">
ERROR / 404
</div>

<div class="error-content">

<div class="error-row">

<div class="number">4</div>

<div class="logo-wrap">

<div class="logo-glow"></div>

<img
class="logo"
src="/api/image?name=err.png"
alt="404"
>

</div>

<div class="number">4</div>

</div>

<div class="message">

<h1>Page not found.</h1>

<p>
The page you're looking for doesn't exist or isn't available.
</p>

<a class="home" href="/">
Return Home
</a>

</div>

</div>

<div class="corner left">+</div>
<div class="corner right">+</div>

</main>

</body>
</html>
