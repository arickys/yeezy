<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">

<title>unYZY [DOWNLOADS]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#343941;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(
circle at 50% -18%,
rgba(255,255,255,.06),
transparent 30rem
),
radial-gradient(
circle at 0% 60%,
rgba(255,255,255,.018),
transparent 28rem
),
var(--bg);
color:var(--text);
font-family:
Inter,
ui-sans-serif,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:
opacity .55s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(
rgba(255,255,255,.012) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.012) 1px,
transparent 1px
);
background-size:80px 80px;
mask-image:linear-gradient(
to bottom,
rgba(0,0,0,.65),
transparent 75%
);
opacity:.3;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:130px 0 80px;
}

.heading{
display:flex;
align-items:end;
justify-content:space-between;
gap:20px;
margin-bottom:25px;
}

.heading-left{
display:flex;
align-items:center;
gap:18px;
}

.heading-logo{
width:58px;
height:58px;
object-fit:contain;
filter:
drop-shadow(0 15px 25px rgba(0,0,0,.4))
drop-shadow(0 0 25px rgba(255,255,255,.04));
animation:smallFloat 5s ease-in-out infinite;
}

@keyframes smallFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-5px);
}
}

.heading h1{
margin:0;
font-size:42px;
line-height:1;
letter-spacing:-2.5px;
font-weight:900;
}

.count{
color:var(--dim);
font-size:11px;
font-weight:750;
}

.search{
position:relative;
margin-bottom:15px;
}

.search input{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:var(--surface);
color:#fff;
font-size:13px;
transition:
border-color .2s ease,
background .2s ease,
box-shadow .2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:#3b4049;
background:#121419;
box-shadow:
0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#666c76;
font-size:17px;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
display:flex;
align-items:center;
gap:14px;
padding:14px;
border:1px solid var(--line);
border-radius:12px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.025),
rgba(255,255,255,.006)
),
var(--surface);
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.file:hover{
transform:translateY(-3px);
border-color:#373b44;
background:var(--surface2);
box-shadow:0 18px 40px rgba(0,0,0,.22);
}

.icon{
width:62px;
height:62px;
flex:0 0 62px;
overflow:hidden;
display:grid;
place-items:center;
border-radius:9px;
background:#181a1f;
color:#737983;
font-size:20px;
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:14px;
font-weight:800;
letter-spacing:-.2px;
}

.description{
margin-top:3px;
color:var(--muted);
font-size:11px;
}

.type{
margin-top:6px;
color:#606670;
font-size:9px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
}

.download{
height:35px;
padding:0 12px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
flex:0 0 auto;
border:1px solid #d1d2d5;
border-radius:8px;
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
font-size:11px;
font-weight:850;
transition:.18s ease;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-1px);
}

.empty{
grid-column:1/-1;
padding:45px 20px;
border:1px dashed #292d34;
border-radius:11px;
text-align:center;
color:#707680;
font-size:12px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-logo{
width:min(310px,62vw);
height:min(310px,62vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 60px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .5s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.1);
transition:
opacity .4s ease,
transform .5s cubic-bezier(.22,1,.36,1);
}

@media(max-width:700px){

.downloads{
grid-template-columns:1fr;
}

.heading h1{
font-size:36px;
}

.container{
width:calc(100% - 24px);
}
}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.heading-left{
gap:12px;
}

.heading-logo{
width:46px;
height:46px;
}

.file{
padding:11px;
}

.icon{
width:54px;
height:54px;
flex-basis:54px;
}

.download{
padding:0 10px;
}

.download-text{
display:none;
}
}

@media(prefers-reduced-motion:reduce){

body,
.file,
.page-transition .transition-logo{
transition:none;
}

.heading-logo{
animation:none;
}
}
</style>
</head>

<body>

<nav class="nav">

<a href="/" data-page="home">
Home
</a>

<a href="/downloads" class="active" data-page="downloads">
Downloads
</a>

<a href="/updates" data-page="updates">
Updates
</a>

</nav>

<main class="container">

<div class="heading">

<div class="heading-left">

<img
class="heading-logo"
src="/api/image?file=LOGO2.png"
alt=""
>

<h1>Downloads</h1>

</div>

<div class="count" id="fileCount"></div>

</div>

<div class="search">

<div class="search-icon">⌕</div>

<input
id="search"
type="text"
placeholder="Search downloads..."
autocomplete="off"
>

</div>

<div
class="downloads"
id="downloadsList"
></div>

</main>

<div class="page-transition" id="pageTransition">

<img
class="transition-logo"
id="transitionLogo"
src="/api/image?file=LOGO2.png"
alt=""
>

</div>

<script>
const files = [
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
}
];

const downloads =
document.getElementById("downloadsList");

const search =
document.getElementById("search");

const fileCount =
document.getElementById("fileCount");

const pageTransition =
document.getElementById("pageTransition");

const transitionLogo =
document.getElementById("transitionLogo");

const links =
document.querySelectorAll("[data-page]");

let navigating = false;

function escapeHTML(value){
return String(value ?? "").replace(
/[&<>"']/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);
}

function escapeAttr(value){
return escapeHTML(value);
}

function renderFiles(filter=""){

const value =
filter.toLowerCase().trim();

const filtered =
files.filter(file =>
file.name.toLowerCase().includes(value) ||
file.description.toLowerCase().includes(value)
);

fileCount.textContent =
`${filtered.length} ${
filtered.length === 1
? "file"
: "files"
}`;

if(!filtered.length){

downloads.innerHTML = `
<div class="empty">
No downloads found.
</div>
`;

return;
}

downloads.innerHTML =
filtered.map(file => `

<div class="file">

<div class="icon">

<img
src="/api/image?file=${escapeAttr(file.icon)}"
alt=""
onerror="this.style.display='none';this.parentElement.textContent='📦'"
>

</div>

<div class="info">

<div class="name">
${escapeHTML(file.name)}
</div>

<div class="description">
${escapeHTML(file.description)}
</div>

<div class="type">
ZIP Archive
</div>

</div>

<a
class="download"
href="${escapeAttr(file.file)}"
download
>
<span>↓</span>
<span class="download-text">
Download
</span>
</a>

</div>

`).join("");
}

function getLogo(target){

return target === "home"
? "/api/image?file=logo.png"
: "/api/image?file=LOGO2.png";

}

function navigate(url,target){

if(navigating)return;

navigating = true;

document.body.classList.add("leaving");

transitionLogo.src =
getLogo(target);

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},620);

setTimeout(()=>{

sessionStorage.setItem(
"unyzyTransition",
target
);

window.location.href = url;

},880);

}

links.forEach(link => {

link.addEventListener("click",event => {

event.preventDefault();

navigate(
link.href,
link.dataset.page
);

});

});

function enterPage(){

const transition =
sessionStorage.getItem("unyzyTransition");

sessionStorage.removeItem(
"unyzyTransition"
);

if(
transition === "home" ||
transition === "downloads" ||
transition === "updates"
){

transitionLogo.src =
getLogo(transition);

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{

pageTransition.classList.add("fade");

document.body.classList.add("ready");

},520);

setTimeout(()=>{

pageTransition.classList.remove(
"active",
"show",
"fade"
);

},950);

}else{

requestAnimationFrame(()=>{
document.body.classList.add("ready");
});

}

}

search.addEventListener(
"input",
() => renderFiles(search.value)
);

renderFiles();

enterPage();
</script>

</body>
</html>
