<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#7d828b;
}

html,body{
margin:0;
width:100%;
min-height:100%;
}

body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 50% 40%,rgba(255,255,255,.075),transparent 30rem),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.025),transparent 35rem),
var(--bg);
color:var(--white);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:opacity .55s ease,transform .8s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.32));
}

a{color:inherit}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(11,12,15,.72);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.42),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.logo-wrap{
position:relative;
width:min(340px,48vw);
height:min(340px,48vw);
display:grid;
place-items:center;
margin-bottom:10px;
}

.logo-glow{
position:absolute;
width:260px;
height:150px;
border-radius:50%;
background:rgba(255,255,255,.075);
filter:blur(75px);
opacity:.6;
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
display:block;
object-fit:contain;
filter:
drop-shadow(0 28px 45px rgba(0,0,0,.5))
drop-shadow(0 0 45px rgba(255,255,255,.055));
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-11px) scale(1.015);
}
}

.description{
margin-top:3px;
color:#858a93;
font-size:12px;
font-weight:650;
letter-spacing:.6px;
}

.actions{
display:flex;
gap:8px;
margin-top:25px;
}

.action{
height:41px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 18px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#c5c7cb;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:.2s ease;
}

.action:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.22);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
}

.corner{
position:absolute;
bottom:27px;
color:#454a53;
font-size:9px;
font-weight:750;
letter-spacing:2px;
}

.corner.left{left:30px}
.corner.right{right:30px}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
transition:opacity .3s ease;
}

.page-transition.active{
opacity:1;
visibility:visible;
}

.transition-logo{
width:min(300px,65vw);
height:min(300px,65vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 55px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .48s ease,
transform .7s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.08);
transition:
opacity .35s ease,
transform .45s ease;
}

@media(max-width:650px){

body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo-wrap{
width:min(270px,72vw);
height:min(270px,72vw);
}

.logo-glow{
width:210px;
height:125px;
}

.description{
font-size:11px;
}

.actions{
width:100%;
max-width:330px;
}

.action{
flex:1;
padding:0 12px;
}

.corner{
display:none;
}
}

@media(prefers-reduced-motion:reduce){

body,
.page-transition,
.transition-logo{
transition:none;
}

.logo{
animation:none;
}
}
</style>
</head>

<body>

<nav class="nav">
<a href="/" class="active" data-page="home">Home</a>
<a href="/downloads" data-page="downloads">Downloads</a>
<a href="/updates" data-page="updates">Updates</a>
</nav>

<main class="hero">

<div class="hero-inner">

<div class="logo-wrap">
<div class="logo-glow"></div>
<img class="logo" src="assets/logo.png" alt="unYZY">
</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">
<a class="action primary" href="/downloads" data-page="downloads">Browse Downloads</a>
<a class="action" href="/updates" data-page="updates">View Updates</a>
</div>

</div>

<div class="corner left">+</div>
<div class="corner right">+</div>

</main>

<div class="page-transition" id="pageTransition">
<img class="transition-logo" id="transitionLogo" src="assets/LOGO2.png" alt="">
</div>

<script>
const transition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");

let navigating=false;

function navigate(url,target){
if(navigating)return;

navigating=true;
document.body.classList.add("leaving");

transitionLogo.src=target==="home"
?"assets/logo.png"
:"assets/LOGO2.png";

transition.classList.add("active");

requestAnimationFrame(()=>{
transition.classList.add("show");
});

setTimeout(()=>{
transition.classList.add("fade");
},620);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition",target);
window.location.href=url;
},900);
}

document.querySelectorAll("[data-page]").forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();
navigate(link.href,link.dataset.page);
});
});

function enter(){
const target=sessionStorage.getItem("unyzyTransition");
sessionStorage.removeItem("unyzyTransition");

if(target){
transitionLogo.src=target==="home"
?"assets/logo.png"
:"assets/LOGO2.png";

transition.classList.add("active");

requestAnimationFrame(()=>{
transition.classList.add("show");
});

setTimeout(()=>{
transition.classList.add("fade");
document.body.classList.add("ready");
},500);

setTimeout(()=>{
transition.classList.remove("active","show","fade");
},900);

}else{
requestAnimationFrame(()=>{
document.body.classList.add("ready");
});
}
}

enter();
</script>

</body>
</html>
