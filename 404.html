<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [404]</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
min-height:100%;
}

body{
min-height:100vh;
display:grid;
place-items:center;
overflow:hidden;
background:
radial-gradient(circle at 50% 45%,rgba(255,255,255,.065),transparent 30rem),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.02),transparent 30rem),
#08090b;
color:#f5f5f6;
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.42));
}

.error{
position:relative;
z-index:2;
width:min(900px,calc(100% - 36px));
display:flex;
align-items:center;
justify-content:center;
gap:clamp(25px,6vw,80px);
}

.number{
font-size:clamp(130px,22vw,250px);
font-weight:950;
line-height:.72;
letter-spacing:-18px;
color:#f2f2f3;
text-shadow:0 25px 70px rgba(0,0,0,.5);
}

.logo-wrap{
position:relative;
width:clamp(210px,30vw,360px);
height:clamp(210px,30vw,360px);
display:grid;
place-items:center;
}

.logo-glow{
position:absolute;
width:80%;
height:55%;
border-radius:50%;
background:rgba(255,255,255,.075);
filter:blur(65px);
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 35px 55px rgba(0,0,0,.65))
drop-shadow(0 0 45px rgba(255,255,255,.06));
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.content{
position:absolute;
left:50%;
bottom:65px;
transform:translateX(-50%);
z-index:3;
text-align:center;
}

.title{
font-size:13px;
font-weight:850;
letter-spacing:.5px;
}

.subtitle{
margin-top:7px;
color:#737983;
font-size:11px;
line-height:1.5;
}

.button{
display:inline-flex;
align-items:center;
justify-content:center;
height:38px;
margin-top:18px;
padding:0 16px;
border:1px solid rgba(255,255,255,.13);
border-radius:9px;
background:rgba(255,255,255,.035);
color:#d5d6d9;
text-decoration:none;
font-size:10px;
font-weight:850;
transition:.2s ease;
}

.button:hover{
background:#fff;
border-color:#fff;
color:#08090b;
transform:translateY(-2px);
}

@media(max-width:650px){

.error{
flex-direction:column;
gap:15px;
}

.number{
font-size:125px;
letter-spacing:-10px;
}

.logo-wrap{
width:240px;
height:240px;
}

.content{
position:relative;
left:auto;
bottom:auto;
transform:none;
margin-top:-25px;
}
}

@media(prefers-reduced-motion:reduce){
.logo{animation:none}
}
</style>
</head>

<body>

<main class="error">

<div class="number">4</div>

<div class="logo-wrap">
<div class="logo-glow"></div>
<img class="logo" src="assets/err.png" alt="">
</div>

<div class="number">4</div>

</main>

<div class="content">
<div class="title">Page not found.</div>

<div class="subtitle">
The page you're looking for doesn't exist.
</div>

<a class="button" href="/">Return Home</a>
</div>

</body>
</html>
