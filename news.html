<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [NEWS]</title>
<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#343941;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.06),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

a{color:inherit}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:0 15px 50px rgba(0,0,0,.38);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:130px 0 80px;
}

.heading{
display:flex;
align-items:end;
justify-content:space-between;
gap:20px;
margin-bottom:25px;
}

.heading h1{
margin:0;
font-size:42px;
line-height:1;
letter-spacing:-2.5px;
font-weight:900;
}

.search{
position:relative;
margin-bottom:18px;
}

.search input{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:var(--surface);
color:#fff;
font-size:13px;
transition:.2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:#3b4049;
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#666c76;
font-size:17px;
}

.news{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:13px;
}

.card{
overflow:hidden;
border:1px solid var(--line);
border-radius:12px;
background:var(--surface);
transition:.2s ease;
}

.card:hover{
transform:translateY(-3px);
border-color:#373b44;
background:var(--surface2);
box-shadow:0 18px 40px rgba(0,0,0,.2);
}

.image{
width:100%;
height:205px;
display:block;
object-fit:cover;
background:#181b20;
}

.fallback{
width:100%;
height:100%;
display:grid;
place-items:center;
background:radial-gradient(circle at 50% 40%,#252932,#101216 65%);
color:#555b65;
font-size:30px;
font-weight:900;
}

.content{
padding:15px;
}

.meta{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.source{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#898f99;
font-size:9px;
font-weight:800;
letter-spacing:.9px;
text-transform:uppercase;
}

.date{
color:#5e636d;
font-size:9px;
white-space:nowrap;
}

.title{
margin-top:8px;
font-size:15px;
line-height:1.35;
font-weight:800;
letter-spacing:-.25px;
}

.title a{
text-decoration:none;
}

.title a:hover{
text-decoration:underline;
}

.description{
display:-webkit-box;
-webkit-box-orient:vertical;
-webkit-line-clamp:3;
overflow:hidden;
margin-top:7px;
color:#777d87;
font-size:11px;
line-height:1.5;
}

.status{
grid-column:1/-1;
padding:50px 20px;
border:1px dashed #292d34;
border-radius:11px;
text-align:center;
color:#707680;
font-size:12px;
}

.status strong{
display:block;
margin-bottom:5px;
color:#aeb2b9;
font-size:13px;
}

@media(max-width:700px){
.news{
grid-template-columns:1fr;
}

.heading h1{
font-size:36px;
}

.container{
width:calc(100% - 24px);
}
}

@media(max-width:560px){
.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.image{
height:190px;
}
} </style>

</head>
<body>

<nav class="nav">
<a href="index.html">Home</a>
<a href="downloads.html">Downloads</a>
<a href="news.html" class="active">News</a>
</nav>

<main class="container">

<div class="heading">
<h1>News</h1>
</div>

<div class="search">
<div class="search-icon">⌕</div>
<input id="newsSearch" type="text" placeholder="Search Kanye West news..." autocomplete="off">
</div>

<div class="news" id="newsList">
<div class="status">Loading news...</div>
</div>

</main>

<script>
const newsList=document.getElementById("newsList");
const newsSearch=document.getElementById("newsSearch");

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function escapeAttr(value){
return escapeHTML(value);
}

function formatDate(value){
if(!value)return"";

const date=new Date(value);

if(Number.isNaN(date.getTime()))return"";

return date.toLocaleDateString(undefined,{
month:"short",
day:"numeric",
year:"numeric"
});
}

function image(article){
if(article.urlToImage){
return`
<img
class="image"
src="${escapeAttr(article.urlToImage)}"
alt=""
loading="lazy"
onerror="this.outerHTML='<div class=&quot;image fallback&quot;>Y</div>'"
>`;
}

return`<div class="image fallback">Y</div>`;
}

function renderNews(articles){
const clean=articles
.filter(article=>article&&article.title&&article.title!=="[Removed]")
.slice(0,20);

if(!clean.length){
newsList.innerHTML=`
<div class="status">
<strong>No stories found</strong>
Try another search.
</div>`;
return;
}

newsList.innerHTML=clean.map(article=>`
<article class="card">

${image(article)}

<div class="content">

<div class="meta">
<div class="source">
${escapeHTML(article.source?.name||"News")}
</div>

<div class="date">
${formatDate(article.publishedAt)}
</div>
</div>

<div class="title">
<a
href="${escapeAttr(article.url||"#")}"
target="_blank"
rel="noopener noreferrer"
>
${escapeHTML(article.title)}
</a>
</div>

${article.description?`
<div class="description">
${escapeHTML(article.description)}
</div>
`:""}

</div>

</article>
`).join("");
}

async function loadNews(query="Kanye West"){
newsList.innerHTML=`<div class="status">Loading news...</div>`;

try{
const response=await fetch(
`/api/news?q=${encodeURIComponent(query)}`,
{cache:"no-store"}
);

const data=await response.json();

if(!response.ok||data.status!=="ok"){
throw new Error(data.message||"News request failed");
}

renderNews(data.articles||[]);

}catch(error){
console.error(error);

newsList.innerHTML=`
<div class="status">
<strong>News is temporarily unavailable</strong>
Try refreshing in a moment.
</div>`;
}
}

let timer;

newsSearch.addEventListener("input",()=>{
clearTimeout(timer);

timer=setTimeout(()=>{
const query=newsSearch.value.trim();

loadNews(
query
?`Kanye West ${query}`
:"Kanye West"
);

},450);
});

loadNews();
</script>

</body>
</html>
