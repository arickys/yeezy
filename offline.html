<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>unYZY [OFFLINE]</title>
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">

<style>
@font-face{
  font-family:Yeezy;
  src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:Yeezy;
  src:url("/fonts/yeezy_tstar-bold.webfont.woff") format("woff");
  font-weight:700;
  font-display:swap;
}

*{box-sizing:border-box}

:root{
  --bg:#08090b;
  --white:#f5f5f6;
  --muted:#777d86;
  --dim:#858b94;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.07),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(255,255,255,.02),transparent 45%),
    var(--bg);
  color:var(--white);
  font-family:Yeezy,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  opacity:0;
  transform:scale(1.02);
  transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);
}

body.ready{
  opacity:1;
  transform:scale(1);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 80%);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 80%);
}

.page{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.content{
  width:min(440px,100%);
  text-align:center;
}

.logo-wrap{
  position:relative;
  width:110px;
  height:110px;
  margin:0 auto 30px;
  display:grid;
  place-items:center;
}

.logo-wrap:before{
  content:"";
  position:absolute;
  width:90px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  filter:blur(45px);
}

.logo{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:
    drop-shadow(0 25px 45px rgba(0,0,0,.6))
    drop-shadow(0 0 35px rgba(255,255,255,.06));
  animation:pulse 2.6s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

h1{
  margin:0;
  font-size:42px;
  line-height:1;
  letter-spacing:-2px;
  font-weight:700;
}

p{
  margin:14px auto 0;
  max-width:330px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.status{
  margin:25px auto 0;
  width:max-content;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:7px;
  background:rgba(255,255,255,.025);
  color:var(--dim);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#e17c7c;
  box-shadow:0 0 8px rgba(225,124,124,.5);
  animation:blink 1.8s ease-in-out infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.retry{
  margin-top:18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  height:40px;
  padding:0 18px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:8px;
  background:#e8e8ea;
  color:#08090b;
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  transition:.2s cubic-bezier(.22,1,.36,1);
}

.retry:hover{
  background:#fff;
  transform:translateY(-2px);
}

.retry:active{
  transform:translateY(0) scale(.97);
}

.retry-icon{
  display:inline-block;
  transition:transform .5s cubic-bezier(.22,1,.36,1);
}

.retry.spinning .retry-icon{
  transform:rotate(360deg);
}

@media(max-width:500px){
  h1{
    font-size:36px;
  }

  .logo-wrap{
    width:90px;
    height:90px;
  }
}

@media(prefers-reduced-motion:reduce){
  body,.logo,.status-dot,.retry,.retry-icon{
    animation:none;
    transition:none;
  }
}
</style>
</head>

<body>
<main class="page">
  <div class="content">

    <div class="logo-wrap">
      <img class="logo" src="/assets/LOGO2.png" alt="unYZY">
    </div>

    <h1>No connection.</h1>

    <p>
      unYZY couldn't connect to the internet.
      Check your connection and try again.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      Offline
    </div>

    <button class="retry" id="retryBtn" type="button">
      <span class="retry-icon">⟳</span>
      <span>Try Again</span>
    </button>

  </div>
</main>

<script>
requestAnimationFrame(function(){
  document.body.classList.add("ready");
});

document.getElementById("retryBtn").addEventListener("click",function(){
  this.classList.add("spinning");
  setTimeout(function(){
    location.reload();
  },260);
});
</script>
</body>
</html>
