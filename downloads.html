<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [UPDATES]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--surface:#0e1014;
--surface-hover:#12151a;
--text:#f5f5f6;
--muted:#858b95;
--dim:#626873;
--line:rgba(255,255,255,.075);
--line-hover:rgba(255,255,255,.13);
--added:#d5d8dc;
--update:#b3b8c0;
--patch:#969ca5;
--bug:#7d848e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -15%,rgba(255,255,255,.065),transparent 34rem),
radial-gradient(circle at 0% 60%,rgba(255,255,255,.018),transparent 28rem),
radial-gradient(circle at 100% 80%,rgba(255,255,255,.014),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:opacity .55s ease,transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);
opacity:.28;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(11,12,15,.76);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.42),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#707680;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:color .2s ease,background .2s ease,transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 8px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1000px,calc(100% - 36px));
margin:auto;
padding:130px 0 90px;
}

.page-head{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:40px;
padding-bottom:30px;
border-bottom:1px solid var(--line);
}

.heading{
min-width:0;
}

.kicker{
display:flex;
align-items:center;
gap:9px;
margin-bottom:13px;
color:#666c76;
font-size:9px;
font-weight:850;
letter-spacing:1.9px;
text-transform:uppercase;
}

.kicker:before{
content:"";
width:18px;
height:1px;
background:#666c76;
opacity:.7;
}

.page-title{
margin:0;
font-size:clamp(48px,6vw,70px);
line-height:.9;
letter-spacing:-4.5px;
font-weight:900;
}

.page-subtitle{
margin-top:15px;
max-width:470px;
color:var(--muted);
font-size:12px;
line-height:1.65;
}

.logo-area{
position:relative;
width:118px;
height:118px;
flex:0 0 118px;
display:grid;
place-items:center;
}

.logo-area:before{
content:"";
position:absolute;
width:90px;
height:55px;
border-radius:50%;
background:rgba(255,255,255,.065);
filter:blur(38px);
opacity:.7;
}

.logo{
position:relative;
z-index:2;
width:100px;
height:100px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 20px 35px rgba(0,0,0,.5))
drop-shadow(0 0 30px rgba(255,255,255,.045));
}

.changelog{
margin-top:28px;
}

.changelog-top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:13px;
}

.changelog-label{
color:#5e646e;
font-size:9px;
font-weight:850;
letter-spacing:1.5px;
text-transform:uppercase;
}

.changelog-count{
color:#4f555e;
font-size:9px;
font-weight:750;
}

.updates{
display:flex;
flex-direction:column;
gap:9px;
}

.update{
position:relative;
display:grid;
grid-template-columns:125px minmax(0,1fr) auto;
gap:24px;
align-items:start;
padding:19px 20px;
border:1px solid var(--line);
border-radius:11px;
background:
linear-gradient(145deg,rgba(255,255,255,.022),rgba(255,255,255,.004)),
var(--surface);
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.update:hover{
transform:translateY(-2px);
border-color:var(--line-hover);
background:
linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),
var(--surface-hover);
box-shadow:0 16px 38px rgba(0,0,0,.18);
}

.update.latest{
border-color:rgba(255,255,255,.11);
background:
linear-gradient(145deg,rgba(255,255,255,.032),rgba(255,255,255,.006)),
var(--surface);
}

.update.latest:before{
content:"";
position:absolute;
left:0;
top:13px;
bottom:13px;
width:2px;
border-radius:2px;
background:rgba(255,255,255,.75);
box-shadow:0 0 14px rgba(255,255,255,.12);
}

.update-date{
padding-top:2px;
color:#606670;
font-size:9px;
font-weight:800;
letter-spacing:1.15px;
line-height:1.55;
text-transform:uppercase;
}

.latest .update-date{
color:#aeb3ba;
}

.update-content{
min-width:0;
}

.update-title{
margin:0;
color:#eceef0;
font-size:14px;
line-height:1.35;
font-weight:850;
letter-spacing:-.2px;
}

.update-description{
margin-top:6px;
max-width:650px;
color:#777e88;
font-size:11px;
line-height:1.65;
}

.update-tag{
min-width:72px;
height:25px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 9px;
border:1px solid rgba(255,255,255,.085);
border-radius:7px;
background:rgba(255,255,255,.022);
font-size:8px;
font-weight:850;
letter-spacing:.9px;
text-transform:uppercase;
white-space:nowrap;
}

.tag-added{
color:var(--added);
border-color:rgba(207,210,214,.16);
background:rgba(207,210,214,.045);
}

.tag-update{
color:var(--update);
border-color:rgba(174,180,189,.13);
background:rgba(174,180,189,.035);
}

.tag-patch{
color:var(--patch);
border-color:rgba(143,150,159,.12);
background:rgba(143,150,159,.03);
}

.tag-bug{
color:var(--bug);
border-color:rgba(119,126,136,.12);
background:rgba(119,126,136,.025);
}

.empty{
padding:48px 20px;
border:1px dashed rgba(255,255,255,.075);
border-radius:11px;
text-align:center;
color:#626872;
font-size:11px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-logo{
width:min(300px,60vw);
height:min(300px,60vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 60px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .48s ease,
transform .72s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.09);
transition:
opacity .36s ease,
transform .48s cubic-bezier(.22,1,.36,1);
}

@media(max-width:760px){

.container{
width:calc(100% - 24px);
}

.page-head{
align-items:flex-start;
}

.logo-area{
width:100px;
height:100px;
flex-basis:100px;
}

.logo{
width:84px;
height:84px;
}

.logo-area:before{
width:80px;
height:50px;
}

.update{
grid-template-columns:105px minmax(0,1fr) auto;
gap:17px;
}
}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:103px;
padding-bottom:60px;
}

.page-head{
display:block;
padding-bottom:24px;
}

.page-title{
font-size:46px;
letter-spacing:-3.5px;
}

.page-subtitle{
max-width:340px;
font-size:11px;
}

.logo-area{
width:92px;
height:92px;
margin:20px auto 0;
}

.logo{
width:78px;
height:78px;
}

.logo-area:before{
width:75px;
height:45px;
}

.changelog{
margin-top:23px;
}

.update{
display:grid;
grid-template-columns:1fr;
gap:8px;
padding:16px;
}

.update.latest:before{
top:10px;
bottom:10px;
}

.update-date{
padding-right:80px;
font-size:8px;
}

.update-title{
font-size:13px;
}

.update-description{
font-size:10.5px;
}

.update-tag{
position:absolute;
top:15px;
right:15px;
min-width:65px;
height:23px;
}
}

@media(prefers-reduced-motion:reduce){

body,
.update,
.page-transition .transition-logo{
transition:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" data-page="home">Home</a>
<a href="downloads.html" data-page="downloads">Downloads</a>
<a href="updates.html" class="active" data-page="updates">Updates</a>
</nav>

<main class="container">

<header class="page-head">

<div class="heading">

<div class="kicker">
Changelog
</div>

<h1 class="page-title">
Updates
</h1>

<div class="page-subtitle">
A running record of additions, changes, patches, and fixes to the archive.
</div>

</div>

<div class="logo-area">
<img class="logo" src="LOGO2.png" alt="">
</div>

</header>

<section class="changelog">

<div class="changelog-top">

<div class="changelog-label">
Recent activity
</div>

<div class="changelog-count" id="updateCount">
0 updates
</div>

</div>

<div class="updates" id="updatesList"></div>

</section>

</main>

<div class="page-transition" id="pageTransition">

<img
class="transition-logo"
id="transitionLogo"
src="LOGO2.png"
alt=""

>

</div>

<script>
const updates=[
{
date:"AUG 30, 2026",
title:"[ALBUM]",
description:"IN A PERFECT WORLD has been added to Downloads!",
type:"Added"
},
date:"AUG 30, 2026",
title:"[WEBSITE]",
description:"unYZY has finally been released! ",
type:"Update"
},
];

const updatesList=document.getElementById("updatesList");
const updateCount=document.getElementById("updateCount");

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char]));
}

function getTagClass(type){
switch(type){
case"Added":
return"tag-added";
case"Update":
return"tag-update";
case"Patch":
return"tag-patch";
case"Bug Fixes":
return"tag-bug";
default:
return"";
}
}

function renderUpdates(){

updateCount.textContent=
`${updates.length} ${updates.length===1?"update":"updates"}`;

if(!updates.length){

updatesList.innerHTML=`
<div class="empty">
No updates yet.
</div>
`;

return;
}

updatesList.innerHTML=updates.map((update,index)=>`

<article class="update ${index===0?"latest":""}">

<div class="update-date">
${escapeHTML(update.date)}
</div>

<div class="update-content">

<h2 class="update-title">
${escapeHTML(update.title)}
</h2>

<div class="update-description">
${escapeHTML(update.description)}
</div>

</div>

<div class="update-tag ${getTagClass(update.type)}">
${escapeHTML(update.type)}
</div>

</article>

`).join("");
}

renderUpdates();

const pageTransition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");

let navigating=false;

function navigate(url,target){

if(navigating)return;

navigating=true;

document.body.classList.add("leaving");

transitionLogo.src=
target==="home"
?"logo.png"
:"LOGO2.png";

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},620);

setTimeout(()=>{

sessionStorage.setItem(
"unyzyTransition",
target
);

window.location.href=url;

},880);
}

links.forEach(link=>{

link.addEventListener("click",event=>{

event.preventDefault();

navigate(
link.href,
link.dataset.page
);

});

});

function enterPage(){

const transition=
sessionStorage.getItem(
"unyzyTransition"
);

sessionStorage.removeItem(
"unyzyTransition"
);

if(
transition==="home"||
transition==="downloads"||
transition==="updates"
){

transitionLogo.src=
transition==="home"
?"logo.png"
:"LOGO2.png";

pageTransition.classList.add(
"active"
);

requestAnimationFrame(()=>{

pageTransition.classList.add(
"show"
);

});

setTimeout(()=>{

pageTransition.classList.add(
"fade"
);

document.body.classList.add(
"ready"
);

},520);

setTimeout(()=>{

pageTransition.classList.remove(
"active",
"show",
"fade"
);

},950);

}else{

requestAnimationFrame(()=>{

document.body.classList.add(
"ready"
);

});

}

}

enterPage();
</script>

</body>
</html>
