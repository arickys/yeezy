<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">

<title>unYZY [OFFLINE]</title>

<style>
@font-face{
font-family:Yeezy;
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-display:swap;
}

@font-face{
font-family:Yeezy;
src:url("/fonts/yeezy_tstar-bold.webfont.woff") format("woff");
font-weight:700;
font-display:swap;
}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
}

body{
overflow:hidden;
background:
radial-gradient(
circle at 50% 40%,
rgba(255,255,255,.07),
transparent 30%
),
#08090b;
color:#f5f5f6;
font-family:Yeezy,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

.page{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:30px;
}

.content{
width:min(440px,100%);
text-align:center;
}

.logo{
width:110px;
height:110px;
object-fit:contain;
margin-bottom:30px;
filter:
drop-shadow(0 25px 45px rgba(0,0,0,.6))
drop-shadow(0 0 35px rgba(255,255,255,.06));
}

h1{
margin:0;
font-size:42px;
line-height:1;
letter-spacing:-2px;
font-weight:700;
}

p{
margin:14px auto 0;
max-width:330px;
color:#777d86;
font-size:14px;
line-height:1.5;
}

.status{
margin:25px auto 0;
width:max-content;
padding:8px 11px;
border:1px solid rgba(255,255,255,.09);
border-radius:7px;
background:rgba(255,255,255,.025);
color:#858b94;
font-size:10px;
font-weight:700;
letter-spacing:1.2px;
text-transform:uppercase;
}

.retry{
margin-top:18px;
display:inline-flex;
align-items:center;
justify-content:center;
height:40px;
padding:0 18px;
border:1px solid rgba(255,255,255,.13);
border-radius:8px;
background:#e8e8ea;
color:#08090b;
font-family:inherit;
font-size:12px;
font-weight:700;
text-decoration:none;
cursor:pointer;
transition:.2s ease;
}

.retry:hover{
background:#fff;
transform:translateY(-2px);
}

@media(max-width:500px){
h1{
font-size:36px;
}

.logo{
width:90px;
height:90px;
}
}
</style>
</head>

<body>

<main class="page">

<div class="content">

<img
class="logo"
src="/assets/LOGO2.png"
alt="unYZY"
>

<h1>No connection.</h1>

<p>
unYZY couldn't connect to the internet.
Check your connection and try again.
</p>

<div class="status">
Offline
</div>

<a
class="retry"
href="/"
onclick="location.reload();return false;"
>
Try Again
</a>

</div>

</main>

</body>
</html>
