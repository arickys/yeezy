<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">

<title>unYZY [404]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--white:#f4f4f5;
--muted:#777c85;
}

html,
body{
width:100%;
height:100%;
margin:0;
}

body{
overflow:hidden;
background:
radial-gradient(
circle at 50% 45%,
rgba(255,255,255,.085),
transparent 27%
),
radial-gradient(
circle at 50% 100%,
rgba(255,255,255,.025),
transparent 45%
),
var(--bg);
color:var(--white);
font-family:
Inter,
ui-sans-serif,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(
rgba(255,255,255,.012) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.012) 1px,
transparent 1px
);
background-size:72px 72px;
mask-image:linear-gradient(
to bottom,
rgba(0,0,0,.7),
transparent 78%
);
opacity:.35;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(
ellipse at center,
transparent 42%,
rgba(0,0,0,.34) 100%
);
}

.page{
position:relative;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
}

.top{
position:absolute;
top:28px;
left:32px;
right:32px;
display:flex;
align-items:center;
justify-content:space-between;
z-index:5;
}

.status{
display:flex;
align-items:center;
gap:9px;
color:#555a63;
font-size:9px;
font-weight:850;
letter-spacing:1.8px;
text-transform:uppercase;
}

.status-dot{
width:5px;
height:5px;
border-radius:50%;
background:#8a8f97;
box-shadow:
0 0 12px rgba(255,255,255,.25);
}

.code{
color:#3f444c;
font-size:9px;
font-weight:800;
letter-spacing:1.8px;
}

.center{
position:relative;
z-index:3;
display:flex;
flex-direction:column;
align-items:center;
}

.error-mark{
display:flex;
align-items:center;
justify-content:center;
gap:clamp(10px,2.5vw,38px);
}

.number{
font-size:clamp(125px,19vw,310px);
font-weight:950;
line-height:.72;
letter-spacing:-.095em;
color:#ededee;
user-select:none;
text-shadow:
0 22px 70px rgba(0,0,0,.55),
0 1px 0 rgba(255,255,255,.05);
}

.logo-holder{
position:relative;
width:clamp(190px,25vw,390px);
height:clamp(190px,25vw,390px);
display:grid;
place-items:center;
}

.logo-holder:before{
content:"";
position:absolute;
width:72%;
height:48%;
border-radius:50%;
background:rgba(255,255,255,.095);
filter:blur(75px);
opacity:.65;
}

.logo-holder:after{
content:"";
position:absolute;
inset:12%;
border-radius:50%;
border:1px solid rgba(255,255,255,.035);
box-shadow:
0 0 70px rgba(255,255,255,.025),
inset 0 0 45px rgba(255,255,255,.015);
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 32px 55px rgba(0,0,0,.65))
drop-shadow(0 0 42px rgba(255,255,255,.065));
animation:
float 5.5s cubic-bezier(.45,.05,.55,.95) infinite;
}

@keyframes float{
0%,
100%{
transform:translateY(0) scale(1);
}

50%{
transform:translateY(-11px) scale(1.018);
}
}

.divider{
width:min(360px,60vw);
height:1px;
margin-top:34px;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.12),
transparent
);
}

.message{
margin-top:25px;
text-align:center;
}

.message h1{
margin:0;
font-size:clamp(24px,3vw,34px);
font-weight:900;
letter-spacing:-1.6px;
}

.message p{
margin:10px 0 0;
color:var(--muted);
font-size:11px;
line-height:1.65;
}

.home{
margin-top:22px;
height:39px;
padding:0 17px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.035);
color:#cfd1d5;
text-decoration:none;
font-size:10px;
font-weight:850;
transition:
transform .2s ease,
background .2s ease,
border-color .2s ease,
color .2s ease,
box-shadow .2s ease;
}

.home span{
font-size:13px;
transition:transform .2s ease;
}

.home:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.085);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:
0 14px 35px rgba(0,0,0,.25);
}

.home:hover span{
transform:translateX(-2px);
}

.bottom{
position:absolute;
left:32px;
right:32px;
bottom:27px;
display:flex;
align-items:center;
justify-content:space-between;
z-index:5;
}

.bottom-text{
color:#3f444c;
font-size:8px;
font-weight:800;
letter-spacing:1.5px;
text-transform:uppercase;
}

.corner{
position:absolute;
color:#3f444c;
font-size:11px;
font-weight:500;
}

.corner.tl{
top:72px;
left:32px;
}

.corner.tr{
top:72px;
right:32px;
}

.corner.bl{
bottom:69px;
left:32px;
}

.corner.br{
bottom:69px;
right:32px;
}

@media(max-width:700px){

.top{
top:20px;
left:20px;
right:20px;
}

.error-mark{
gap:5px;
}

.number{
font-size:clamp(80px,23vw,150px);
}

.logo-holder{
width:clamp(125px,32vw,190px);
height:clamp(125px,32vw,190px);
}

.divider{
margin-top:27px;
}

.message{
margin-top:20px;
padding:0 20px;
}

.message h1{
font-size:24px;
}

.message p{
font-size:10.5px;
}

.bottom{
left:20px;
right:20px;
bottom:20px;
}

.corner{
display:none;
}

.status,
.code{
font-size:8px;
}
}

@media(prefers-reduced-motion:reduce){

.logo{
animation:none;
}

.home,
.home span{
transition:none;
}
}
</style>
</head>

<body>

<main class="page">

<div class="top">

<div class="status">
<div class="status-dot"></div>
unYZY ARCHIVE
</div>

<div class="code">
404 / NOT FOUND
</div>

</div>

<div class="corner tl">+</div>
<div class="corner tr">+</div>
<div class="corner bl">+</div>
<div class="corner br">+</div>

<div class="center">

<div class="error-mark">

<div class="number">
4
</div>

<div class="logo-holder">

<img
class="logo"
src="/api/image?file=err.png"
alt="404"
>

</div>

<div class="number">
4
</div>

</div>

<div class="divider"></div>

<div class="message">

<h1>
Page not found.
</h1>

<p>
The page you're looking for doesn't exist or isn't available.
</p>

<a
class="home"
href="/"
>
<span>←</span>
Return Home
</a>

</div>

</div>

<div class="bottom">

<div class="bottom-text">
UNYZY / ARCHIVE
</div>

<div class="bottom-text">
ERROR 404
</div>

</div>

</main>

</body>
</html>
