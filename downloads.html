<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<title>unYZY [DOWNLOADS]</title>

<style>
@font-face{
font-family:Yeezy;
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-display:swap;
}

@font-face{
font-family:Yeezy;
src:url("/fonts/yeezy_tstar-bold.webfont.woff") format("woff");
font-weight:700;
font-display:swap;
}

*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:rgba(255,255,255,.075);
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.06),transparent 30rem),
radial-gradient(circle at 0 60%,rgba(255,255,255,.018),transparent 28rem),
var(--bg);
color:var(--text);
font-family:Yeezy,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:opacity .55s ease,transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 76%);
opacity:.3;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:0 15px 50px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:700;
transition:color .2s ease,background .2s ease,transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:130px 0 85px;
}

.heading{
display:flex;
align-items:center;
justify-content:space-between;
gap:25px;
padding-bottom:25px;
border-bottom:1px solid var(--line);
}

.heading-left{
display:flex;
align-items:center;
gap:17px;
}

.heading-logo{
width:58px;
height:58px;
object-fit:contain;
filter:drop-shadow(0 15px 28px rgba(0,0,0,.45)) drop-shadow(0 0 25px rgba(255,255,255,.04));
}

.heading h1{
margin:0;
font-size:45px;
line-height:1;
font-weight:700;
letter-spacing:-2.8px;
}

.count{
color:var(--dim);
font-size:11px;
font-weight:700;
}

.search{
position:relative;
margin:20px 0 15px;
}

.search input{
width:100%;
height:45px;
padding:0 15px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:var(--surface);
color:#fff;
font-family:inherit;
font-size:12px;
transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:rgba(255,255,255,.16);
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#666c76;
font-size:17px;
pointer-events:none;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:13px;
}

.file{
position:relative;
display:grid;
grid-template-columns:72px minmax(0,1fr) auto;
align-items:center;
gap:16px;
min-height:104px;
padding:15px;
border:1px solid var(--line);
border-radius:14px;
background:
linear-gradient(145deg,rgba(255,255,255,.026),rgba(255,255,255,.006)),
var(--surface);
overflow:hidden;
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.file:after{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.035),transparent 75%);
opacity:0;
transform:translateX(-25%);
transition:opacity .25s ease,transform .5s ease;
}

.file:hover{
transform:translateY(-3px);
border-color:rgba(255,255,255,.14);
background:
linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.008)),
var(--surface2);
box-shadow:0 22px 45px rgba(0,0,0,.22);
}

.file:hover:after{
opacity:1;
transform:translateX(25%);
}

.icon{
position:relative;
z-index:2;
width:72px;
height:72px;
display:grid;
place-items:center;
overflow:hidden;
border:1px solid rgba(255,255,255,.07);
border-radius:11px;
background:#181a1f;
color:#707680;
font-size:22px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
position:relative;
z-index:2;
min-width:0;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:15px;
font-weight:700;
letter-spacing:-.25px;
}

.description{
margin-top:5px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#777d87;
font-size:11px;
}

.type{
display:inline-flex;
margin-top:9px;
padding:4px 7px;
border:1px solid rgba(255,255,255,.07);
border-radius:5px;
color:#626873;
font-size:8px;
font-weight:700;
letter-spacing:1px;
text-transform:uppercase;
}

.download{
position:relative;
z-index:2;
height:37px;
padding:0 13px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
border:1px solid rgba(255,255,255,.75);
border-radius:8px;
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
font-family:inherit;
font-size:10px;
font-weight:700;
white-space:nowrap;
transition:transform .18s ease,background .18s ease;
}

.download:hover{
transform:translateY(-1px);
background:#fff;
}

.download:active{
transform:scale(.96);
}

.empty{
grid-column:1/-1;
padding:50px 20px;
border:1px dashed rgba(255,255,255,.09);
border-radius:13px;
text-align:center;
color:#686e77;
font-size:11px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-logo{
width:min(300px,60vw);
height:min(300px,60vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:drop-shadow(0 28px 55px rgba(0,0,0,.65)) drop-shadow(0 0 55px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:opacity .5s ease,transform .7s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.1);
transition:opacity .38s ease,transform .5s cubic-bezier(.22,1,.36,1);
}

@media(max-width:760px){
.downloads{
grid-template-columns:1fr;
}

.container{
width:calc(100% - 24px);
}
}

@media(max-width:560px){
.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.heading h1{
font-size:37px;
letter-spacing:-2.2px;
}

.heading-logo{
width:47px;
height:47px;
}

.file{
grid-template-columns:58px minmax(0,1fr) auto;
gap:12px;
padding:11px;
}

.icon{
width:58px;
height:58px;
}

.name{
font-size:13px;
}

.description{
font-size:10px;
}

.download{
width:38px;
padding:0;
}

.download-text{
display:none;
}
}

@media(prefers-reduced-motion:reduce){
body,
.file,
.download,
.page-transition .transition-logo{
transition:none;
}

.file:after{
display:none;
}
}
</style>
</head>

<body>

<nav class="nav">
<a href="/" data-page="home">Home</a>
<a href="/downloads" class="active" data-page="downloads">Downloads</a>
<a href="/updates" data-page="updates">Updates</a>
</nav>

<main class="container">

<header class="heading">

<div class="heading-left">
<img class="heading-logo" src="/assets/LOGO2.png" alt="">
<h1>Downloads</h1>
</div>

<div class="count" id="fileCount"></div>

</header>

<div class="search">
<div class="search-icon">⌕</div>
<input id="search" type="text" placeholder="Search downloads..." autocomplete="off">
</div>

<section class="downloads" id="downloadsList"></section>

</main>

<div class="page-transition" id="pageTransition">
<img class="transition-logo" id="transitionLogo" src="/assets/LOGO2.png" alt="">
</div>

<script>
const files=[
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
},
{
name:"IN A PERFECT WORLD [EARLY]",
description:"10/10",
file:"IN A PERFECT WORLD [EARLY].zip",
icon:"IAPWE.png"
}
];

const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");
const fileCount=document.getElementById("fileCount");
const transition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");

let navigating=false;

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char]));
}

function renderFiles(filter=""){
const value=filter.toLowerCase().trim();

const filtered=files.filter(file=>
file.name.toLowerCase().includes(value)||
file.description.toLowerCase().includes(value)
);

fileCount.textContent=`${filtered.length} ${filtered.length===1?"file":"files"}`;

if(!filtered.length){
downloads.innerHTML='<div class="empty">No downloads found.</div>';
return;
}

downloads.innerHTML=filtered.map(file=>`
<article class="file">
<div class="icon">
<img
src="/assets/${escapeHTML(file.icon)}"
alt=""
onerror="this.style.display='none';this.parentElement.textContent='ZIP'"
>
</div>

<div class="info">
<div class="name">${escapeHTML(file.name)}</div>
<div class="description">${escapeHTML(file.description)}</div>
<div class="type">ZIP Archive</div>
</div>

<a class="download" href="${escapeHTML(file.file)}" download>
<span>↓</span>
<span class="download-text">Download</span>
</a>
</article>
`).join("");
}

function getLogo(target){
return target==="home"
?"/assets/logo.png"
:"/assets/LOGO2.png";
}

function navigate(url,target){
if(navigating)return;

navigating=true;
document.body.classList.add("leaving");

transitionLogo.src=getLogo(target);
transition.classList.add("active");

requestAnimationFrame(()=>{
transition.classList.add("show");
});

setTimeout(()=>{
transition.classList.add("fade");
},620);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition",target);
window.location.href=url;
},880);
}

links.forEach(link=>{
link.addEventListener("click",event=>{
if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;

event.preventDefault();
navigate(link.href,link.dataset.page);
});
});

function enterPage(){
const previous=sessionStorage.getItem("unyzyTransition");
sessionStorage.removeItem("unyzyTransition");

if(previous){
transitionLogo.src=getLogo(previous);
transition.classList.add("active");

requestAnimationFrame(()=>{
transition.classList.add("show");
});

setTimeout(()=>{
transition.classList.add("fade");
document.body.classList.add("ready");
},520);

setTimeout(()=>{
transition.classList.remove("active","show","fade");
},950);
}else{
requestAnimationFrame(()=>{
document.body.classList.add("ready");
});
}
}

search.addEventListener("input",()=>{
renderFiles(search.value);
});

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(()=>{});
});
}

renderFiles();
enterPage();
</script>

</body>
</html>
