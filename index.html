<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#7d828b;
}

html,
body{
margin:0;
width:100%;
min-height:100%;
}

body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 50% 42%,rgba(255,255,255,.075),transparent 30rem),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.025),transparent 38rem),
var(--bg);
color:var(--white);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.3) 100%);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:50;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.075);
border-radius:14px;
background:rgba(10,11,14,.68);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.035);
transition:
opacity .45s ease,
transform .55s cubic-bezier(.22,1,.36,1);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
transition:
opacity .45s ease,
transform .65s cubic-bezier(.22,1,.36,1);
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.logo-holder{
position:relative;
display:flex;
align-items:center;
justify-content:center;
width:330px;
height:330px;
}

.logo-glow{
position:absolute;
width:250px;
height:180px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
border-radius:50%;
background:rgba(255,255,255,.07);
filter:blur(75px);
opacity:.6;
transition:
transform .9s cubic-bezier(.16,1,.3,1),
opacity .7s ease,
filter .9s ease;
}

.logo{
position:relative;
z-index:2;
width:320px;
height:320px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 30px 50px rgba(0,0,0,.5))
drop-shadow(0 0 35px rgba(255,255,255,.055));
animation:logoFloat 6s cubic-bezier(.45,.05,.55,.95) infinite;
transition:
transform .9s cubic-bezier(.16,1,.3,1),
filter .8s ease;
}

@keyframes logoFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-11px);
}
}

.description{
margin-top:2px;
color:#858a93;
font-size:12px;
font-weight:650;
letter-spacing:.5px;
transition:
opacity .35s ease,
transform .5s ease;
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:25px;
transition:
opacity .35s ease,
transform .5s ease;
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#bfc2c7;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:.2s ease;
}

.action:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
}

.transition{
position:fixed;
inset:0;
z-index:1000;
pointer-events:none;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
transition:opacity .2s ease,visibility 0s linear .8s;
}

.transition-logo{
width:320px;
height:320px;
object-fit:contain;
opacity:0;
transform:scale(.7);
filter:
drop-shadow(0 30px 50px rgba(0,0,0,.5))
drop-shadow(0 0 40px rgba(255,255,255,.08));
}

body.page-leave .nav{
opacity:0;
transform:translate(-50%,-18px);
}

body.page-leave .hero{
opacity:0;
transform:scale(.97);
}

body.page-leave .description,
body.page-leave .actions{
opacity:0;
transform:translateY(12px);
}

body.page-leave .logo{
animation:none;
transform:scale(.8);
}

body.page-leave .transition{
opacity:1;
visibility:visible;
transition:opacity .25s ease;
}

body.page-leave .transition-logo{
animation:transitionLogo 1.05s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes transitionLogo{
0%{
opacity:0;
transform:scale(.7);
filter:
drop-shadow(0 30px 50px rgba(0,0,0,.5))
drop-shadow(0 0 20px rgba(255,255,255,.03));
}

18%{
opacity:1;
}

65%{
opacity:1;
transform:scale(1.35);
filter:
drop-shadow(0 35px 60px rgba(0,0,0,.6))
drop-shadow(0 0 80px rgba(255,255,255,.14));
}

100%{
opacity:0;
transform:scale(2.4);
filter:
drop-shadow(0 0 100px rgba(255,255,255,.2));
}
}

@media(max-width:650px){

body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo-holder{
width:270px;
height:270px;
}

.logo{
width:260px;
height:260px;
}

.logo-glow{
width:210px;
height:140px;
}

.transition-logo{
width:250px;
height:250px;
}

.description{
font-size:11px;
}

.actions{
width:100%;
max-width:330px;
}

.action{
flex:1;
padding:0 12px;
}
}

@media(prefers-reduced-motion:reduce){
.logo{
animation:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html" data-transition>Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="hero">

<div class="hero-inner">

<div class="logo-holder">

<div class="logo-glow"></div>

<img
class="logo"
src="logo.png"
alt="unYZY"

>

</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">

<a
class="action primary"
href="downloads.html"
data-transition

>

Browse Downloads </a>

<a
class="action"
href="news.html"

>

Latest News </a>

</div>

</div>

</main>

<div class="transition">
<img
class="transition-logo"
src="logo.png"
alt=""
>
</div>

<script>
const transitionLinks=document.querySelectorAll("[data-transition]");

transitionLinks.forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();

const target=link.href;

document.body.classList.add("page-leave");

setTimeout(()=>{
window.location.href=target;
},850);
});
});
</script>

</body>
</html>
