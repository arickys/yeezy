<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#7d828b;
--dim:#555a63;
}

html,body{
margin:0;
width:100%;
min-height:100%;
}

body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 50% 42%,rgba(255,255,255,.075),rgba(255,255,255,.035) 13%,rgba(255,255,255,.012) 25%,transparent 48%),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.025),transparent 38%),
var(--bg);
color:var(--white);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.018);
transition:opacity .65s ease,transform .8s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 75%);
opacity:.3;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.28) 100%);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.075);
border-radius:14px;
background:rgba(10,11,14,.68);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:color .2s ease,background .2s ease,transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 8px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.logo-area{
position:relative;
width:min(340px,45vw);
height:min(340px,45vw);
display:flex;
align-items:center;
justify-content:center;
margin-bottom:5px;
}

.logo-glow{
position:absolute;
width:270px;
height:165px;
left:50%;
top:50%;
transform:translate(-50%,-40%);
border-radius:50%;
background:rgba(255,255,255,.07);
filter:blur(72px);
opacity:.55;
pointer-events:none;
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
display:block;
object-fit:contain;
filter:
drop-shadow(0 28px 45px rgba(0,0,0,.48))
drop-shadow(0 0 45px rgba(255,255,255,.055));
animation:logoFloat 6s cubic-bezier(.45,.05,.55,.95) infinite;
}

@keyframes logoFloat{
0%,100%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-12px) scale(1.015);
}
}

.description{
margin-top:0;
color:#858a93;
font-size:12px;
font-weight:650;
letter-spacing:.5px;
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:25px;
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#bfc2c7;
text-decoration:none;
font-size:11px;
font-weight:800;
letter-spacing:-.05px;
transition:
background .2s ease,
border-color .2s ease,
color .2s ease,
transform .2s ease,
box-shadow .2s ease;
}

.action:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
box-shadow:0 14px 32px rgba(0,0,0,.3);
}

.corner{
position:absolute;
z-index:2;
color:#454a53;
font-size:9px;
font-weight:750;
letter-spacing:1.5px;
}

.corner.left{
left:30px;
bottom:27px;
}

.corner.right{
right:30px;
bottom:27px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.transition-logo{
width:min(310px,62vw);
height:min(310px,62vw);
object-fit:contain;
opacity:0;
transform:scale(.72);
filter:
drop-shadow(0 28px 55px rgba(0,0,0,.65))
drop-shadow(0 0 60px rgba(255,255,255,.07));
}

.page-transition.show .transition-logo{
opacity:1;
transform:scale(1);
transition:
opacity .5s ease,
transform .75s cubic-bezier(.22,1,.36,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:scale(1.13);
transition:
opacity .4s ease,
transform .5s cubic-bezier(.22,1,.36,1);
}

@media(max-width:650px){
body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo-area{
width:min(280px,76vw);
height:min(280px,76vw);
}

.logo-glow{
width:220px;
height:130px;
}

.description{
font-size:11px;
}

.actions{
width:100%;
max-width:330px;
margin-top:22px;
}

.action{
flex:1;
padding:0 12px;
}

.corner{
display:none;
}
}

@media(prefers-reduced-motion:reduce){
body,
.page-transition .transition-logo{
transition:none;
}

.logo{
animation:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html" data-page="downloads">Downloads</a>
<a href="updates.html" data-page="updates">Updates</a>
</nav>

<main class="hero">

<div class="hero-inner">

<div class="logo-area">
<div class="logo-glow"></div>
<img class="logo" src="logo.png" alt="">
</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">
<a class="action primary" href="downloads.html" data-page="downloads">
Browse Downloads
</a>

<a class="action" href="updates.html" data-page="updates">
Latest Updates
</a>
</div>

</div>

<div class="corner left">+</div>
<div class="corner right">+</div>

</main>

<div class="page-transition" id="pageTransition">
<img class="transition-logo" id="transitionLogo" src="LOGO2.png" alt="">
</div>

<script>
const pageTransition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");

function navigate(url,target){
if(document.body.classList.contains("leaving"))return;

document.body.classList.add("leaving");

transitionLogo.src=target==="home"?"logo.png":"LOGO2.png";

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},650);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition",target);
window.location.href=url;
},900);
}

links.forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();
navigate(link.href,link.dataset.page);
});
});

function enterPage(){
const transition=sessionStorage.getItem("unyzyTransition");
sessionStorage.removeItem("unyzyTransition");

if(transition==="home"){
transitionLogo.src="logo.png";
pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
document.body.classList.add("ready");
},600);

setTimeout(()=>{
pageTransition.classList.remove("active","show","fade");
},1050);
}else{
requestAnimationFrame(()=>{
document.body.classList.add("ready");
});
}
}

enterPage();
</script>

</body>
</html>
