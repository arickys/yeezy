<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>unYZY [404]</title>
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">

<style>
@font-face{
  font-family:Yeezy;
  src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:Yeezy;
  src:url("/fonts/yeezy_tstar-bold-webfont.woff") format("woff");
  font-weight:700;
  font-display:swap;
}
@font-face{
  font-family:AwesomePolar;
  src:url("/assets/AwesomeBi_polar-Regular.otf") format("opentype");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:OldEnglish;
  src:local("Old English Text MT"),local("UnifrakturCook");
  font-weight:400;
  font-display:swap;
}

*{box-sizing:border-box}

:root{
  --bg:#08090b;
  --white:#f5f5f6;
  --muted:#737983;
  --dim:#5e646e;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:
    linear-gradient(115deg,rgba(0,0,0,.98) 0%,rgba(0,0,0,.72) 43%,rgba(255,255,255,.1) 100%),
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.9)),
    url("/assets/BULLYLP.png") center / cover fixed;
  color:#f0eee8;
  font-family:Yeezy,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  opacity:0;
  transform:scale(1.02);
  transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);
}

body.ready{
  opacity:1;
  transform:scale(1);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 80%);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 80%);
}

.page{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
}

.content{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.code{
  margin-bottom:25px;
  color:#555b64;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,4vw,60px);
}

.number{
  font-size:clamp(125px,22vw,340px);
  line-height:.72;
  font-weight:900;
  letter-spacing:-.09em;
  color:#f1eee5;
  text-shadow:0 25px 80px rgba(0,0,0,.55);
  user-select:none;
}

.logo-wrap{
  position:relative;
  width:clamp(180px,27vw,370px);
  height:clamp(180px,27vw,370px);
  display:grid;
  place-items:center;
}

.glow{
  position:absolute;
  width:70%;
  height:45%;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  filter:blur(70px);
}

.logo{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:
    drop-shadow(0 30px 60px rgba(0,0,0,.65))
    drop-shadow(0 0 45px rgba(255,255,255,.06));
  animation:float 5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

.message{
  margin-top:38px;
}

.message h1{
  margin:0;
  font-size:clamp(25px,3vw,38px);
  font-family:AwesomePolar,Yeezy,sans-serif;
  font-weight:400;
  letter-spacing:0;
}

.message h1{
  font-family:OldEnglish,Georgia,serif;
}

.message p{
  margin:11px 0 0;
  color:#d0e8b6;
  font-size:12px;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:23px;
}

.btn{
  height:40px;
  padding:0 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.13);
  border-radius:999px;
  background:rgba(9,33,40,.45);
  color:#d9f5bc;
  text-decoration:none;
  font-family:AwesomePolar,Yeezy,sans-serif;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  transition:.2s cubic-bezier(.22,1,.36,1);
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.22);
  color:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.btn.primary{
  background:#fff;
  border-color:#fff;
  color:#090909;
}

.btn.primary:hover{
  background:#dedede;
}

@media(max-width:650px){
  .code{
    margin-bottom:18px;
  }

  .row{
    gap:5px;
  }

  .number{
    font-size:clamp(80px,23vw,155px);
  }

  .logo-wrap{
    width:clamp(120px,31vw,185px);
    height:clamp(120px,31vw,185px);
  }

  .message{
    margin-top:30px;
    padding:0 20px;
  }

  .message h1{
    font-size:25px;
  }

  .code{
    display:none;
  }

  .actions{
    flex-direction:column;
    width:min(260px,80vw);
  }
}

@media(prefers-reduced-motion:reduce){
  body,.logo,.btn{
    animation:none;
    transition:none;
  }
}
</style>
</head>

<body>

<main class="page">
  <div class="content">

    <div class="code">ERROR / 404</div>

    <div class="row">
      <div class="number">4</div>

      <div class="logo-wrap">
        <div class="glow"></div>
        <img class="logo" src="/assets/err.png" alt="404">
      </div>

      <div class="number">4</div>
    </div>

    <div class="message">
      <h1>Page not found.</h1>
      <p>
        The page you're looking for doesn't exist or isn't available.
      </p>

      <div class="actions">
        <a class="btn primary" href="/">Return Home</a>
        <a class="btn" href="/downloads">Browse Downloads</a>
      </div>
    </div>

  </div>
</main>

<script>
requestAnimationFrame(function(){
  document.body.classList.add("ready");
});

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){});
  });
}
</script>
</body>
</html>
