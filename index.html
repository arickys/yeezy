<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0c">
<title>Yeezus — Archive</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#24272d;
--line2:#30343c;
--text:#f5f5f6;
--muted:#8d929c;
--dim:#60656f;
--white:#fff;
}
html{scroll-behavior:smooth}
body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 80% -10%,rgba(255,255,255,.055),transparent 32rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
line-height:1.45;
}
button,input{font:inherit}
a{color:inherit}
.nav{
position:sticky;
top:0;
z-index:30;
height:68px;
border-bottom:1px solid rgba(255,255,255,.07);
background:rgba(8,9,11,.86);
backdrop-filter:blur(18px);
}
.nav-inner{
width:min(1180px,calc(100% - 36px));
height:100%;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}
.brand{
display:flex;
align-items:center;
gap:11px;
font-size:15px;
font-weight:800;
letter-spacing:-.3px;
}
.brand-icon{
width:31px;
height:31px;
display:grid;
place-items:center;
border-radius:8px;
background:#f4f4f5;
color:#090a0c;
font-size:17px;
font-weight:900;
box-shadow:0 0 0 1px rgba(255,255,255,.12);
}
.nav-actions{display:flex;align-items:center;gap:8px}
.nav-link{
display:inline-flex;
align-items:center;
justify-content:center;
height:34px;
padding:0 12px;
border:1px solid var(--line);
border-radius:8px;
background:rgba(255,255,255,.025);
color:var(--muted);
text-decoration:none;
font-size:12px;
font-weight:700;
transition:.18s ease;
}
.nav-link:hover{color:#fff;border-color:var(--line2);background:var(--surface2)}
.container{
width:min(1180px,calc(100% - 36px));
margin:auto;
padding:62px 0 90px;
}
.hero{
position:relative;
padding:30px 0 52px;
display:grid;
grid-template-columns:1fr auto;
gap:40px;
align-items:end;
border-bottom:1px solid var(--line);
}
.hero:after{
content:"";
position:absolute;
left:0;
bottom:-1px;
width:110px;
height:1px;
background:#fff;
}
.eyebrow{
margin-bottom:13px;
color:#7d828c;
font-size:11px;
font-weight:800;
letter-spacing:1.8px;
text-transform:uppercase;
}
h1{
margin:0;
font-size:clamp(52px,9vw,92px);
line-height:.88;
letter-spacing:-5px;
font-weight:850;
}
.subtitle{
max-width:650px;
margin-top:19px;
color:var(--muted);
font-size:15px;
}
.hero-meta{
color:#666b75;
font-size:11px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1px;
text-align:right;
line-height:1.8;
}
.hero-meta strong{display:block;color:#a5a9b1;font-size:12px}
.section{margin-top:54px}
.section-head{
display:flex;
align-items:end;
justify-content:space-between;
gap:20px;
margin-bottom:17px;
}
.section-title{
margin:0;
font-size:22px;
letter-spacing:-.7px;
}
.section-note{color:#666b75;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.toolbar{display:flex;gap:9px;margin-bottom:15px}
.field{
position:relative;
flex:1;
}
.field input{
width:100%;
height:44px;
padding:0 14px 0 40px;
border:1px solid var(--line);
border-radius:9px;
outline:none;
background:var(--surface);
color:#fff;
font-size:13px;
transition:.18s ease;
}
.field input:focus{border-color:#444952;background:#121419}
.field-icon{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
color:#707580;
font-size:16px;
pointer-events:none;
}
.news-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px;
}
.news-card{
min-width:0;
overflow:hidden;
border:1px solid var(--line);
border-radius:11px;
background:linear-gradient(180deg,#111318,#0e1013);
transition:.2s ease;
}
.news-card:hover{transform:translateY(-3px);border-color:#3a3e47;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.news-image-wrap{position:relative;height:170px;background:#181b20;overflow:hidden}
.news-image,.news-fallback{
width:100%;
height:100%;
display:block;
object-fit:cover;
}
.news-fallback{
display:grid;
place-items:center;
background:
linear-gradient(135deg,#17191e,#0e1013);
color:#555b65;
font-size:30px;
font-weight:900;
}
.news-image{transition:transform .35s ease}
.news-card:hover .news-image{transform:scale(1.025)}
.news-content{padding:15px}
.news-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}
.news-source{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#8a8f99;
font-size:10px;
font-weight:800;
letter-spacing:.9px;
text-transform:uppercase;
}
.news-date{color:#5f646d;font-size:10px;white-space:nowrap}
.news-title{
margin:8px 0 0;
font-size:15px;
line-height:1.32;
font-weight:750;
letter-spacing:-.2px;
}
.news-title a{text-decoration:none}
.news-title a:hover{text-decoration:underline}
.news-description{
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
margin-top:8px;
color:#747984;
font-size:12px;
line-height:1.45;
}
.status{
grid-column:1/-1;
padding:45px 20px;
border:1px dashed #2a2e35;
border-radius:11px;
color:#777c86;
text-align:center;
font-size:13px;
background:rgba(255,255,255,.012);
}
.status strong{display:block;margin-bottom:5px;color:#aeb2b9;font-size:14px}
.downloads{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}
.file{
min-width:0;
display:flex;
align-items:center;
gap:14px;
padding:14px;
border:1px solid var(--line);
border-radius:11px;
background:var(--surface);
transition:.2s ease;
}
.file:hover{border-color:#3a3e47;background:var(--surface2);transform:translateY(-2px)}
.icon-wrapper{
width:60px;
height:60px;
flex:0 0 60px;
overflow:hidden;
display:grid;
place-items:center;
border:1px solid #2b2f36;
border-radius:9px;
background:#191b20;
color:#777d87;
font-size:21px;
}
.icon{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1}
.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:15px;
font-weight:750;
letter-spacing:-.2px;
}
.description{
margin-top:4px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:var(--muted);
font-size:12px;
}
.file-type{
margin-top:7px;
color:#646973;
font-size:9px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
}
.download{
flex:0 0 auto;
display:inline-flex;
align-items:center;
gap:7px;
height:35px;
padding:0 12px;
border:1px solid #d7d7da;
border-radius:8px;
background:#e9e9eb;
color:#090a0c;
text-decoration:none;
font-size:12px;
font-weight:800;
transition:.18s ease;
}
.download:hover{background:#fff;border-color:#fff;transform:translateY(-1px)}
.footer{
margin-top:70px;
padding-top:22px;
border-top:1px solid var(--line);
display:flex;
justify-content:space-between;
gap:20px;
color:#555a63;
font-size:11px;
}
@media(max-width:850px){
.hero{grid-template-columns:1fr}
.hero-meta{text-align:left}
.news-grid{grid-template-columns:1fr 1fr}
.downloads{grid-template-columns:1fr}
}
@media(max-width:560px){
.nav-inner,.container{width:calc(100% - 24px)}
.container{padding-top:40px}
h1{font-size:53px;letter-spacing:-3px}
.news-grid{grid-template-columns:1fr}
.news-image-wrap{height:185px}
.file{padding:11px}
.icon-wrapper{width:53px;height:53px;flex-basis:53px}
.download{padding:0 10px}
.download-text{display:none}
.footer{flex-direction:column}
}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-inner">
<div class="brand">
<div class="brand-icon">↓</div>
Yeezus
</div>
<div class="nav-actions">
<a class="nav-link" href="#news">News</a>
<a class="nav-link" href="#downloads">Downloads</a>
<a class="nav-link" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
</div>
</div>
</nav>

<main class="container">
<section class="hero">
<div>
<div class="eyebrow">Unreleased Archive</div>
<h1>Yeezus</h1>
<div class="subtitle">A clean archive for projects, builds, files, and Kanye West news.</div>
</div>
<div class="hero-meta"><strong>Archive</strong>Downloads & updates</div>
</section>

<section class="section" id="news">
<div class="section-head">
<h2 class="section-title">Kanye West News</h2>
<div class="section-note">Latest stories</div>
</div>
<div class="toolbar">
<div class="field">
<div class="field-icon">⌕</div>
<input id="newsSearch" type="text" placeholder="Search Kanye West news..." autocomplete="off">
</div>
</div>
<div id="news" class="news-grid">
<div class="status">Loading news...</div>
</div>
</section>

<section class="section" id="downloads">
<div class="section-head">
<h2 class="section-title">Downloads</h2>
<div class="section-note">ZIP archives</div>
</div>
<div class="toolbar">
<div class="field">
<div class="field-icon">⌕</div>
<input id="search" type="text" placeholder="Search downloads..." autocomplete="off">
</div>
</div>
<div class="downloads" id="downloadsList"></div>
</section>

<footer class="footer">
<span>Yeezus Archive</span>
<span>Built for simple file sharing</span>
</footer>
</main>

<script>
const files=[
{name:"IN A PERFECT WORLD",description:"10/10",file:"IN A PERFECT WORLD.zip",icon:"IAPW.png"}
];

const news=document.getElementById("news");
const newsSearch=document.getElementById("newsSearch");
const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[char]));
}

function escapeAttr(value){
return escapeHTML(value);
}

function formatDate(value){
if(!value)return "";
const date=new Date(value);
if(Number.isNaN(date.getTime()))return "";
return date.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}

function renderNews(articles){
if(!articles.length){
news.innerHTML='<div class="status"><strong>No stories found</strong>Try another search.</div>';
return;
}

news.innerHTML=articles.slice(0,9).map(article=>{
const title=escapeHTML(article.title||"Untitled");
const source=escapeHTML(article.source?.name||"News");
const description=escapeHTML(article.description||"");
const url=escapeAttr(article.url||"#");
const image=article.urlToImage
?`<div class="news-image-wrap"><img class="news-image" src="${escapeAttr(article.urlToImage)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;news-fallback&quot;>Y</div>'"></div>`
:`<div class="news-image-wrap"><div class="news-fallback">Y</div></div>`;
return `<article class="news-card">${image}<div class="news-content"><div class="news-top"><div class="news-source">${source}</div><div class="news-date">${formatDate(article.publishedAt)}</div></div><div class="news-title"><a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a></div>${description?`<div class="news-description">${description}</div>`:""}</div></article>`;
}).join("");
}

async function loadNews(query="Kanye West"){
news.innerHTML='<div class="status">Loading news...</div>';
try{
const response=await fetch(`/api/news?q=${encodeURIComponent(query)}`,{cache:"no-store"});
const data=await response.json();
if(!response.ok||data.status!=="ok")throw new Error(data.message||"News request failed");
renderNews(data.articles||[]);
}catch(error){
news.innerHTML='<div class="status"><strong>News is temporarily unavailable</strong>Try refreshing in a moment.</div>';
}
}

function renderFiles(filter=""){
const value=filter.toLowerCase().trim();
const filtered=files.filter(file=>file.name.toLowerCase().includes(value)||file.description.toLowerCase().includes(value));
if(!filtered.length){
downloads.innerHTML='<div class="status"><strong>No downloads found</strong>Try another search.</div>';
return;
}
downloads.innerHTML=filtered.map(file=>`
<div class="file">
<div class="icon-wrapper"><img class="icon" src="${escapeAttr(file.icon)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='📦'"></div>
<div class="info">
<div class="name">${escapeHTML(file.name)}</div>
<div class="description">${escapeHTML(file.description)}</div>
<div class="file-type">ZIP Archive</div>
</div>
<a class="download" href="${escapeAttr(file.file)}" download><span>↓</span><span class="download-text">Download</span></a>
</div>`).join("");
}

search.addEventListener("input",()=>renderFiles(search.value));

let newsTimer;
newsSearch.addEventListener("input",()=>{
clearTimeout(newsTimer);
newsTimer=setTimeout(()=>{
const query=newsSearch.value.trim();
loadNews(query?`Kanye West ${query}`:"Kanye West");
},450);
});

renderFiles();
loadNews();
</script>
</body>
</html>
