<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>unYZY [DOWNLOADS]</title>
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">

<style>
@font-face{
font-family:YeezyTSTAR;
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:YeezyTSTAR;
src:url("/fonts/yeezy_tstar-bold-webfont.woff") format("woff");
font-weight:700 950;
font-style:normal;
font-display:swap;
}

*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15181d;
--line:rgba(255,255,255,.075);
--text:#f5f5f6;
--muted:#858b95;
--dim:#626873;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.065),transparent 31rem),
radial-gradient(circle at 0 70%,rgba(255,255,255,.018),transparent 28rem),
var(--bg);
color:var(--text);
font-family:YeezyTSTAR,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:opacity .55s ease,transform .7s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(11,12,15,.78);
backdrop-filter:blur(24px) saturate(150%);
box-shadow:0 18px 55px rgba(0,0,0,.4);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:700;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
}

.container{
width:min(1100px,calc(100% - 36px));
margin:auto;
padding:130px 0 90px;
}

.heading{
display:flex;
align-items:center;
justify-content:space-between;
gap:25px;
margin-bottom:25px;
}

.heading-left{
display:flex;
align-items:center;
gap:17px;
}

.heading-logo{
width:55px;
height:55px;
object-fit:contain;
filter:drop-shadow(0 15px 30px rgba(0,0,0,.5));
}

.heading h1{
margin:0;
font-size:44px;
line-height:.9;
letter-spacing:-2.5px;
font-weight:900;
}

.count{
color:var(--dim);
font-size:11px;
font-weight:700;
}

.search{
position:relative;
margin-bottom:14px;
}

.search input{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:rgba(16,18,22,.8);
color:#fff;
font-family:inherit;
font-size:12px;
transition:.2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:rgba(255,255,255,.16);
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#656b74;
font-size:18px;
pointer-events:none;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
position:relative;
display:flex;
align-items:center;
gap:15px;
min-height:102px;
padding:14px;
overflow:hidden;
border:1px solid var(--line);
border-radius:14px;
background:
linear-gradient(145deg,rgba(255,255,255,.028),rgba(255,255,255,.006)),
var(--surface);
box-shadow:0 8px 25px rgba(0,0,0,.08);
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.file:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
115deg,
transparent 25%,
rgba(255,255,255,.025) 50%,
transparent 75%
);
transform:translateX(-100%);
transition:transform .6s ease;
pointer-events:none;
}

.file:hover:after{
transform:translateX(100%);
}

.file:hover{
transform:translateY(-4px);
border-color:rgba(255,255,255,.14);
background:
linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.008)),
var(--surface2);
box-shadow:0 22px 50px rgba(0,0,0,.25);
}

.file.shared{
border-color:rgba(255,255,255,.28);
box-shadow:
0 0 0 1px rgba(255,255,255,.05),
0 20px 55px rgba(0,0,0,.28);
animation:sharedPulse 1.5s ease;
}

@keyframes sharedPulse{
0%{
transform:scale(1);
}
35%{
transform:scale(1.012);
}
100%{
transform:scale(1);
}
}

.icon{
position:relative;
width:70px;
height:70px;
flex:0 0 70px;
overflow:hidden;
display:grid;
place-items:center;
border:1px solid rgba(255,255,255,.07);
border-radius:10px;
background:#17191e;
color:#666d77;
font-size:21px;
}

.icon:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
135deg,
rgba(255,255,255,.06),
transparent 50%
);
pointer-events:none;
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:15px;
font-weight:700;
letter-spacing:-.25px;
}

.description{
margin-top:4px;
color:#808690;
font-size:11px;
}

.meta{
display:flex;
align-items:center;
gap:8px;
margin-top:9px;
}

.type{
color:#5f6570;
font-size:8px;
font-weight:700;
letter-spacing:1.1px;
text-transform:uppercase;
}

.dot{
width:3px;
height:3px;
border-radius:50%;
background:#444950;
}

.actions{
display:flex;
align-items:center;
gap:6px;
flex:0 0 auto;
}

.download,
.share{
height:36px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
border-radius:8px;
font-family:inherit;
font-size:10px;
font-weight:700;
cursor:pointer;
transition:
transform .18s ease,
background .18s ease,
border-color .18s ease,
box-shadow .18s ease;
}

.download{
padding:0 13px;
border:1px solid rgba(255,255,255,.16);
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-1px);
box-shadow:0 8px 20px rgba(255,255,255,.08);
}

.share{
width:38px;
padding:0;
border:1px solid rgba(255,255,255,.09);
background:rgba(255,255,255,.035);
color:#9ca1a9;
}

.share:hover{
color:#fff;
border-color:rgba(255,255,255,.18);
background:rgba(255,255,255,.075);
transform:translateY(-1px);
box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.share.copied{
color:#fff;
border-color:rgba(255,255,255,.25);
background:rgba(255,255,255,.1);
}

.share-icon{
font-size:15px;
line-height:0;
}

.empty{
grid-column:1/-1;
padding:55px 20px;
border:1px dashed rgba(255,255,255,.09);
border-radius:13px;
text-align:center;
color:#6d737d;
font-size:11px;
}

.transition{
position:fixed;
inset:0;
z-index:999;
display:grid;
place-items:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.transition.active{
opacity:1;
visibility:visible;
}

.transition img{
width:min(300px,60vw);
height:min(300px,60vw);
object-fit:contain;
opacity:0;
transform:scale(.7);
filter:drop-shadow(0 30px 60px rgba(0,0,0,.7));
}

.transition.show img{
opacity:1;
transform:scale(1);
transition:opacity .5s ease,transform .7s cubic-bezier(.22,1,.36,1);
}

.transition.fade img{
opacity:0;
transform:scale(1.08);
transition:opacity .4s ease,transform .45s ease;
}

@media(max-width:760px){

.downloads{
grid-template-columns:1fr;
}

}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.container{
width:calc(100% - 24px);
padding-top:105px;
}

.heading h1{
font-size:37px;
}

.heading-logo{
width:45px;
height:45px;
}

.file{
min-height:88px;
padding:11px;
gap:11px;
}

.icon{
width:55px;
height:55px;
flex-basis:55px;
}

.name{
font-size:13px;
}

.actions{
gap:5px;
}

.download{
width:38px;
padding:0;
}

.download-text{
display:none;
}

.share{
width:38px;
}

}

@media(prefers-reduced-motion:reduce){

body,
.file,
.download,
.share,
.transition img{
transition:none;
}

.file:after{
display:none;
}

}

</style>
</head>

<body>

<nav class="nav">

<a href="/" data-page="home">
Home
</a>

<a
href="/downloads"
class="active"
data-page="downloads"
>
Downloads
</a>

<a
href="/updates"
data-page="updates"
>
Updates
</a>

</nav>


<main class="container">

<header class="heading">

<div class="heading-left">

<img
class="heading-logo"
src="/assets/LOGO2.png"
alt=""
>

<h1>
Downloads
</h1>

</div>

<div
class="count"
id="fileCount"
></div>

</header>


<div class="search">

<div class="search-icon">
⌕
</div>

<input
id="search"
type="text"
placeholder="Search downloads..."
autocomplete="off"
>

</div>


<section
class="downloads"
id="downloadsList"
></section>

</main>


<div
class="transition"
id="transition"
>

<img
id="transitionLogo"
src="/assets/LOGO2.png"
alt=""
>

</div>


<script>

const files=[
{
name:"IN A PERFECT WORLD",
description:"ALREADY IN THE FINISHED STAGES OF RECORDING IN A PERFECT WORLD, NEVER RELEASED.",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
},
{
name:"IN A PERFECT WORLD [EARLY]",
description:"EARLY STAGES OF RECORDING IN A PERFECT WORLD.",
file:"IN A PERFECT WORLD [EARLY].zip",
icon:"IAPWE.png"
},
{
name:"BULLY [FIRST]",
description:"FIRST VERSION OF BULLY, CONTAINS AI VOCALS OF KANYE.",
file:"BULLY [FIRST].zip",
icon:"BULLY1.png"
}
];

const downloads=
document.getElementById("downloadsList");

const search=
document.getElementById("search");

const fileCount=
document.getElementById("fileCount");

const transition=
document.getElementById("transition");

const transitionLogo=
document.getElementById("transitionLogo");

const links=
document.querySelectorAll("[data-page]");

let navigating=false;


function escapeHTML(value){

return String(value??"")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));

}


function getShareURL(file){

const url=
new URL(
window.location.href
);

url.search="";

url.searchParams.set(
"file",
file.name
);

return url.href;

}


function renderFiles(filter=""){

const value=
filter.toLowerCase().trim();

const filtered=
files.filter(file=>
file.name
.toLowerCase()
.includes(value) ||

file.description
.toLowerCase()
.includes(value)
);

fileCount.textContent=
`${filtered.length} ${
filtered.length===1
?"file"
:"files"
}`;

if(!filtered.length){

downloads.innerHTML=`
<div class="empty">
No downloads found.
</div>
`;

return;
}


downloads.innerHTML=
filtered.map(file=>`

<article
class="file"
data-file="${escapeHTML(file.name)}"
>

<div class="icon">

<img
src="/assets/${encodeURIComponent(file.icon)}"
alt=""
onerror="this.remove();this.parentElement.textContent='◈'"
>

</div>


<div class="info">

<div class="name">
${escapeHTML(file.name)}
</div>

<div class="description">
${escapeHTML(file.description)}
</div>

<div class="meta">

<span class="type">
ZIP Archive
</span>

<span class="dot"></span>

<span class="type">
Available
</span>

</div>

</div>


<div class="actions">

<a
class="download"
href="${encodeURIComponent(file.file)}"
download
>

<span>
↓
</span>

<span class="download-text">
Download
</span>

</a>


<button
class="share"
type="button"
data-share="${escapeHTML(file.name)}"
aria-label="Share ${escapeHTML(file.name)}"
title="Share"
>

<span class="share-icon">
↗
</span>

</button>

</div>

</article>

`).join("");


downloads
.querySelectorAll(".share")
.forEach(button=>{

button.addEventListener(
"click",
()=>shareFile(
button.dataset.share,
button
)
);

});


highlightSharedFile();

}


async function shareFile(name,button){

const file=
files.find(
item=>item.name===name
);

if(!file){
return;
}

const url=
getShareURL(file);

try{

if(
navigator.share
){

await navigator.share({
title:`unYZY — ${file.name}`,
text:file.description,
url:url
});

button.classList.add("copied");

setTimeout(()=>{
button.classList.remove("copied");
},1200);

return;

}

await navigator.clipboard.writeText(url);

button.classList.add("copied");

button.innerHTML=
`<span class="share-icon">✓</span>`;

setTimeout(()=>{

button.classList.remove("copied");

button.innerHTML=
`<span class="share-icon">↗</span>`;

},1400);

}catch(error){

if(
error.name==="AbortError"
){
return;
}

try{

const textarea=
document.createElement("textarea");

textarea.value=url;

textarea.style.position="fixed";
textarea.style.opacity="0";

document.body.appendChild(textarea);

textarea.select();

document.execCommand("copy");

textarea.remove();

button.classList.add("copied");

button.innerHTML=
`<span class="share-icon">✓</span>`;

setTimeout(()=>{

button.classList.remove("copied");

button.innerHTML=
`<span class="share-icon">↗</span>`;

},1400);

}catch{}

}

}


function highlightSharedFile(){

const params=
new URLSearchParams(
window.location.search
);

const sharedName=
params.get("file");

if(!sharedName){
return;
}

const card=
[...downloads.querySelectorAll(".file")]
.find(
element=>
element.dataset.file===sharedName
);

if(!card){
return;
}

setTimeout(()=>{

card.scrollIntoView({
behavior:"smooth",
block:"center"
});

card.classList.add("shared");

setTimeout(()=>{

card.classList.remove("shared");

},1800);

},250);

}


function getLogo(target){

return target==="home"
?"/assets/logo.png"
:"/assets/LOGO2.png";

}


function navigate(url,target){

if(navigating){
return;
}

navigating=true;

document.body.classList.add(
"leaving"
);

transitionLogo.src=
getLogo(target);

transition.classList.add(
"active"
);

requestAnimationFrame(()=>{

transition.classList.add(
"show"
);

});

setTimeout(()=>{

transition.classList.add(
"fade"
);

},620);

setTimeout(()=>{

sessionStorage.setItem(
"unyzyTransition",
target
);

location.href=url;

},880);

}


links.forEach(link=>{

link.addEventListener(
"click",
e=>{

e.preventDefault();

navigate(
link.href,
link.dataset.page
);

});

});


function enter(){

const target=
sessionStorage.getItem(
"unyzyTransition"
);

sessionStorage.removeItem(
"unyzyTransition"
);

if(target){

transitionLogo.src=
getLogo(target);

transition.classList.add(
"active"
);

requestAnimationFrame(()=>{

transition.classList.add(
"show"
);

});

setTimeout(()=>{

transition.classList.add(
"fade"
);

document.body.classList.add(
"ready"
);

},500);

setTimeout(()=>{

transition.classList.remove(
"active",
"show",
"fade"
);

},930);

}else{

requestAnimationFrame(()=>{

document.body.classList.add(
"ready"
);

});

}

}


search.addEventListener(
"input",
()=>{
renderFiles(search.value);
}
);


renderFiles();

enter();

</script>

</body>
</html>
