<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/png" href="/assets/NO_CIERTO_BESAME_MAMA.png">
<link rel="stylesheet" href="/theme.css">
<title>unYZY [DOWNLOADS]</title>

<style>
.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
  flex-wrap:wrap;
  padding-bottom:25px;
  border-bottom:1px solid var(--line);
}

.heading-left{
  display:flex;
  align-items:center;
  gap:17px;
}

.heading-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  filter:
    drop-shadow(0 15px 28px rgba(0,0,0,.45))
    drop-shadow(0 0 25px rgba(255,255,255,.04));
}

.heading h1{
  margin:0;
  font-size:45px;
  line-height:1;
  font-weight:700;
  letter-spacing:-2.8px;
}

.count{
  color:var(--dim);
  font-size:11px;
  font-weight:700;
}

/* ---- controls row: search + sort/filter chips ---- */

.controls{
  display:flex;
  gap:10px;
  margin:22px 0 22px;
  flex-wrap:wrap;
}

.search{
  position:relative;
  flex:1 1 260px;
  min-width:0;
}

.search input{
  width:100%;
  height:45px;
  padding:0 15px 0 43px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  outline:none;
  background:var(--surface);
  color:#fff;
  font-family:inherit;
  font-size:12px;
  transition:
    border-color var(--dur-fast) ease,
    background var(--dur-fast) ease,
    box-shadow var(--dur-fast) ease;
}

.search input::placeholder{
  color:#5d626b;
}

.search input:focus{
  border-color:rgba(255,255,255,.16);
  background:#121419;
  box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#666c76;
  font-size:17px;
  pointer-events:none;
}

.filters{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.chip{
  height:45px;
  display:inline-flex;
  align-items:center;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:var(--surface);
  color:var(--muted);
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:
    border-color var(--dur-fast) ease,
    background var(--dur-fast) ease,
    color var(--dur-fast) ease,
    transform var(--dur-fast) ease;
}

.chip:hover{
  color:#fff;
  border-color:rgba(255,255,255,.16);
}

.chip:active{
  transform:scale(.96);
}

.chip.active{
  color:#0a0b0d;
  background:#e7e7e9;
  border-color:#e7e7e9;
}

/* ---- grid ---- */

.downloads{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.file{
  position:relative;
  display:grid;
  grid-template-columns:72px minmax(0,1fr) auto;
  align-items:center;
  gap:16px;
  min-height:104px;
  padding:15px;
  overflow:hidden;
}

.file.has-preview{
  grid-template-rows:auto auto;
}

.preview-toggle{
  grid-column:2/3;
  grid-row:2;
  justify-self:start;
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:none;
  background:none;
  color:var(--dim);
  font-family:inherit;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.3px;
  cursor:pointer;
  padding:0;
  z-index:2;
  transition:color var(--dur-fast) ease;
}

.preview-toggle:hover{
  color:var(--text);
}

.preview-toggle-icon{
  display:inline-block;
  font-size:8px;
  transition:transform var(--dur-base) var(--ease-spring);
}

.preview-toggle.is-open .preview-toggle-icon{
  transform:rotate(180deg);
}

.preview-contents{
  grid-column:1/-1;
  grid-row:3;
  z-index:2;
  max-height:0;
  overflow:hidden;
  transition:max-height var(--dur-base) var(--ease-in-out);
}

.preview-contents.is-open{
  max-height:220px;
}

.preview-contents-inner{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.preview-row{
  display:flex;
  align-items:center;
  gap:8px;
  color:#8b909a;
  font-size:10.5px;
}

.preview-row-icon{
  flex:0 0 auto;
  color:var(--dimmer);
  font-size:11px;
}

.preview-row-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.preview-row-size{
  flex:0 0 auto;
  color:var(--dimmer);
  font-size:9.5px;
}

.preview-audio{
  width:100%;
  flex:0 0 100%;
  height:30px;
  margin-top:4px;
  accent-color:#fff;
}

.file:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.035),transparent 75%);
  opacity:0;
  transform:translateX(-25%);
  transition:opacity var(--dur-base) ease,transform var(--dur-slow) ease;
}

.file:hover:after{
  opacity:1;
  transform:translateX(25%);
}

.icon{
  position:relative;
  z-index:2;
  width:72px;
  height:72px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  border-radius:11px;
  background:#181a1f;
  color:#565b64;
  font-size:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

.icon-fallback{
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
}

.icon img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.info{
  position:relative;
  z-index:2;
  min-width:0;
}

.name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.25px;
}

.description{
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#777d87;
  font-size:11px;
}

.type{
  display:inline-flex;
  margin-top:9px;
  padding:4px 7px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:5px;
  color:#626873;
  font-size:8px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
}

.file-actions{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  gap:6px;
}

.download,
.share{
  height:37px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:8px;
  font-family:inherit;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
  border:1px solid transparent;
  transition:
    transform var(--dur-fast) ease,
    background var(--dur-fast) ease,
    border-color var(--dur-fast) ease,
    color var(--dur-fast) ease;
}

.download{
  padding:0 13px;
  border-color:rgba(255,255,255,.75);
  background:#e7e7e9;
  color:#090a0c;
  text-decoration:none;
}

.download:hover{
  transform:translateY(-1px);
  background:#fff;
}

.download:active,
.share:active{
  transform:scale(.96);
}

.share{
  padding:0 12px;
  border-color:rgba(255,255,255,.1);
  background:rgba(255,255,255,.045);
  color:#d7d9dd;
}

.share:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.18);
  color:#fff;
}

.share-icon{
  font-size:13px;
  line-height:1;
}

.share.copied{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.25);
  color:#fff;
}

.empty{
  grid-column:1/-1;
  padding:50px 20px;
  border:1px dashed rgba(255,255,255,.09);
  border-radius:13px;
  text-align:center;
  color:#686e77;
  font-size:11px;
}

/* ---- grouped sections ---- */

.group{
  margin-bottom:30px;
}

.group:last-child{
  margin-bottom:0;
}

.group-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.group-title{
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
}

.group-count{
  color:var(--dimmer);
  font-size:10px;
  font-weight:700;
}

.group-line{
  flex:1;
  height:1px;
  background:var(--line);
}

/* ---- sort select, sits with the filter chips ---- */

.sort-select{
  height:45px;
  padding:0 32px 0 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:
    var(--surface)
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%23858b95'/></svg>")
    no-repeat right 13px center;
  color:var(--muted);
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  transition:border-color var(--dur-fast) ease,color var(--dur-fast) ease;
}

.sort-select:hover{
  color:#fff;
  border-color:rgba(255,255,255,.16);
}

.sort-select:focus-visible{
  outline:2px solid rgba(255,255,255,.55);
  outline-offset:2px;
}

@media(max-width:900px){
  .downloads{
    grid-template-columns:1fr;

}

@media(max-width:560px){

  }

  }

  }

@media(max-width:390px){

}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
"use strict";

var files=[
  {id:"bully-early",name:"BULLY [EARLY]",description:"Early version of BULLY, very little songs, uses AI vocals.",file:"BULLY [EARLY].zip",icon:"BULLYEARLY.png",project:"BULLY"},
  {id:"bully-first",name:"BULLY [FIRST]",description:"First version of BULLY, contains AI vocals of Kanye.",file:"BULLY [FIRST].zip",icon:"BULLY1.png",project:"BULLY"},
  {id:"bully-second",name:"BULLY [SECOND]",description:"Second version of BULLY, still contains AI vocals of Kanye.",file:"BULLY [SECOND].zip",icon:"BULLY2.png",project:"BULLY"},
  {id:"bully-third",name:"BULLY [THIRD]",description:"Third version of BULLY, new beats, new vocals.",file:"BULLY [THIRD].zip",icon:"BULLY3.png",project:"BULLY"},
  {id:"bully-irko",name:"BULLY [IRKO]",description:"AI vocals, remixed.",file:"BULLY [IRKO].zip",icon:"NO_CIERTO_BESAME_MAMA.png",project:"BULLY"},
  {id:"bully-delux",name:"BULLY [DELUXE]",description:"OK, control that mission!",file:"BULLY [DELUXE].zip",icon:"BULLYDELUXE.png",project:"BULLY"},
  {id:"bully-dgfirst",name:"BULLY [DIGITAL FIRST]",description:"First digital copy of BULLY.",file:"BULLY [DIGITAL FIRST].zip",icon:"BULLYDG.png",project:"BULLY"},
  {id:"bully-lp",name:"BULLY [LISTENING PARTY]",description:"The first listening party [private] for BULLY!",file:"BULLY [LISTENING PARTY].zip",icon:"BULLYLP.png",project:"BULLY"},
  {id:"bully-pv",name:"BULLY [PHYSICAL VERSION]",description:"The first physical version for BULLY! [Sold out immediately]",file:"BULLY [PHYSICAL VERSION].zip",icon:"BULLYPV.png",project:"BULLY"},
  {id:"iapw",name:"IN A PERFECT WORLD",description:"Already in the finished stages of recording In A Perfect World, never released.",file:"IN A PERFECT WORLD.zip",icon:"IAPW.png",project:"IAPW"},
  {id:"iapw-early",name:"IN A PERFECT WORLD [EARLY]",description:"Early stages of recording In A Perfect World.",file:"IN A PERFECT WORLD [EARLY].zip",icon:"IAPWE.png",project:"IAPW"}
];

var projects=["All","BULLY","IAPW"];
var activeProject="All";
var activeSort="newest";

var downloadsEl=document.getElementById("downloadsList");
var searchEl=document.getElementById("search");
var filtersEl=document.getElementById("filters");
var sortEl=document.getElementById("sortSelect");
var fileCountEl=document.getElementById("fileCount");
var toastEl=document.getElementById("toast");

var toastTimer;
var zipCache={}; // id -> array of {name,size} once read

function escapeHTML(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(ch){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[ch];
  });
}

function formatBytes(bytes){
  if(!bytes&&bytes!==0)return "";
  if(bytes<1024)return bytes+" B";
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
  return (bytes/(1024*1024)).toFixed(1)+" MB";
}

function iconFor(name){
  if(/\.(mp3|wav|m4a|flac|aac)$/i.test(name))return "♪";
  if(/\.(jpg|jpeg|png|gif|webp)$/i.test(name))return "▨";
  if(/\.(txt|md|nfo)$/i.test(name))return "▤";
  return "▫";
}

function getDownloadURL(file){
  return new URL(file.file,window.location.origin).href;
}

function showToast(message){
  clearTimeout(toastTimer);
  toastEl.textContent=message;
  toastEl.classList.add("show");
  toastTimer=setTimeout(function(){toastEl.classList.remove("show");},2200);
}

function shareFile(file,button){
  var url=getDownloadURL(file);
  var shareData={title:file.name+" — unYZY",text:"Download "+file.name+" from unYZY.",url:url};

  function fallbackCopy(){
    navigator.clipboard.writeText(url).then(function(){
      button.classList.add("copied");
      button.querySelector(".share-text").textContent="Copied";
      showToast("Download link copied.");
      setTimeout(function(){
        button.classList.remove("copied");
        button.querySelector(".share-text").textContent="Share";
      },1800);
    }).catch(function(){showToast("Unable to share this download.");});
  }

  if(navigator.share){
    navigator.share(shareData).then(function(){showToast("Shared successfully.");}).catch(function(error){
      if(error&&error.name==="AbortError")return;
      fallbackCopy();
    });
  }else{
    fallbackCopy();
  }
}

/* ---- real zip reading, on demand ---- */

function readZipEntries(file){
  if(zipCache[file.id]){
    return Promise.resolve(zipCache[file.id]);
  }

  return fetch(getDownloadURL(file))
    .then(function(res){
      if(!res.ok)throw new Error("fetch failed: "+res.status);
      return res.blob();
    })
    .then(function(blob){
      return JSZip.loadAsync(blob);
    })
    .then(function(zip){
      var entries=[];
      var audioEntries=[];
      zip.forEach(function(relPath,entry){
        if(entry.dir)return;
        var item={
          name:relPath,
          size:(entry._data&&entry._data.uncompressedSize)||entry.uncompressedSize||0,
          isAudio:/\.(mp3|wav|m4a|aac|ogg)$/i.test(relPath),
          zipEntry:entry
        };
        entries.push(item);
        if(item.isAudio)audioEntries.push(item);
      });
      entries.sort(function(a,b){return a.name.localeCompare(b.name);});
      return Promise.all(audioEntries.map(function(item){
        return item.zipEntry.async("blob").then(function(blob){
          item.url=URL.createObjectURL(blob);
          delete item.zipEntry;
        });
      })).then(function(){
        entries.forEach(function(item){delete item.zipEntry;});
        zipCache[file.id]=entries;
        return entries;
      });
    });
}

function contentsRowsHTML(entries){
  if(!entries.length){
    return '<div class="preview-row"><span class="preview-row-name">Empty archive.</span></div>';
  }
  return entries.map(function(item){
    return ''+
      '<div class="preview-row">'+
        '<span class="preview-row-icon">'+iconFor(item.name)+'</span>'+
        '<span class="preview-row-name">'+escapeHTML(item.name)+'</span>'+
        '<span class="preview-row-size">'+escapeHTML(formatBytes(item.size))+'</span>'+ 
        (item.url?'<audio class="preview-audio" controls preload="none" src="'+escapeHTML(item.url)+'"></audio>':'')+
      '</div>';
  }).join("");
}

function togglePreview(file,button){
  var panel=document.getElementById("preview-"+file.id);
  if(!panel)return;

  var willOpen=!panel.classList.contains("is-open");

  if(!willOpen){
    panel.classList.remove("is-open");
    button.classList.remove("is-open");
    button.querySelector("span").textContent="Preview contents";
    return;
  }

  // opening: show it immediately with a loading state, then fill in
  // real contents once the zip has actually been fetched and read
  panel.classList.add("is-open");
  button.classList.add("is-open");

  if(zipCache[file.id]){
    panel.querySelector(".preview-contents-inner").innerHTML=contentsRowsHTML(zipCache[file.id]);
    button.querySelector("span").textContent="Hide contents";
    return;
  }

  panel.querySelector(".preview-contents-inner").innerHTML=
    '<div class="preview-row preview-loading"><span class="preview-row-name">Reading archive…</span></div>';
  button.querySelector("span").textContent="Loading…";
  button.disabled=true;

  readZipEntries(file).then(function(entries){
    panel.querySelector(".preview-contents-inner").innerHTML=contentsRowsHTML(entries);
    button.querySelector("span").textContent="Hide contents";
    button.disabled=false;
  }).catch(function(err){
    panel.querySelector(".preview-contents-inner").innerHTML=
      '<div class="preview-row"><span class="preview-row-name">Couldn\'t read this archive.</span></div>';
    button.querySelector("span").textContent="Preview contents";
    button.disabled=false;
    panel.classList.remove("is-open");
    button.classList.remove("is-open");
    console.error("zip preview failed for",file.id,err);
  });
}

/* ---- rendering ---- */

function fileCardHTML(file){
  return ''+
    '<article class="file surface-card has-preview">'+
      '<div class="icon">'+
        '<img src="/assets/'+escapeHTML(file.icon)+'" alt="" '+
          'onerror="this.outerHTML=\'<span class=&quot;icon-fallback&quot;>&#9635;</span>\'">'+
      '</div>'+
      '<div class="info">'+
        '<div class="name">'+escapeHTML(file.name)+'</div>'+
        '<div class="description">'+escapeHTML(file.description)+'</div>'+
        '<div class="type">ZIP Archive</div>'+
      '</div>'+
      '<div class="file-actions">'+
        '<a class="download" href="'+escapeHTML(file.file)+'" download title="Download '+escapeHTML(file.name)+'">'+
          '<span>↓</span><span class="download-text">Download</span>'+
        '</a>'+
        '<button class="share" type="button" data-share-id="'+escapeHTML(file.id)+'" title="Share '+escapeHTML(file.name)+'">'+
          '<span class="share-icon">↗</span><span class="share-text">Share</span>'+
        '</button>'+
      '</div>'+
      '<button class="preview-toggle" type="button" data-preview-id="'+escapeHTML(file.id)+'">'+
        '<span>Preview contents</span><span class="preview-toggle-icon">⌄</span>'+
      '</button>'+
      '<div class="preview-contents" id="preview-'+escapeHTML(file.id)+'">'+
        '<div class="preview-contents-inner"></div>'+
      '</div>'+
    '</article>';
}

function sortFiles(list){
  var copy=list.slice();
  if(activeSort==="az"){
    copy.sort(function(a,b){return a.name.localeCompare(b.name);});
  }
  return copy;
}

function renderFilters(){
  filtersEl.innerHTML=projects.map(function(project){
    return '<button class="chip'+(project===activeProject?" active":"")+
      '" type="button" data-project="'+escapeHTML(project)+'">'+
      escapeHTML(project==="All"?"All Projects":project)+
      "</button>";
  }).join("");

  filtersEl.querySelectorAll("[data-project]").forEach(function(btn){
    btn.addEventListener("click",function(){
      activeProject=btn.dataset.project;
      renderFilters();
      renderFiles(searchEl.value);
    });
  });
}

function renderFiles(filter){
  var value=(filter||"").toLowerCase().trim();

  var filtered=files.filter(function(file){
    var matchesSearch=
      file.name.toLowerCase().indexOf(value)!==-1||
      file.description.toLowerCase().indexOf(value)!==-1;
    var matchesProject=activeProject==="All"||file.project===activeProject;
    return matchesSearch&&matchesProject;
  });

  fileCountEl.textContent=filtered.length+" "+(filtered.length===1?"file":"files");

  if(!filtered.length){
    downloadsEl.innerHTML='<div class="empty">No downloads found.</div>';
    return;
  }

  var groups=projects.filter(function(p){return p!=="All";}).map(function(p){
    return {name:p,items:filtered.filter(function(f){return f.project===p;})};
  }).filter(function(g){return g.items.length;});

  downloadsEl.innerHTML=groups.map(function(group){
    var items=sortFiles(group.items);
    if(activeSort==="newest"){items=items.slice().reverse();}
    return ''+
      '<div class="group">'+
        '<div class="group-head">'+
          '<div class="group-title">'+escapeHTML(group.name)+'</div>'+
          '<div class="group-count">'+items.length+'</div>'+
          '<div class="group-line"></div>'+
        '</div>'+
        '<div class="downloads">'+items.map(fileCardHTML).join("")+'</div>'+
      '</div>';
  }).join("");

  downloadsEl.querySelectorAll("[data-share-id]").forEach(function(button){
    button.addEventListener("click",function(){
      var file=files.filter(function(item){return item.id===button.dataset.shareId;})[0];
      if(file)shareFile(file,button);
    });
  });

  downloadsEl.querySelectorAll("[data-preview-id]").forEach(function(button){
    button.addEventListener("click",function(){
      var file=files.filter(function(item){return item.id===button.dataset.previewId;})[0];
      if(file)togglePreview(file,button);
    });
  });
}

searchEl.addEventListener("input",function(){renderFiles(searchEl.value);});
sortEl.addEventListener("change",function(){activeSort=sortEl.value;renderFiles(searchEl.value);});

renderFilters();
renderFiles();
})();
</script>

<script src="/footer.js"></script>
<script src="/transitions.js"></script>
</body>
</html>
