<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5d636d;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 50% 25%,rgba(255,255,255,.065),transparent 25rem),
radial-gradient(circle at 15% 80%,rgba(255,255,255,.025),transparent 25rem),
radial-gradient(circle at 85% 70%,rgba(255,255,255,.018),transparent 25rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 75%);
opacity:.35;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(11,12,15,.72);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 55px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#707680;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.1px;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#f5f5f6;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.04),
0 2px 9px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:620px;
display:flex;
align-items:center;
justify-content:center;
padding:90px 24px 40px;
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.logo-wrap{
position:relative;
width:190px;
height:190px;
margin-bottom:34px;
display:flex;
align-items:center;
justify-content:center;
}

.logo-wrap:before{
content:"";
position:absolute;
width:170px;
height:170px;
border-radius:50%;
background:rgba(255,255,255,.045);
filter:blur(38px);
opacity:.7;
}

.logo-wrap:after{
content:"";
position:absolute;
inset:24px;
border-radius:50%;
border:1px solid rgba(255,255,255,.035);
box-shadow:
0 0 60px rgba(255,255,255,.025),
inset 0 0 35px rgba(255,255,255,.018);
}

.logo{
position:relative;
z-index:2;
width:165px;
height:165px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 20px 35px rgba(0,0,0,.42))
drop-shadow(0 0 25px rgba(255,255,255,.055));
animation:float 5s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-9px);
}
}

.title{
margin:0;
font-size:clamp(68px,10vw,118px);
line-height:.8;
letter-spacing:-8px;
font-weight:950;
color:#f7f7f8;
text-shadow:0 10px 45px rgba(0,0,0,.35);
}

.description{
margin-top:25px;
color:#7c828c;
font-size:13px;
font-weight:600;
letter-spacing:.35px;
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:9px;
margin-top:30px;
}

.action{
height:42px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
padding:0 18px;
border:1px solid rgba(255,255,255,.13);
border-radius:10px;
background:rgba(255,255,255,.035);
color:#cfd1d5;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:
background .2s ease,
border-color .2s ease,
color .2s ease,
transform .2s ease,
box-shadow .2s ease;
}

.action:hover{
background:rgba(255,255,255,.085);
border-color:rgba(255,255,255,.22);
color:#fff;
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#090a0c;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#090a0c;
box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.ambient{
position:absolute;
pointer-events:none;
border-radius:50%;
border:1px solid rgba(255,255,255,.025);
}

.ambient.one{
width:480px;
height:480px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.ambient.two{
width:700px;
height:700px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
opacity:.55;
}

@media(max-width:600px){
body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:90px 18px 35px;
}

.logo-wrap{
width:145px;
height:145px;
margin-bottom:28px;
}

.logo{
width:130px;
height:130px;
}

.logo-wrap:before{
width:140px;
height:140px;
}

.logo-wrap:after{
inset:18px;
}

.title{
font-size:65px;
letter-spacing:-5px;
}

.description{
margin-top:21px;
font-size:12px;
}

.actions{
width:100%;
max-width:330px;
}

.action{
flex:1;
padding:0 12px;
}
}

@media(prefers-reduced-motion:reduce){
.logo{
animation:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html">Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="hero">

<div class="ambient one"></div>
<div class="ambient two"></div>

<div class="hero-inner">

<div class="logo-wrap">
<img class="logo" src="logo.png" alt="unYZY">
</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">
<a class="action primary" href="downloads.html">
Browse Downloads
</a>

<a class="action" href="news.html">
Latest News
</a>
</div>

</div>

</main>

</body>
</html>
