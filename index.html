<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#7d828b;
--dim:#555a63;
}

html,
body{
margin:0;
width:100%;
min-height:100%;
}

body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(
circle at 50% 42%,
rgba(255,255,255,.075) 0%,
rgba(255,255,255,.035) 13%,
rgba(255,255,255,.012) 25%,
transparent 48%
),
radial-gradient(
circle at 50% 100%,
rgba(255,255,255,.025),
transparent 38%
),
var(--bg);
color:var(--white);
font-family:
Inter,
ui-sans-serif,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
-webkit-font-smoothing:antialiased;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(
ellipse at center,
transparent 45%,
rgba(0,0,0,.28) 100%
);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:50;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.075);
border-radius:14px;
background:rgba(10,11,14,.68);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.035),
0 2px 8px rgba(0,0,0,.18);
}

.nav a:active{
transform:scale(.95);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.logo{
position:relative;
width:min(320px,42vw);
height:min(320px,42vw);
max-width:320px;
max-height:320px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 28px 45px rgba(0,0,0,.48))
drop-shadow(0 0 45px rgba(255,255,255,.055));
animation:
logoFloat 6s cubic-bezier(.45,.05,.55,.95) infinite;
}

@keyframes logoFloat{
0%,
100%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-12px) scale(1.015);
}
}

.logo-glow{
position:absolute;
z-index:-1;
width:260px;
height:150px;
left:50%;
top:50%;
transform:translate(-50%,-38%);
border-radius:50%;
background:rgba(255,255,255,.07);
filter:blur(70px);
opacity:.55;
pointer-events:none;
}

.description{
margin-top:8px;
color:#858a93;
font-size:12px;
font-weight:650;
letter-spacing:.5px;
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:25px;
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#bfc2c7;
text-decoration:none;
font-size:11px;
font-weight:800;
letter-spacing:-.05px;
transition:
background .2s ease,
border-color .2s ease,
color .2s ease,
transform .2s ease,
box-shadow .2s ease;
}

.action:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
box-shadow:0 14px 32px rgba(0,0,0,.3);
}

.corner{
position:absolute;
z-index:2;
color:#454a53;
font-size:9px;
font-weight:750;
letter-spacing:1.5px;
text-transform:uppercase;
}

.corner.left{
left:30px;
bottom:27px;
}

.corner.right{
right:30px;
bottom:27px;
}

@media(max-width:650px){

body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo{
width:min(250px,70vw);
height:min(250px,70vw);
}

.logo-glow{
width:210px;
height:125px;
}

.description{
font-size:11px;
margin-top:3px;
}

.actions{
width:100%;
max-width:330px;
margin-top:22px;
}

.action{
flex:1;
padding:0 12px;
}

.corner{
display:none;
}
}

@media(prefers-reduced-motion:reduce){

.logo{
animation:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html">Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="hero">

<div class="hero-inner">

<div class="logo-glow"></div>

<img
class="logo"
src="logo.png"
alt="unYZY"

>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">

<a
class="action primary"
href="downloads.html"

>

Browse Downloads </a>

<a
class="action"
href="news.html"

>

Latest News </a>

</div>

</div>

<div class="corner left">KEVLAR</div>
<div class="corner right">YEEZY</div>

</main>

</body>
</html>
