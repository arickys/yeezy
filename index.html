<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#7d828b;
}

html,body{
margin:0;
width:100%;
min-height:100%;
background:var(--bg);
}

body{
min-height:100vh;
overflow:hidden;
color:var(--white);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 50% 42%,rgba(255,255,255,.075),transparent 30rem),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.025),transparent 38rem);
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(
ellipse at center,
transparent 42%,
rgba(0,0,0,.32) 100%
);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translate3d(-50%,0,0);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.075);
border-radius:14px;
background:rgba(10,11,14,.7);
backdrop-filter:blur(22px) saturate(150%);
-webkit-backdrop-filter:blur(22px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.42),
inset 0 1px rgba(255,255,255,.035);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:color .18s ease,background .18s ease,transform .18s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}

.nav a:active{
transform:scale(.94);
}

.hero{
position:relative;
z-index:1;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
transition:opacity .35s ease,transform .55s cubic-bezier(.22,1,.36,1);
}

.hero-inner{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.logo-holder{
position:relative;
width:340px;
height:340px;
display:flex;
align-items:center;
justify-content:center;
}

.logo-glow{
position:absolute;
width:250px;
height:160px;
left:50%;
top:50%;
transform:translate3d(-50%,-50%,0);
border-radius:50%;
background:rgba(255,255,255,.065);
filter:blur(65px);
opacity:.5;
pointer-events:none;
}

.logo{
position:relative;
z-index:2;
width:320px;
height:320px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 28px 45px rgba(0,0,0,.46))
drop-shadow(0 0 28px rgba(255,255,255,.045));
animation:logoFloat 6s ease-in-out infinite;
will-change:transform;
}

@keyframes logoFloat{
0%,100%{
transform:translate3d(0,0,0);
}
50%{
transform:translate3d(0,-11px,0);
}
}

.description{
margin-top:0;
color:#858a93;
font-size:12px;
font-weight:650;
letter-spacing:.5px;
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:25px;
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#bfc2c7;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:
background .18s ease,
border-color .18s ease,
color .18s ease,
transform .18s ease,
box-shadow .18s ease;
}

.action:hover{
transform:translate3d(0,-2px,0);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
box-shadow:0 14px 32px rgba(0,0,0,.3);
}

.transition{
position:fixed;
inset:0;
z-index:999;
pointer-events:none;
background:#08090b;
opacity:0;
visibility:hidden;
overflow:hidden;
}

.transition-logo{
position:absolute;
left:50%;
top:50%;
width:320px;
height:320px;
object-fit:contain;
transform:translate3d(-50%,-50%,0) scale(.42);
opacity:0;
will-change:transform,opacity;
}

.transition-ring{
position:absolute;
left:50%;
top:50%;
width:25px;
height:25px;
border:1px solid rgba(255,255,255,.18);
border-radius:50%;
transform:translate3d(-50%,-50%,0) scale(1);
opacity:0;
will-change:transform,opacity;
}

body.transitioning-out .transition{
opacity:1;
visibility:visible;
}

body.transitioning-out .hero{
opacity:.05;
transform:scale(.94);
}

body.transitioning-out .nav{
opacity:0;
transform:translate3d(-50%,-18px,0);
}

body.transitioning-out .transition-logo{
animation:logoOut .72s cubic-bezier(.16,1,.3,1) forwards;
}

body.transitioning-out .transition-ring{
animation:ringOut .72s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes logoOut{
0%{
opacity:0;
transform:translate3d(-50%,-50%,0) scale(.42);
}
12%{
opacity:1;
}
62%{
opacity:1;
transform:translate3d(-50%,-50%,0) scale(1.12);
}
100%{
opacity:0;
transform:translate3d(-50%,-50%,0) scale(3.2);
}
}

@keyframes ringOut{
0%{
opacity:0;
transform:translate3d(-50%,-50%,0) scale(1);
}
15%{
opacity:.5;
}
100%{
opacity:0;
transform:translate3d(-50%,-50%,0) scale(25);
}
}

@media(max-width:650px){

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo-holder{
width:275px;
height:275px;
}

.logo{
width:260px;
height:260px;
}

.logo-glow{
width:210px;
height:130px;
}

.transition-logo{
width:260px;
height:260px;
}

.description{
font-size:11px;
}

.actions{
width:100%;
max-width:330px;
}

.action{
flex:1;
padding:0 12px;
}
}

@media(prefers-reduced-motion:reduce){

.logo{
animation:none;
}

.transition-logo,
.transition-ring{
animation:none!important;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html" data-page-transition>Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="hero">

<div class="hero-inner">

<div class="logo-holder">
<div class="logo-glow"></div>

<img
class="logo"
src="logo.png"
alt="unYZY"

>

</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">

<a
class="action primary"
href="downloads.html"
data-page-transition

>

Browse Downloads </a>

<a
class="action"
href="news.html"

>

Latest News </a>

</div>

</div>

</main>

<div class="transition">
<div class="transition-ring"></div>
<img
class="transition-logo"
src="logo.png"
alt=""
>
</div>

<script>
const transitionLinks=document.querySelectorAll("[data-page-transition]");
let locked=false;

function navigate(url){
if(locked)return;
locked=true;

document.body.classList.add("transitioning-out");

setTimeout(()=>{
window.location.href=url;
},700);
}

transitionLinks.forEach(link=>{
link.addEventListener("click",event=>{
if(
event.button!==0||
event.metaKey||
event.ctrlKey||
event.shiftKey||
event.altKey
)return;

event.preventDefault();
navigate(link.href);
});
});

window.addEventListener("pageshow",()=>{
document.body.classList.remove("transitioning-out");
locked=false;
});
</script>

</body>
</html>
