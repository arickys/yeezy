<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--white:#f5f5f6;
--muted:#858a93;
}

html,
body{
width:100%;
min-height:100%;
margin:0;
}

body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(
circle at 50% 42%,
rgba(255,255,255,.07),
transparent 31rem
),
radial-gradient(
circle at 50% 100%,
rgba(255,255,255,.025),
transparent 38rem
),
var(--bg);
color:var(--white);
font-family:
Inter,
ui-sans-serif,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
-webkit-font-smoothing:antialiased;
}

body:after{
content:"";
position:fixed;
inset:0;
z-index:20;
pointer-events:none;
background:radial-gradient(
ellipse at center,
transparent 45%,
rgba(0,0,0,.3) 100%
);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.075);
border-radius:14px;
background:rgba(10,11,14,.68);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.035);
transition:
opacity .4s ease,
transform .65s cubic-bezier(.16,1,.3,1);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#70757e;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}

.nav a:active{
transform:scale(.95);
}

.hero{
position:relative;
width:100%;
height:100vh;
min-height:600px;
display:flex;
align-items:center;
justify-content:center;
padding:80px 24px 30px;
transition:
opacity .5s ease,
transform .8s cubic-bezier(.16,1,.3,1);
}

.hero-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.logo-stage{
position:relative;
width:340px;
height:340px;
display:flex;
align-items:center;
justify-content:center;
}

.logo-glow{
position:absolute;
left:50%;
top:50%;
width:250px;
height:180px;
transform:translate(-50%,-50%);
border-radius:50%;
background:rgba(255,255,255,.075);
filter:blur(75px);
opacity:.58;
transition:
opacity .8s ease,
transform 1s cubic-bezier(.16,1,.3,1);
}

.logo{
position:relative;
z-index:2;
width:320px;
height:320px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 30px 50px rgba(0,0,0,.5))
drop-shadow(0 0 38px rgba(255,255,255,.06));
animation:logoFloat 6s cubic-bezier(.45,.05,.55,.95) infinite;
transition:
transform 1s cubic-bezier(.16,1,.3,1),
filter 1s ease;
}

.logo2{
position:absolute;
z-index:3;
width:320px;
height:320px;
display:block;
object-fit:contain;
opacity:0;
transform:scale(.9);
pointer-events:none;
filter:
drop-shadow(0 30px 55px rgba(0,0,0,.55))
drop-shadow(0 0 55px rgba(255,255,255,.12));
}

@keyframes logoFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-11px);
}
}

.description{
margin-top:0;
color:var(--muted);
font-size:12px;
font-weight:650;
letter-spacing:.5px;
transition:
opacity .35s ease,
transform .55s cubic-bezier(.16,1,.3,1);
}

.actions{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:25px;
transition:
opacity .35s ease,
transform .55s cubic-bezier(.16,1,.3,1);
}

.action{
height:40px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 17px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.025);
color:#bfc2c7;
text-decoration:none;
font-size:11px;
font-weight:800;
transition:
background .2s ease,
border-color .2s ease,
color .2s ease,
transform .2s ease,
box-shadow .2s ease;
}

.action:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
color:#fff;
box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.action.primary{
background:#e9e9eb;
border-color:#e9e9eb;
color:#08090b;
}

.action.primary:hover{
background:#fff;
border-color:#fff;
color:#08090b;
box-shadow:0 14px 32px rgba(0,0,0,.3);
}

.page-transition{
position:fixed;
inset:0;
z-index:1000;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
overflow:hidden;
}

.transition-logo{
position:absolute;
width:320px;
height:320px;
object-fit:contain;
opacity:0;
transform:scale(.75);
}

.transition-logo.second{
filter:
drop-shadow(0 0 50px rgba(255,255,255,.1))
drop-shadow(0 0 110px rgba(255,255,255,.06));
}

body.leaving .nav{
opacity:0;
transform:translate(-50%,-25px) scale(.94);
}

body.leaving .hero{
opacity:0;
transform:scale(.96);
}

body.leaving .description,
body.leaving .actions{
opacity:0;
transform:translateY(15px);
}

body.leaving .logo{
animation:none;
transform:scale(.72);
filter:
drop-shadow(0 0 80px rgba(255,255,255,.15));
}

body.leaving .logo2{
opacity:1;
transform:scale(1);
}

body.leaving .page-transition{
opacity:1;
visibility:visible;
pointer-events:auto;
animation:transitionBackground 1.15s ease forwards;
}

body.leaving .transition-logo.first{
animation:logoExpand 1.05s cubic-bezier(.16,1,.3,1) forwards;
}

body.leaving .transition-logo.second{
animation:logoSecond 1.05s cubic-bezier(.16,1,.3,1) .12s forwards;
}

@keyframes transitionBackground{
0%{
background:#08090b;
}
100%{
background:#08090b;
}
}

@keyframes logoExpand{
0%{
opacity:0;
transform:scale(.65);
filter:
drop-shadow(0 0 20px rgba(255,255,255,0));
}

15%{
opacity:1;
}

65%{
opacity:1;
transform:scale(1.25);
filter:
drop-shadow(0 0 55px rgba(255,255,255,.12));
}

100%{
opacity:0;
transform:scale(2.6);
filter:
drop-shadow(0 0 100px rgba(255,255,255,.18));
}
}

@keyframes logoSecond{
0%{
opacity:0;
transform:scale(.72);
}

20%{
opacity:1;
transform:scale(.95);
}

65%{
opacity:.95;
transform:scale(1.3);
}

100%{
opacity:0;
transform:scale(2.6);
}
}

@media(max-width:650px){

body{
overflow:auto;
}

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.hero{
min-height:100svh;
padding:75px 18px 35px;
}

.logo-stage{
width:275px;
height:275px;
}

.logo,
.logo2{
width:260px;
height:260px;
}

.logo-glow{
width:210px;
height:140px;
}

.transition-logo{
width:260px;
height:260px;
}

.description{
font-size:11px;
}

.actions{
width:100%;
max-width:330px;
}

.action{
flex:1;
padding:0 12px;
}
}

@media(prefers-reduced-motion:reduce){

.logo,
.logo2,
.transition-logo{
animation:none!important;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" class="active">Home</a>
<a href="downloads.html" data-transition>Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="hero">

<div class="hero-inner">

<div class="logo-stage">

<div class="logo-glow"></div>

<img
class="logo"
src="logo.png"
alt="unYZY"

>

<img
class="logo2"
src="LOGO2.png"
alt=""

>

</div>

<div class="description">
KEVLAR YEEZY
</div>

<div class="actions">

<a
class="action primary"
href="downloads.html"
data-transition

>

Browse Downloads </a>

<a
class="action"
href="news.html"

>

Latest News </a>

</div>

</div>

</main>

<div class="page-transition">

<img
class="transition-logo first"
src="logo.png"
alt=""

>

<img
class="transition-logo second"
src="LOGO2.png"
alt=""

>

</div>

<script>
const transitionLinks=document.querySelectorAll("[data-transition]");

transitionLinks.forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();

const target=link.href;

document.body.classList.add("leaving");

setTimeout(()=>{
window.location.href=target;
},850);
});
});
</script>

</body>
</html>
