<script>
const container=document.getElementById("globeViz");
const globe=new Globe(container,{
animateIn:true,
waitForGlobeReady:true
})
.globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-dark.jpg")
.bumpImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png")
.backgroundColor("#000000")
.showAtmosphere(true)
.atmosphereColor("#dfe7ee")
.atmosphereAltitude(.025)
.pointOfView({
lat:8,
lng:20,
altitude:4.55
},2400);
const controls=globe.controls();
controls.autoRotate=true;
controls.autoRotateSpeed=.1;
controls.enableZoom=false;
controls.enablePan=false;
controls.enableRotate=true;
controls.enableDamping=true;
controls.dampingFactor=.025;
function setupCrystal(){
const material=globe.globeMaterial();
if(!material)return;
material.color.setRGB(.82,.86,.9);
material.emissive.setRGB(.025,.035,.05);
material.emissiveIntensity=.28;
material.specular.setRGB(1,1,1);
material.shininess=1000;
material.bumpScale=6;
material.flatShading=true;
material.transparent=true;
material.opacity=.98;
material.needsUpdate=true;
}
setTimeout(setupCrystal,1800);
let time=0;
function animateCrystal(){
time+=.006;
const material=globe.globeMaterial();
if(material){
const pulse=(Math.sin(time)+1)/2;
material.emissiveIntensity=.2+(pulse*.3);
material.shininess=700+(pulse*700);
material.bumpScale=4.5+(pulse*2);
}
requestAnimationFrame(animateCrystal);
}
animateCrystal();
window.addEventListener("resize",()=>{
globe.width(window.innerWidth);
globe.height(window.innerHeight);
});
const music=document.getElementById("music");
music.volume=.45;
function startAudio(){
music.play().catch(()=>{});
}
document.addEventListener("click",startAudio,{once:true});
document.addEventListener("keydown",startAudio,{once:true});
