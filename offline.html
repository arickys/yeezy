<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">

<title>unYZY [OFFLINE]</title>

<style>
@font-face{
font-family:Yeezy;
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:Yeezy;
src:url("/fonts/yeezy_tstar-bold.webfont.woff") format("woff");
font-weight:700;
font-style:normal;
font-display:swap;
}

*{
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
margin:0;
}

body{
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(
circle at 50% 38%,
rgba(255,255,255,.075),
transparent 30%
),
radial-gradient(
circle at 50% 100%,
rgba(255,255,255,.025),
transparent 45%
),
#08090b;
color:#f5f5f6;
font-family:Yeezy,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(
rgba(255,255,255,.012) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.012) 1px,
transparent 1px
);
background-size:80px 80px;
opacity:.3;
mask-image:linear-gradient(
to bottom,
rgba(0,0,0,.7),
transparent 80%
);
}

.page{
width:min(560px,calc(100% - 40px));
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.logo-wrap{
position:relative;
width:150px;
height:150px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:34px;
}

.glow{
position:absolute;
width:80%;
height:55%;
border-radius:50%;
background:rgba(255,255,255,.09);
filter:blur(65px);
}

.logo{
position:relative;
z-index:2;
width:100%;
height:100%;
object-fit:contain;
filter:
drop-shadow(0 25px 55px rgba(0,0,0,.65))
drop-shadow(0 0 45px rgba(255,255,255,.06));
}

.label{
margin-bottom:12px;
color:#666c75;
font-size:9px;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
}

h1{
margin:0;
font-size:clamp(32px,7vw,48px);
line-height:.95;
letter-spacing:-2.5px;
font-weight:700;
}

p{
max-width:390px;
margin:16px auto 0;
color:#737983;
font-size:12px;
line-height:1.65;
}

.retry{
margin-top:27px;
height:41px;
padding:0 19px;
border:1px solid rgba(255,255,255,.12);
border-radius:9px;
background:rgba(255,255,255,.035);
color:#d9dade;
font-family:inherit;
font-size:11px;
font-weight:700;
cursor:pointer;
transition:
transform .2s ease,
background .2s ease,
border-color .2s ease;
}

.retry:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.075);
border-color:rgba(255,255,255,.2);
}

@media(prefers-reduced-motion:reduce){
.retry{
transition:none;
}
}
</style>
</head>

<body>

<main class="page">

<div class="logo-wrap">

<div class="glow"></div>

<img
class="logo"
src="/assets/LOGO2.png"
alt="unYZY"
>

</div>

<div class="label">
Connection Lost
</div>

<h1>
You're offline.
</h1>

<p>
unYZY couldn't connect to the internet. Check your connection and try again.
</p>

<button
class="retry"
onclick="location.reload()"
>
Try Again
</button>

</main>

</body>
</html>
