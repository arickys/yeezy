<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [DOWNLOADS]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html,
body{
margin:0;
min-height:100%;
background:var(--bg);
}

html{
view-transition-name:root;
}

body{
min-height:100vh;
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.065),transparent 30rem),
radial-gradient(circle at 20% 70%,rgba(255,255,255,.018),transparent 25rem);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translate3d(-50%,0,0);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(22px) saturate(150%);
-webkit-backdrop-filter:blur(22px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px rgba(255,255,255,.035);
view-transition-name:nav;
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:
color .18s ease,
background .18s ease,
transform .18s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
}

.nav a:active{
transform:scale(.94);
}

.container{
position:relative;
z-index:1;
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:130px 0 80px;
animation:pageIn .65s cubic-bezier(.22,1,.36,1) both;
}

.heading{
display:flex;
align-items:end;
justify-content:space-between;
gap:20px;
margin-bottom:25px;
}

.heading h1{
margin:0;
font-size:42px;
line-height:1;
letter-spacing:-2.5px;
font-weight:900;
}

.count{
color:var(--dim);
font-size:11px;
font-weight:750;
}

.search{
position:relative;
margin-bottom:15px;
}

.search input{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:var(--surface);
color:#fff;
font-size:13px;
transition:.18s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:#3b4049;
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#666c76;
font-size:17px;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
display:flex;
align-items:center;
gap:14px;
padding:14px;
border:1px solid var(--line);
border-radius:12px;
background:
linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.006)),
var(--surface);
transition:
transform .18s ease,
border-color .18s ease,
background .18s ease,
box-shadow .18s ease;
}

.file:hover{
transform:translate3d(0,-3px,0);
border-color:#373b44;
background:var(--surface2);
box-shadow:0 18px 40px rgba(0,0,0,.22);
}

.icon{
width:62px;
height:62px;
flex:0 0 62px;
overflow:hidden;
display:grid;
place-items:center;
border-radius:9px;
background:#181a1f;
color:#737983;
font-size:20px;
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:14px;
font-weight:800;
letter-spacing:-.2px;
}

.description{
margin-top:3px;
color:var(--muted);
font-size:11px;
}

.type{
margin-top:6px;
color:#606670;
font-size:9px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
}

.download{
height:35px;
padding:0 12px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
flex:0 0 auto;
border:1px solid #d1d2d5;
border-radius:8px;
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
font-size:11px;
font-weight:850;
transition:.18s ease;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translate3d(0,-1px,0);
}

.empty{
grid-column:1/-1;
padding:45px 20px;
border:1px dashed #292d34;
border-radius:11px;
text-align:center;
color:#707680;
font-size:12px;
}

.transition-cover{
position:fixed;
inset:0;
z-index:9999;
pointer-events:none;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
}

.transition-cover img{
width:320px;
height:320px;
object-fit:contain;
transform:scale(3.5);
opacity:0;
}

body.going-home .transition-cover{
visibility:visible;
animation:homeCover .8s cubic-bezier(.16,1,.3,1) forwards;
}

body.going-home .transition-cover img{
animation:homeLogo .8s cubic-bezier(.16,1,.3,1) forwards;
}

body.going-home .container{
animation:downloadsOut .55s cubic-bezier(.22,1,.36,1) forwards;
}

@keyframes homeCover{
0%{
opacity:0;
}
28%{
opacity:1;
}
100%{
opacity:1;
}
}

@keyframes homeLogo{
0%{
opacity:0;
transform:scale(3.8);
}
12%{
opacity:1;
}
58%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(.34);
}
}

@keyframes downloadsOut{
0%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(1.08);
}
}

@keyframes pageIn{
0%{
opacity:0;
transform:translate3d(0,28px,0) scale(.98);
}
100%{
opacity:1;
transform:translate3d(0,0,0) scale(1);
}
}

@keyframes vtOut{
from{
opacity:1;
transform:scale(1);
}
to{
opacity:0;
transform:scale(1.07);
}
}

@keyframes vtIn{
from{
opacity:0;
transform:scale(.93);
}
to{
opacity:1;
transform:scale(1);
}
}

::view-transition-old(root){
animation:vtOut .7s cubic-bezier(.22,1,.36,1) both;
}

::view-transition-new(root){
animation:vtIn .65s cubic-bezier(.22,1,.36,1) both;
}

::view-transition-group(main-logo){
animation-duration:.78s;
animation-timing-function:cubic-bezier(.16,1,.3,1);
}

::view-transition-old(main-logo){
animation:downloadLogoOut .78s cubic-bezier(.16,1,.3,1) both;
}

::view-transition-new(main-logo){
animation:downloadLogoIn .78s cubic-bezier(.16,1,.3,1) both;
}

@keyframes downloadLogoOut{
0%{
opacity:0;
transform:scale(.3);
}
42%{
opacity:1;
transform:scale(.8);
}
100%{
opacity:0;
transform:scale(4);
}
}

@keyframes downloadLogoIn{
0%{
opacity:0;
transform:scale(4);
}
45%{
opacity:1;
transform:scale(1.3);
}
100%{
opacity:1;
transform:scale(1);
}
}

@media(max-width:700px){

.downloads{
grid-template-columns:1fr;
}

.heading h1{
font-size:36px;
}

.container{
width:calc(100% - 24px);
}
}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.file{
padding:11px;
}

.icon{
width:54px;
height:54px;
flex-basis:54px;
}

.download{
padding:0 10px;
}

.download-text{
display:none;
}

.transition-cover img{
width:270px;
height:270px;
}
}

@media(prefers-reduced-motion:reduce){

.container{
animation:none;
}

::view-transition-old(root),
::view-transition-new(root),
::view-transition-old(main-logo),
::view-transition-new(main-logo){
animation:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" data-home-transition>Home</a>
<a href="downloads.html" class="active">Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="container">

<div class="heading">
<h1>Downloads</h1>
<div class="count" id="fileCount"></div>
</div>

<div class="search">
<div class="search-icon">⌕</div>
<input
id="search"
type="text"
placeholder="Search downloads..."
autocomplete="off"
>
</div>

<div class="downloads" id="downloadsList"></div>

</main>

<div class="transition-cover">
<img src="logo.png" alt="">
</div>

<script>
const files=[
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
}
];

const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");
const fileCount=document.getElementById("fileCount");

let navigating=false;

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function escapeAttr(value){
return escapeHTML(value);
}

function renderFiles(filter=""){
const value=filter.toLowerCase().trim();

const filtered=files.filter(file=>
file.name.toLowerCase().includes(value)||
file.description.toLowerCase().includes(value)
);

fileCount.textContent=
`${filtered.length} ${filtered.length===1?"file":"files"}`;

if(!filtered.length){
downloads.innerHTML=`
<div class="empty">
No downloads found.
</div>`;
return;
}

downloads.innerHTML=filtered.map(file=>`
<div class="file">

<div class="icon">
<img
src="${escapeAttr(file.icon)}"
alt=""
onerror="this.style.display='none';this.parentElement.textContent='📦'"
>
</div>

<div class="info">
<div class="name">${escapeHTML(file.name)}</div>
<div class="description">${escapeHTML(file.description)}</div>
<div class="type">ZIP Archive</div>
</div>

<a
class="download"
href="${escapeAttr(file.file)}"
download
>
<span>↓</span>
<span class="download-text">Download</span>
</a>

</div>
`).join("");
}

async function goHome(url){

if(navigating)return;

navigating=true;

if(document.startViewTransition){

const transition=document.startViewTransition(()=>{
window.location.href=url;
});

try{
await transition.finished;
}catch{}

return;
}

document.body.classList.add("going-home");

setTimeout(()=>{
window.location.href=url;
},780);
}

document
.querySelector("[data-home-transition]")
.addEventListener("click",event=>{

if(
event.button!==0||
event.metaKey||
event.ctrlKey||
event.shiftKey||
event.altKey
)return;

event.preventDefault();

goHome("index.html");
});

search.addEventListener("input",()=>{
renderFiles(search.value);
});

renderFiles();
</script>

</body>
</html>
