<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [UPDATES]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#353a43;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5c626c;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -15%,rgba(255,255,255,.07),transparent 32rem),
radial-gradient(circle at 10% 70%,rgba(255,255,255,.018),transparent 28rem),
radial-gradient(circle at 90% 80%,rgba(255,255,255,.014),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.012);
transition:
opacity .65s ease,
transform .8s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.011) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.011) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 72%);
opacity:.28;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(
ellipse at center,
transparent 45%,
rgba(0,0,0,.32)
);
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(11,12,15,.72);
backdrop-filter:blur(26px) saturate(150%);
-webkit-backdrop-filter:blur(26px) saturate(150%);
box-shadow:
0 18px 55px rgba(0,0,0,.42),
inset 0 1px 0 rgba(255,255,255,.035);
}

.nav a{
position:relative;
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#707680;
text-decoration:none;
font-size:12px;
font-weight:750;
letter-spacing:-.15px;
transition:
color .2s ease,
background .2s ease,
transform .2s ease;
}

.nav a:before{
content:"";
position:absolute;
left:50%;
bottom:5px;
width:0;
height:1px;
background:#fff;
opacity:.7;
transform:translateX(-50%);
transition:width .22s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.nav a:hover:before{
width:14px;
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.04),
0 2px 9px rgba(0,0,0,.18);
}

.nav a.active:before{
width:14px;
}

.nav a:active{
transform:scale(.95);
}

.container{
width:min(1080px,calc(100% - 36px));
margin:auto;
padding:135px 0 90px;
}

.page-header{
position:relative;
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:40px;
padding-bottom:28px;
border-bottom:1px solid var(--line);
}

.page-header:after{
content:"";
position:absolute;
left:0;
bottom:-1px;
width:85px;
height:1px;
background:#fff;
}

.header-copy{
min-width:0;
}

.logo-area{
width:86px;
height:86px;
margin-bottom:23px;
perspective:700px;
display:flex;
align-items:center;
justify-content:center;
}

.logo{
width:86px;
height:86px;
display:block;
object-fit:contain;
filter:
drop-shadow(0 18px 30px rgba(0,0,0,.5))
drop-shadow(0 0 34px rgba(255,255,255,.06));
transform-style:preserve-3d;
animation:
logoSpin 7s cubic-bezier(.45,.05,.55,.95) infinite,
logoFloat 5s ease-in-out infinite;
backface-visibility:visible;
}

@keyframes logoSpin{
0%{
transform:rotateY(0deg);
}
18%{
transform:rotateY(70deg);
}
35%{
transform:rotateY(150deg);
}
50%{
transform:rotateY(180deg);
}
65%{
transform:rotateY(220deg);
}
82%{
transform:rotateY(290deg);
}
100%{
transform:rotateY(360deg);
}
}

@keyframes logoFloat{
0%,100%{
margin-top:0;
}
50%{
margin-top:-7px;
}
}

.page-title{
margin:0;
font-size:clamp(48px,6vw,70px);
line-height:.9;
letter-spacing:-4px;
font-weight:900;
}

.page-subtitle{
margin-top:14px;
color:var(--muted);
font-size:12px;
line-height:1.5;
}

.header-side{
display:flex;
align-items:center;
gap:10px;
padding-bottom:4px;
}

.header-dot{
width:7px;
height:7px;
border-radius:50%;
background:#e9e9eb;
box-shadow:0 0 14px rgba(255,255,255,.35);
animation:pulse 2.2s ease-in-out infinite;
}

.header-label{
color:#686e78;
font-size:9px;
font-weight:800;
letter-spacing:1.2px;
text-transform:uppercase;
}

@keyframes pulse{
0%,100%{
opacity:.45;
transform:scale(.85);
}
50%{
opacity:1;
transform:scale(1);
}
}

.updates{
margin-top:25px;
display:grid;
gap:10px;
}

.update{
position:relative;
display:grid;
grid-template-columns:130px minmax(0,1fr) auto;
gap:25px;
align-items:center;
min-height:110px;
padding:19px 20px;
border:1px solid var(--line);
border-radius:13px;
background:
linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.006)),
var(--surface);
overflow:hidden;
transition:
transform .25s cubic-bezier(.22,1,.36,1),
border-color .2s ease,
background .2s ease,
box-shadow .25s ease;
}

.update:before{
content:"";
position:absolute;
left:0;
top:0;
bottom:0;
width:2px;
background:transparent;
transition:background .25s ease;
}

.update:hover{
transform:translateY(-3px);
border-color:#373c45;
background:var(--surface2);
box-shadow:
0 20px 45px rgba(0,0,0,.23),
inset 0 1px 0 rgba(255,255,255,.025);
}

.update:hover:before{
background:#fff;
}

.update:first-child{
border-color:#30343c;
}

.update:first-child:before{
background:#fff;
}

.update-date{
color:#686e78;
font-size:9px;
font-weight:850;
letter-spacing:1.15px;
text-transform:uppercase;
}

.update-content{
min-width:0;
}

.update-title{
margin:0;
font-size:15px;
line-height:1.2;
font-weight:850;
letter-spacing:-.3px;
}

.update-description{
margin-top:7px;
max-width:680px;
color:#777d87;
font-size:11px;
line-height:1.55;
}

.update-tag{
height:27px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 10px;
border:1px solid #2c3037;
border-radius:7px;
background:rgba(255,255,255,.025);
color:#777d87;
font-size:9px;
font-weight:850;
letter-spacing:.85px;
text-transform:uppercase;
white-space:nowrap;
}

.update:first-child .update-tag{
color:#e1e2e4;
border-color:#444952;
background:rgba(255,255,255,.06);
}

.empty{
padding:55px 20px;
border:1px dashed #292d34;
border-radius:12px;
text-align:center;
color:#656b75;
font-size:12px;
}

.page-transition{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
overflow:hidden;
}

.page-transition:before{
content:"";
position:absolute;
width:420px;
height:420px;
border-radius:50%;
background:rgba(255,255,255,.055);
filter:blur(90px);
opacity:0;
transition:opacity .6s ease;
}

.page-transition.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.page-transition.show:before{
opacity:1;
}

.transition-logo{
position:relative;
z-index:2;
width:min(270px,58vw);
height:min(270px,58vw);
object-fit:contain;
opacity:0;
transform:
perspective(700px)
rotateY(-90deg)
scale(.7);
filter:
drop-shadow(0 30px 60px rgba(0,0,0,.7))
drop-shadow(0 0 55px rgba(255,255,255,.08));
}

.page-transition.show .transition-logo{
opacity:1;
transform:
perspective(700px)
rotateY(0deg)
scale(1);
transition:
opacity .4s ease,
transform .75s cubic-bezier(.16,1,.3,1);
}

.page-transition.fade .transition-logo{
opacity:0;
transform:
perspective(700px)
rotateY(90deg)
scale(1.08);
transition:
opacity .38s ease,
transform .48s cubic-bezier(.7,0,.84,0);
}

@media(max-width:750px){

.container{
width:calc(100% - 24px);
}

.page-header{
align-items:flex-start;
}

.header-side{
display:none;
}

.update{
grid-template-columns:1fr auto;
gap:12px;
align-items:start;
}

.update-date{
grid-column:1/-1;
}

.update-content{
grid-column:1/-1;
}

.update-tag{
position:absolute;
right:16px;
top:16px;
}

.update-title{
padding-right:75px;
}

}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
height:33px;
min-width:70px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.logo-area{
width:72px;
height:72px;
margin-bottom:20px;
}

.logo{
width:72px;
height:72px;
}

.page-title{
font-size:45px;
letter-spacing:-3px;
}

.page-subtitle{
font-size:11px;
}

.updates{
margin-top:20px;
}

.update{
padding:16px;
min-height:0;
}

.update-tag{
right:14px;
top:14px;
}

.update-title{
font-size:14px;
padding-right:65px;
}

.update-description{
font-size:11px;
}

}

@media(prefers-reduced-motion:reduce){

body{
transition:none;
}

.logo{
animation:none;
}

.header-dot{
animation:none;
}

.page-transition .transition-logo{
transition:none;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" data-page="home">Home</a>
<a href="downloads.html" data-page="downloads">Downloads</a>
<a href="updates.html" data-page="updates" class="active">Updates</a>
</nav>

<main class="container">

<header class="page-header">

<div class="header-copy">

<div class="logo-area">
<img class="logo" src="LOGO2.png" alt="">
</div>

<h1 class="page-title">Updates</h1>

<div class="page-subtitle">
Changes, additions, and new releases.
</div>

</div>

<div class="header-side">
<div class="header-dot"></div>
<div class="header-label">Live</div>
</div>

</header>

<section class="updates">

<article class="update">

<div class="update-date">
AUG 30, 2026
</div>

<div class="update-content">
<h2 class="update-title">Archive launch</h2>
<div class="update-description">
The archive is now live with the first available release.
</div>
</div>

<div class="update-tag">New</div>

</article>

<article class="update">

<div class="update-date">
AUG 30, 2026
</div>

<div class="update-content">
<h2 class="update-title">New archive layout</h2>
<div class="update-description">
Downloads and updates now have their own dedicated pages.
</div>
</div>

<div class="update-tag">Site</div>

</article>

</section>

</main>

<div class="page-transition" id="pageTransition">
<img class="transition-logo" id="transitionLogo" src="LOGO2.png" alt="">
</div>

<script>
const pageTransition=document.getElementById("pageTransition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");

function startTransition(url){
if(document.body.classList.contains("leaving"))return;

document.body.classList.add("leaving");
pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
},620);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition","1");
window.location.href=url;
},900);
}

links.forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();

if(link.classList.contains("active"))return;

startTransition(link.href);
});
});

function enterPage(){
const transition=sessionStorage.getItem("unyzyTransition");

sessionStorage.removeItem("unyzyTransition");

if(transition){

pageTransition.classList.add("active");

requestAnimationFrame(()=>{
pageTransition.classList.add("show");
});

setTimeout(()=>{
pageTransition.classList.add("fade");
document.body.classList.add("ready");
},560);

setTimeout(()=>{
pageTransition.classList.remove("active","show","fade");
},1000);

}else{

requestAnimationFrame(()=>{
document.body.classList.add("ready");
});

}
}

enterPage();
</script>

</body>
</html>
