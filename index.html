<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>unYZY [HOME]</title>

<style>
@font-face{
font-family:YeezyTSTAR;
src:url("/fonts/yeezy_tstar-regular-webfont.woff") format("woff");
font-weight:400;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:YeezyTSTAR;
src:url("/fonts/yeezy_tstar-bold-webfont.woff") format("woff");
font-weight:700 950;
font-style:normal;
font-display:swap;
}

*{box-sizing:border-box}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:rgba(255,255,255,.075);
--text:#f4f4f5;
--muted:#858a93;
}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 50% -20%,rgba(255,255,255,.075),transparent 32rem),
radial-gradient(circle at 0 80%,rgba(255,255,255,.018),transparent 28rem),
var(--bg);
color:var(--text);
font-family:YeezyTSTAR,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
opacity:0;
transform:scale(1.015);
transition:opacity .6s ease,transform .75s cubic-bezier(.22,1,.36,1);
}

body.ready{
opacity:1;
transform:scale(1);
}

body.leaving{
opacity:0;
transform:scale(.985);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:80px 80px;
mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 75%);
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(10,11,14,.78);
backdrop-filter:blur(25px) saturate(150%);
box-shadow:0 18px 55px rgba(0,0,0,.4);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#737983;
text-decoration:none;
font-size:12px;
font-weight:700;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.09);
}

.hero{
width:min(1040px,calc(100% - 36px));
min-height:100vh;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:100px 0;
}

.hero-content{
display:flex;
flex-direction:column;
align-items:center;
}

.logo{
width:150px;
height:150px;
object-fit:contain;
filter:
drop-shadow(0 30px 60px rgba(0,0,0,.6))
drop-shadow(0 0 45px rgba(255,255,255,.06));
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

.title{
margin:28px 0 0;
font-size:clamp(55px,9vw,100px);
line-height:.82;
letter-spacing:-5px;
font-weight:900;
}

.subtitle{
margin-top:18px;
color:var(--muted);
font-size:13px;
letter-spacing:.1px;
}

.actions{
display:flex;
gap:9px;
margin-top:30px;
}

.button{
height:42px;
padding:0 18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:9px;
border:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.035);
color:#d8d9dc;
text-decoration:none;
font-size:11px;
font-weight:700;
transition:.2s ease;
}

.button:hover{
background:rgba(255,255,255,.08);
border-color:rgba(255,255,255,.18);
transform:translateY(-2px);
}

.button.primary{
background:#e8e8e9;
color:#090a0c;
border-color:#e8e8e9;
}

.button.primary:hover{
background:#fff;
border-color:#fff;
}

.transition{
position:fixed;
inset:0;
z-index:999;
display:grid;
place-items:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
}

.transition.active{
opacity:1;
visibility:visible;
}

.transition img{
width:min(300px,60vw);
height:min(300px,60vw);
object-fit:contain;
opacity:0;
transform:scale(.7);
filter:drop-shadow(0 30px 60px rgba(0,0,0,.7));
}

.transition.show img{
opacity:1;
transform:scale(1);
transition:opacity .5s ease,transform .7s cubic-bezier(.22,1,.36,1);
}

.transition.fade img{
opacity:0;
transform:scale(1.08);
transition:opacity .4s ease,transform .45s ease;
}

@media(max-width:600px){
.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
font-size:11px;
padding:0 10px;
}

.hero{
width:calc(100% - 24px);
}

.logo{
width:120px;
height:120px;
}

.title{
font-size:58px;
letter-spacing:-3.5px;
}

.subtitle{
font-size:11px;
}

.actions{
width:100%;
}

.button{
flex:1;
}
}

@media(prefers-reduced-motion:reduce){
body,.transition img,.button{
transition:none;
}

.logo{
animation:none;
}
}
</style>
</head>

<body>

<nav class="nav">
<a href="/" class="active" data-page="home">Home</a>
<a href="/downloads" data-page="downloads">Downloads</a>
<a href="/updates" data-page="updates">Updates</a>
</nav>

<main class="hero">
<div class="hero-content">

<img class="logo" src="/assets/LOGO2.png" alt="unYZY">

<h1 class="title">unYZY</h1>

<div class="subtitle">
An archive for everything Yeezy.
</div>

<div class="actions">
<a class="button primary" href="/downloads" data-page="downloads">Browse Archive</a>
<a class="button" href="/updates" data-page="updates">View Updates</a>
</div>

</div>
</main>

<div class="transition" id="transition">
<img id="transitionLogo" src="/assets/LOGO2.png" alt="">
</div>

<script>
const transition=document.getElementById("transition");
const transitionLogo=document.getElementById("transitionLogo");
const links=document.querySelectorAll("[data-page]");
let navigating=false;

function getLogo(target){
return target==="home"
?"/assets/logo.png"
:"/assets/LOGO2.png";
}

function navigate(url,target){
if(navigating)return;

navigating=true;
document.body.classList.add("leaving");

transitionLogo.src=getLogo(target);
transition.classList.add("active");

requestAnimationFrame(()=>{
transition.classList.add("show");
});

setTimeout(()=>{
transition.classList.add("fade");
},620);

setTimeout(()=>{
sessionStorage.setItem("unyzyTransition",target);
location.href=url;
},880);
}

links.forEach(link=>{
link.addEventListener("click",e=>{
e.preventDefault();
navigate(link.href,link.dataset.page);
});
});

function enter(){
const target=sessionStorage.getItem("unyzyTransition");
sessionStorage.removeItem("unyzyTransition");

if(target){
transitionLogo.src=getLogo(target);
transition.classList.add("active");

requestAnimationFrame(()=>{
transition.classList.add("show");
});

setTimeout(()=>{
transition.classList.add("fade");
document.body.classList.add("ready");
},500);

setTimeout(()=>{
transition.classList.remove("active","show","fade");
},930);
}else{
requestAnimationFrame(()=>{
document.body.classList.add("ready");
});
}
}

enter();
</script>

</body>
</html>
