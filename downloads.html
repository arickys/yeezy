<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>unYZY [DOWNLOADS]</title>

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#08090b;
--surface:#101216;
--surface2:#15171c;
--line:#22252b;
--line2:#343941;
--text:#f5f5f6;
--muted:#858b95;
--dim:#5e646e;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -18%,rgba(255,255,255,.06),transparent 30rem),
var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

a{
color:inherit;
}

.nav{
position:fixed;
top:20px;
left:50%;
z-index:100;
transform:translateX(-50%);
display:flex;
gap:3px;
padding:5px;
border:1px solid rgba(255,255,255,.085);
border-radius:14px;
background:rgba(12,13,16,.78);
backdrop-filter:blur(24px) saturate(150%);
-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:
0 15px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.035);
animation:navIn .65s cubic-bezier(.16,1,.3,1);
}

.nav a{
height:35px;
min-width:78px;
display:flex;
align-items:center;
justify-content:center;
padding:0 14px;
border-radius:9px;
color:#747a84;
text-decoration:none;
font-size:12px;
font-weight:750;
transition:.2s ease;
}

.nav a:hover{
color:#fff;
background:rgba(255,255,255,.055);
}

.nav a.active{
color:#fff;
background:rgba(255,255,255,.095);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}

.container{
width:min(1120px,calc(100% - 36px));
margin:auto;
padding:130px 0 80px;
animation:
contentIn .8s cubic-bezier(.16,1,.3,1) both;
}

.heading{
display:flex;
align-items:end;
justify-content:space-between;
gap:20px;
margin-bottom:25px;
}

.heading h1{
margin:0;
font-size:42px;
line-height:1;
letter-spacing:-2.5px;
font-weight:900;
}

.count{
color:var(--dim);
font-size:11px;
font-weight:750;
}

.search{
position:relative;
margin-bottom:15px;
}

.search input{
width:100%;
height:46px;
padding:0 16px 0 43px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:var(--surface);
color:#fff;
font-size:13px;
transition:.2s ease;
}

.search input::placeholder{
color:#5d626b;
}

.search input:focus{
border-color:#3b4049;
background:#121419;
box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

.search-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#666c76;
font-size:17px;
}

.downloads{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.file{
display:flex;
align-items:center;
gap:14px;
padding:14px;
border:1px solid var(--line);
border-radius:12px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.025),
rgba(255,255,255,.006)
),
var(--surface);
transition:.2s ease;
}

.file:hover{
transform:translateY(-3px);
border-color:#373b44;
background:var(--surface2);
box-shadow:0 18px 40px rgba(0,0,0,.22);
}

.icon{
width:62px;
height:62px;
flex:0 0 62px;
overflow:hidden;
display:grid;
place-items:center;
border-radius:9px;
background:#181a1f;
color:#737983;
font-size:20px;
}

.icon img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.info{
min-width:0;
flex:1;
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:14px;
font-weight:800;
letter-spacing:-.2px;
}

.description{
margin-top:3px;
color:var(--muted);
font-size:11px;
}

.type{
margin-top:6px;
color:#606670;
font-size:9px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
}

.download{
height:35px;
padding:0 12px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
flex:0 0 auto;
border:1px solid #d1d2d5;
border-radius:8px;
background:#e7e7e9;
color:#090a0c;
text-decoration:none;
font-size:11px;
font-weight:850;
transition:.18s ease;
}

.download:hover{
background:#fff;
border-color:#fff;
transform:translateY(-1px);
}

.empty{
grid-column:1/-1;
padding:45px 20px;
border:1px dashed #292d34;
border-radius:11px;
text-align:center;
color:#707680;
font-size:12px;
}

.page-transition{
position:fixed;
inset:0;
z-index:1000;
display:flex;
align-items:center;
justify-content:center;
background:#08090b;
opacity:0;
visibility:hidden;
pointer-events:none;
overflow:hidden;
}

.transition-logo{
position:absolute;
width:320px;
height:320px;
object-fit:contain;
}

.transition-logo.first{
opacity:0;
transform:scale(2.5);
filter:
drop-shadow(0 0 90px rgba(255,255,255,.15));
}

.transition-logo.second{
opacity:0;
transform:scale(2.5);
filter:
drop-shadow(0 0 100px rgba(255,255,255,.18));
}

body.entering .page-transition{
visibility:visible;
opacity:1;
animation:transitionOut 1.05s cubic-bezier(.16,1,.3,1) forwards;
}

body.entering .transition-logo.first{
animation:logoReturn 1.05s cubic-bezier(.16,1,.3,1) forwards;
}

body.entering .transition-logo.second{
animation:logoReturnSecond 1.05s cubic-bezier(.16,1,.3,1) .08s forwards;
}

@keyframes transitionOut{
0%{
opacity:1;
}

65%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}
}

@keyframes logoReturn{
0%{
opacity:0;
transform:scale(2.5);
}

25%{
opacity:1;
}

100%{
opacity:0;
transform:scale(.7);
}
}

@keyframes logoReturnSecond{
0%{
opacity:0;
transform:scale(2.5);
}

25%{
opacity:1;
}

100%{
opacity:0;
transform:scale(.7);
}
}

@keyframes contentIn{
0%{
opacity:0;
transform:translateY(28px) scale(.985);
filter:blur(5px);
}

100%{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}
}

@keyframes navIn{
0%{
opacity:0;
transform:translate(-50%,-25px) scale(.94);
}

100%{
opacity:1;
transform:translate(-50%,0) scale(1);
}
}

@media(max-width:700px){

.downloads{
grid-template-columns:1fr;
}

.heading h1{
font-size:36px;
}

.container{
width:calc(100% - 24px);
}
}

@media(max-width:560px){

.nav{
top:12px;
}

.nav a{
min-width:70px;
height:33px;
padding:0 10px;
font-size:11px;
}

.container{
padding-top:105px;
}

.file{
padding:11px;
}

.icon{
width:54px;
height:54px;
flex-basis:54px;
}

.download{
padding:0 10px;
}

.download-text{
display:none;
}

.transition-logo{
width:260px;
height:260px;
}
}

@media(prefers-reduced-motion:reduce){

.container,
.nav,
.transition-logo{
animation:none!important;
}
}
</style>

</head>

<body>

<nav class="nav">
<a href="index.html" data-transition>Home</a>
<a href="downloads.html" class="active">Downloads</a>
<a href="news.html">News</a>
</nav>

<main class="container">

<div class="heading">
<h1>Downloads</h1>
<div class="count" id="fileCount"></div>
</div>

<div class="search">
<div class="search-icon">⌕</div>
<input
id="search"
type="text"
placeholder="Search downloads..."
autocomplete="off"
>
</div>

<div class="downloads" id="downloadsList"></div>

</main>

<div class="page-transition">

<img
class="transition-logo first"
src="logo.png"
alt=""

>

<img
class="transition-logo second"
src="LOGO2.png"
alt=""

>

</div>

<script>
const files=[
{
name:"IN A PERFECT WORLD",
description:"10/10",
file:"IN A PERFECT WORLD.zip",
icon:"IAPW.png"
}
];

const downloads=document.getElementById("downloadsList");
const search=document.getElementById("search");
const fileCount=document.getElementById("fileCount");

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function escapeAttr(value){
return escapeHTML(value);
}

function renderFiles(filter=""){
const value=filter.toLowerCase().trim();

const filtered=files.filter(file=>
file.name.toLowerCase().includes(value)||
file.description.toLowerCase().includes(value)
);

fileCount.textContent=
`${filtered.length} ${filtered.length===1?"file":"files"}`;

if(!filtered.length){
downloads.innerHTML=`
<div class="empty">
No downloads found.
</div>`;
return;
}

downloads.innerHTML=filtered.map(file=>`
<div class="file">

<div class="icon">
<img
src="${escapeAttr(file.icon)}"
alt=""
onerror="this.style.display='none';this.parentElement.textContent='📦'"
>
</div>

<div class="info">
<div class="name">${escapeHTML(file.name)}</div>
<div class="description">${escapeHTML(file.description)}</div>
<div class="type">ZIP Archive</div>
</div>

<a
class="download"
href="${escapeAttr(file.file)}"
download
>
<span>↓</span>
<span class="download-text">Download</span>
</a>

</div>
`).join("");
}

search.addEventListener("input",()=>{
renderFiles(search.value);
});

const transitionLinks=document.querySelectorAll("[data-transition]");

transitionLinks.forEach(link=>{
link.addEventListener("click",event=>{
event.preventDefault();

const target=link.href;

document.body.classList.add("leaving");

setTimeout(()=>{
window.location.href=target;
},850);
});
});

renderFiles();

if(document.referrer){
document.body.classList.add("entering");

setTimeout(()=>{
document.body.classList.remove("entering");
},1100);
}
</script>

</body>
</html>
